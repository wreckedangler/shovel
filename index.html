<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schaufelheld">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Schaufelheld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="screen"></canvas>
<div id="touch" hidden>
  <div class="pad">
    <button data-k="left" aria-label="Links">◀</button>
    <button data-k="down" aria-label="Schaufel nach unten">▼</button>
    <button data-k="right" aria-label="Rechts">▶</button>
  </div>
  <div class="acts">
    <button data-k="attack" class="b" aria-label="Schaufel">B</button>
    <button data-k="jump" class="a" aria-label="Springen">A</button>
  </div>
</div>
<button id="pauseBtn" hidden aria-label="Pause">II</button>
<div id="ui" hidden></div>
<div id="rotate"><div class="ph"></div><p>Bitte Handy quer halten</p></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
