name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/test.mjs
      - run: node tools/hunttest.mjs
      - run: node tools/geartest.mjs
      - run: node tools/settest.mjs
      - run: node tools/bosscheck.mjs
      - run: node tools/aitest.mjs
      - run: node tools/audit.mjs
      - run: node tools/balance.mjs
      - run: node tools/arenatest.mjs 24
      - run: node tools/livetest.mjs
      - run: node tools/roamertest.mjs
      - run: node tools/dueltest.mjs
      - run: node tools/gentest.mjs 1000
      - name: Suchbot-Stichprobe (Qualpfad 1, generiertes Level)
        run: |
          BEAM=40 timeout 600 node tools/solve.mjs Q-1 4 4
          GEN=1000:1 BEAM=30 timeout 600 node tools/solve.mjs gen
      - run: node tools/bundle.mjs
      - name: Typprüfung (JSDoc, ausgewählte Module)
        run: npx -y -p typescript@5 tsc -p jsconfig.json
      - name: Probeläufe nachspielen
        run: node tools/replaytest.mjs
