nconst W23 = build([\n  seg('..........GGG.......',\n      '..........m.........',\n      '.P..................',\n      '#######.........####',\n      '#######.........####',\n      '#######.........####'),\n  seg('..............GGG...',\n      '........GGG.........',\n      '.......=====........',\n      '..........u.........',\n      '', '', '',\n      '...V..........V.....',\n      '#####^^^^^^^^#######', G3, G3),\n  seg('......====..........',\n      '..C...k....z....k...', G3, G3, G3),\n  seg('....GG..............',\n      '....................',\n      '...........#########',\n      '...........#########',\n      '...........#########',\n      '......n....#########',\n      '...........#########',\n      '...........#########', G3, G3, G3),\n  seg('........u......RRR..',\n      '...k...........RTR..',\n      G3, G3, G3, G3, G3, G3, G3, G3, G3),\n  seg('#####...............',\n      '#####...............',\n      '#####...GGG.........',\n      '#####...............',\n      '#####...............',\n      '#####...z....E......', G3, G3, G3),\n]);\n\n/* ---------- 2-B Pendelwerk ---------- */\nconst WB = [\n  '####################################',\n  '####################################',\n  '...................................#',\n  '...................................#',\n  '...................................#',\n  '...................................#',\n  '...................................#',\n  '...................................#',\n  '...................................#',\n  '..............m.........m..........#',\n  '.P..h..C..................W........#',\n  '####################################',\n  '####################################',\n  '####################################',\n];\n\nexport const WORLDS = [\n  { id: 1, name: 'Wurzelgrund', levels: ['1-1', '1-2', '1-3', '1-B'] },\n  { id: 2, name: 'Uhrturm von Zahnfels', levels: ['2-1', '2-2', '2-3', '2-B'] },\n];\n\nexport const LEVELS = [\n  { id: '1-1', name: 'Moosweg', theme: 'wald', map: L1, par: 40,\n    signs: ['◀ ▶ LAUFEN · A SPRINGEN',\n            'B = SCHAUFEL. GRAB DIE ERDHAUFEN AUS!',\n            'IN DER LUFT ▼ HALTEN = SCHAUFEL-SPRUNG. SPRING SO AUF GEGNER!',\n            'STEIN? DAFÜR BRAUCHST DU EINE EISEN-SCHAUFEL. KOMM SPÄTER WIEDER!'] },\n  { id: '1-2', name: 'Wurzelhöhlen', theme: 'hoehle', map: L2, par: 55,\n    signs: ['ERDBLÖCKE ZERFALLEN BEIM SCHAUFEL-SPRUNG. WO LANDEST DU DANN?'] },\n  { id: '1-3', name: 'Dornenkamm', theme: 'dornen', map: L3S, par: 65,\n    signs: ['PILZE FEDERN DICH HOCH. MIT ▼ SCHAUFEL-SPRUNG NOCH HÖHER!',\n            'ZU HOCH? SPRING, HALTE ▼ UND LANDE AUF DEM PILZ!'] },\n  { id: '1-B', name: 'Bau des Rostmaulwurfs', theme: 'bau', map: LB, gate: 10, boss: true, par: 80,\n    signs: [] },\n  { id: '2-1', name: 'Zahnradgasse', theme: 'uhrturm', map: W21, par: 60,\n    signs: ['ZAHNRITTER BLOCKEN VORNE MIT DEM SCHILD. SPRING DRAUF ODER TRIFF SIE VON HINTEN!',\n            'SCHWEBEPLATTFORMEN TRAGEN DICH MIT. ▼ + A: DURCHFALLEN.',\n            'DAMPFSTÖSSE HEBEN DICH HOCH. WARTE AUF DEN NÄCHSTEN STOSS!'] },\n  { id: '2-2', name: 'Dampfschacht', theme: 'uhrturm', map: W22, par: 50,\n    signs: ['DER SCHACHT FÜHRT NACH OBEN. OBEN WARTET DIE TURMUHR.'] },\n  { id: '2-3', name: 'Glockenstuhl', theme: 'glocke', map: W23, par: 75, signs: [] },\n  { id: '2-B', name: 'Das Pendelwerk', theme: 'pendel', map: WB, gate: 10, boss: true, par: 90, signs: [] },\n];\n\nexport const levelById = id => LEVELS.find(l => l.id === id);\n","main.js":"// Start, Hauptschleife und Menüs.\nimport { Game } from './game.js';\nimport { LEVELS, WORLDS, levelById } from './levels.js';\nimport { THEMES } from './themes.js';\nimport { TIERS, SHOVEL, ARMOR, PRICE, AVAILABLE } from './gear.js';\nimport { Renderer } from './render.js';\nimport { initInput, pollInput, clearInput } from './input.js';\nimport { unlockAudio, sfx, playMusic, stopMusic, setAudio } from './audio.js';\nimport { encodeGhost, decodeGhost, fmtTime } from './ghost.js';\nimport { save } from './save.js';\nimport { online, uploadGhost, topGhosts } from './online.js';\nimport * as S from './sprites.js';\nimport { WEAPONS, RARITY, weaponById } from './weapons.js';\n\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst canvas = $('#screen'), ctx = canvas.getContext('2d');\nconst ui = $('#ui'), touchEl = $('#touch'), pauseBtn = $('#pauseBtn');\nconst R = new Renderer(ctx);\nconst VH = 180;\nlet VW = 320;\nconst D = save.d;\nsetAudio(D.sfx, D.music);\n\nlet curCodes = [], mode = 'menu', game = null, ghosts = [], level = null, doneT = 0, menuT = 0;\nconst isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;\n\nfunction resize() {\n  VW = Math.max(240, Math.min(400, Math.round(VH * innerWidth / innerHeight)));\n  canvas.width = VW; canvas.height = VH; ctx.imageSmoothingEnabled = false;\n  const sc = Math.min(innerWidth / VW, innerHeight / VH);\n  canvas.style.width = VW * sc + 'px'; canvas.style.height = VH * sc + 'px';\n  R.resize(VW, VH);\n}\naddEventListener('resize', resize); resize();\n\ninitInput(touchEl, () => unlockAudio());\naddEventListener('pointerdown', () => unlockAudio(), { capture: true });\naddEventListener('keydown', e => { if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'play') pause(); else if (mode === 'pause') resume(); } });\ndocument.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pause(); });\npauseBtn.addEventListener('click', () => mode === 'play' && pause());\n\n/* ---------- Hauptschleife ---------- */\nlet last = performance.now(), acc = 0;\nfunction loop(now) {\n  acc += Math.min(100, now - last); last = now;\n  while (acc >= 1000 / 60) { acc -= 1000 / 60; tick(); }\n  draw();\n  requestAnimationFrame(loop);\n}\nfunction tick() {\n  if (mode !== 'play' && mode !== 'won') { menuT++; return; }\n  const inp = mode === 'play' ? pollInput() : { };\n  game.step(inp);\n  for (const e of game.events) {\n    sfx(e.name, e.v);\n    if (e.name === 'unlock') unlockWeapon(e.v, true);\n    if (e.name === 'chest' && e.v) { D.chests[e.v] = true; save.write(); if (Object.keys(D.chests).filter(k => k.startsWith('1-')).length >= 3) unlockWeapon('goldschaufel', true); }\n    if (e.name === 'die') { D.deathsTotal++; save.write(); if (D.deathsTotal >= 20) unlockWeapon('seelenschaufel', true); }\n  }\n  if (game.done && mode === 'play') { mode = 'won'; doneT = 0; touchEl.hidden = true; pauseBtn.hidden = true; }\n  if (mode === 'won' && ++doneT === 80) finish();\n}\nfunction draw() {\n  if (game && mode !== 'menu') { R.draw(game, ghosts); return; }\n  drawMenuBg();\n}\nfunction drawMenuBg() {\n  const th = THEMES.karte, bg = S.backdrop(th, VH), t = menuT;\n  ctx.drawImage(bg.sky, 0, 0, VW, VH);\n  ctx.fillStyle = th.stars; for (const s of bg.stars) if ((t / 20 + s.p) % 6 > 1) ctx.fillRect(s.x % VW, s.y, 1, 1);\n  for (const [img, f] of [[bg.far, 0.15], [bg.near, 0.4]]) { const ox = -Math.round(t * f) % img.width; for (let k = ox - img.width; k < VW; k += img.width) ctx.drawImage(img, k, 0); }\n  const ts = S.tileset(th);\n  for (let x = -1; x < VW / 16 + 1; x++) { const px = x * 16 - (t % 16); ctx.drawImage(ts.top[(x + 99 + Math.floor(t / 16)) % 3], px, VH - 20); ctx.drawImage(ts.fill[0], px, VH - 4); }\n  const hs = S.hero(D.armor, D.shovel, D.weapon);\n  R.x = ctx; R.figure(hs, 40, VH - 34, 1, 1, t, 8);\n}\n\n/* ---------- Spielen ---------- */\nasync function startLevel(id, ghostCodes = []) {\n  level = levelById(id); curCodes = ghostCodes;\n  game = new Game(level, { shovel: D.shovel, armor: D.armor, weapon: D.weapon }, { seed: 7 });\n  ghosts = [];\n  for (const c of ghostCodes) { const g = await decodeGhost(c); if (g && g.level === id) { g.own = c === D.ghosts[id]; ghosts.push(g); } }\n  R.snapCamera(game);\n  clearInput();\n  hideUI(); mode = 'play';\n  touchEl.hidden = !isTouch; pauseBtn.hidden = false;\n  playMusic(THEMES[level.theme].music);\n  tryLandscape();\n}\nfunction pause() { mode = 'pause'; touchEl.hidden = true; pauseBtn.hidden = true; sfx('click'); show(`\n  <div class=\"panel small\"><h2>Pause</h2>\n  <button class=\"big\" data-a=\"resume\">Weiter</button>\n  <button data-a=\"restart\">Neu starten</button>\n  <button data-a=\"map\">Zur Karte</button>\n  ${toggles()}</div>`); }\nfunction resume() { hideUI(); clearInput(); mode = 'play'; touchEl.hidden = !isTouch; pauseBtn.hidden = false; }\n\nasync function finish() {\n  const id = level.id, frames = game.frame, first = !D.cleared[id];\n  const bonus = first ? (level.boss ? 300 : 100) : 0;\n  // Sterne: geschafft · unter Zielzeit · ohne Tod. Jeder neue Stern bringt 50.\n  const got = [true, frames <= level.par * 60, game.deaths === 0];\n  const had = D.stars[id] || [false, false, false];\n  const newStars = got.map((g, i) => g && !had[i]);\n  D.stars[id] = had.map((h, i) => h || got[i]);\n  const starGems = newStars.filter(Boolean).length * 50;\n  const earned = game.gems + bonus + starGems;\n  D.gems += earned; D.earned += earned; D.cleared[id] = true;\n  const li = LEVELS.findIndex(l => l.id === id);\n  D.unlocked = Math.max(D.unlocked, li + 2);\n  const old = D.best[id], record = !old || frames < old;\n  const code = await encodeGhost({ level: id, name: D.name || 'Ich', frames, gear: { shovel: D.shovel, armor: D.armor }, rec: game.rec });\n  if (record) { D.best[id] = frames; D.ghosts[id] = code; }\n  // Waffen-Bedingungen am Levelende\n  if (id === '1-1' && game.kills === 0) unlockWeapon('federklinge');\n  if (id === '1-1' && frames < 25 * 60) unlockWeapon('blitzspaten');\n  if (id === '1-2' && game.dirtTotal > 0 && game.dirtLeft() === 0) unlockWeapon('erdfresser');\n  if (ghosts.some(g => !g.own && g.frames - frames >= 120)) unlockWeapon('geisterklinge');\n  save.write();\n  let up = '';\n  if (record && online() && D.name) up = (await uploadGhost({ level: id, name: D.name, frames, code })) ? 'Online hochgeladen.' : 'Online-Upload fehlgeschlagen.';\n  stopMusic(); sfx('win');\n  mode = 'result';\n  const next = LEVELS[li + 1];\n  const starLbl = ['Geschafft', `Unter ${level.par} s`, 'Ohne Tod'];\n  show(`<div class=\"panel small result\">\n    <h2>${level.boss ? 'Boss besiegt!' : 'Geschafft!'}</h2>\n    <p class=\"lvl\">${esc(level.id)} · ${esc(level.name)}</p>\n    <div class=\"starrow\">${got.map((g, i) => `<div class=\"star ${D.stars[id][i] ? 'on' : ''} ${newStars[i] ? 'new' : ''}\" style=\"--d:${0.35 + i * 0.35}s\"><span>★</span><small>${starLbl[i]}</small></div>`).join('')}</div>\n    <div class=\"stats\">\n      <div><small>Zeit</small><b>${fmtTime(frames)}</b>${record ? '<em>Neue Bestzeit!</em>' : `<em>Best ${fmtTime(old)}</em>`}</div>\n      <div><small>Edelsteine</small><b id=\"tally\">+0</b><em>${[bonus ? `${bonus} Erst-Bonus` : '', starGems ? `${starGems} Sterne` : ''].filter(Boolean).join(' · ')}</em></div>\n      <div><small>Beste Kette</small><b>×${game.maxChain}</b></div>\n    </div>\n    ${ghosts.map(g => { const d = frames - g.frames; return `<p class=\"vs ${d <= 0 ? 'win' : 'lose'}\">gegen ${esc(g.name)}: ${d <= 0 ? '−' : '+'}${(Math.abs(d) / 60).toFixed(2)} s</p>`; }).join('')}\n    ${up ? `<p class=\"note\">${up}</p>` : ''}\n    <div class=\"row\">\n      <button data-a=\"restart\">Nochmal</button>\n      ${next ? `<button class=\"big\" data-a=\"play\" data-id=\"${next.id}\">Weiter</button>` : ''}\n      <button data-a=\"map\">Karte</button>\n    </div>\n    <button class=\"ghostbtn\" data-a=\"share\" data-code=\"${esc(code)}\">Diesen Lauf als Geist teilen</button>\n  </div>`);\n  // Edelsteine hochzählen\n  const el = $('#tally'), t0 = performance.now(), dur = Math.min(1400, 300 + earned * 6);\n  let lastTick = 0;\n  const step = now => {\n    const k = Math.min(1, (now - t0) / dur), v = Math.round(earned * (1 - (1 - k) ** 3));\n    if (el.isConnected) el.textContent = '+' + v;\n    if (now - lastTick > 45 && k < 1) { sfx('tick'); lastTick = now; }\n    if (k < 1) requestAnimationFrame(step);\n  };\n  requestAnimationFrame(step);\n  newStars.forEach((n, i) => n && setTimeout(() => sfx('star'), 350 + i * 350));\n  setTimeout(showReveals, 1200);\n}\n\n/* ---------- Waffen ---------- */\nconst reveals = [];\nfunction unlockWeapon(id, inGame) {\n  if (D.weapons[id] || !weaponById(id)) return;\n  D.weapons[id] = true; save.write();\n  reveals.push(id);\n  const w = weaponById(id), r = RARITY[w.rar];\n  if (inGame && game) {\n    game.banner = { sub: `${r.name.toUpperCase()}E WAFFE ENTDECKT`, text: w.name, col: r.col, t: 150 };\n    game.freeze = Math.max(game.freeze, 36); game.shake = 6;\n    sfx('legend');\n  }\n}\nfunction showReveals() {\n  const id = reveals.shift(); if (!id) return;\n  const w = weaponById(id), r = RARITY[w.rar];\n  sfx('legend');\n  const el = document.createElement('div');\n  el.className = 'reveal ' + w.rar;\n  el.innerHTML = `<div class=\"rays\"></div><div class=\"rcard\" style=\"--c:${r.col};--g:${r.glow}\">\n    <p class=\"rar\">${r.name}e Waffe</p><canvas width=\"1\" height=\"1\"></canvas>\n    <h2>${esc(w.name)}</h2><p class=\"perk\">${esc(w.perk)}</p><p class=\"cond\">${esc(w.cond)}</p>\n    <div class=\"row\"><button class=\"big\" data-r=\"equip\">Ausrüsten</button><button data-r=\"close\">Später</button></div></div>`;\n  document.body.appendChild(el);\n  drawIcon(el.querySelector('canvas'), id, 7);\n  el.addEventListener('click', e => {\n    const b = e.target.closest('[data-r]'); if (!b) return;\n    if (b.dataset.r === 'equip') { D.weapon = id; save.write(); sfx('buy'); }\n    el.remove(); setTimeout(showReveals, 150);\n  });\n}\nfunction drawIcon(cv, id, scale) {\n  const ic = S.weaponIcon(id);\n  cv.width = ic.width * scale; cv.height = ic.height * scale;\n  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(ic, 0, 0, cv.width, cv.height);\n}\n\nfunction armory(msg = '') {\n  mode = 'menu';\n  const n = WEAPONS.filter(w => D.weapons[w.id]).length;\n  const cards = WEAPONS.map(w => {\n    const have = D.weapons[w.id], r = RARITY[w.rar], on = D.weapon === w.id;\n    if (!have) return `<div class=\"wcard locked ${w.rar}\"><div class=\"wi\"><canvas data-icon=\"${w.id}\" class=\"sil\"></canvas></div>\n      <div><small style=\"color:${r.col}\">${w.secret ? '???' : r.name}</small><b>???</b><p>${esc(w.secret ? 'Ein Gerücht erzählt von einem Glimmen in grosser Höhe …' : w.hint)}</p></div></div>`;\n    return `<div class=\"wcard ${w.rar} ${on ? 'on' : ''}\" style=\"--c:${r.col}\"><div class=\"wi\"><canvas data-icon=\"${w.id}\"></canvas></div>\n      <div><small style=\"color:${r.col}\">${r.name}</small><b>${esc(w.name)}</b><p>${esc(w.perk)}</p>\n      <button data-a=\"equip\" data-id=\"${w.id}\">${on ? 'Ausgerüstet ✓' : 'Ausrüsten'}</button></div></div>`;\n  }).join('');\n  show(`<div class=\"panel\">\n    <div class=\"top\"><button class=\"back\" data-a=\"map\">‹</button><h2>Waffenkammer</h2><span class=\"gems\">${n} / ${WEAPONS.length}</span></div>\n    <p class=\"note\">Diese Waffen kann man nicht kaufen. Jede verlangt eine besondere Tat. Sie nutzen Schaden und Reichweite deiner Schaufel-Stufe und legen ihre Kraft obendrauf.</p>\n    <div class=\"wgrid\">${cards}</div>\n    <div class=\"row\"><button data-a=\"equip\" data-id=\"\">${D.weapon ? 'Normale Schaufel nehmen' : 'Normale Schaufel ausgerüstet ✓'}</button></div>\n    ${msg ? `<p class=\"msg\">${msg}</p>` : ''}\n  </div>`);\n  for (const cv of document.querySelectorAll('[data-icon]')) drawIcon(cv, cv.dataset.icon, 3);\n}\n\n/* ---------- Menüs ---------- */\nfunction show(html) { ui.innerHTML = html; ui.hidden = false; }\nfunction hideUI() { ui.hidden = true; ui.innerHTML = ''; }\n\nfunction title() {\n  mode = 'menu'; game = null; touchEl.hidden = true; pauseBtn.hidden = true;\n  playMusic(THEMES.karte.music);\n  show(`<div class=\"title\">\n    <h1>Schaufel<span>held</span></h1>\n    <p>Grabe. Springe. Schmiede dich nach oben.</p>\n    <button class=\"big\" data-a=\"map\">Spielen</button>\n    <div class=\"row\"><button data-a=\"forge\">Schmiede</button><button data-a=\"armory\">Waffenkammer</button><button data-a=\"options\">Optionen</button></div>\n    <p class=\"gems\">◆ ${D.gems}</p>\n  </div>`);\n}\n\nlet curWorld = 0;\nconst worldOpen = wi => WORLDS[wi] && LEVELS.findIndex(l => l.id === WORLDS[wi].levels[0]) < D.unlocked;\nfunction map(sel, wi) {\n  mode = 'menu'; game = null; touchEl.hidden = true; pauseBtn.hidden = true;\n  playMusic(THEMES.karte.music);\n  if (wi != null) curWorld = wi;\n  else if (sel) curWorld = Math.max(0, WORLDS.findIndex(w => w.levels.includes(sel)));\n  const w = WORLDS[curWorld];\n  const tabs = WORLDS.map((ww, i) => `<button class=\"wtab ${i === curWorld ? 'on' : ''} ${worldOpen(i) ? '' : 'locked'}\" data-a=\"${worldOpen(i) ? 'world' : 'nope'}\" data-w=\"${i}\">Welt ${ww.id}${worldOpen(i) ? '' : ' 🔒'}</button>`).join('');\n  const cards = w.levels.map((id, i) => {\n    const l = levelById(id), open = LEVELS.findIndex(x => x.id === id) < D.unlocked, best = D.best[id];\n    return `<button class=\"card ${open ? '' : 'locked'} ${sel === id ? 'sel' : ''} th-${l.theme}\" data-a=\"${open ? 'pick' : 'nope'}\" data-id=\"${id}\">\n      <span class=\"no\">${esc(id)}</span><b>${esc(l.name)}</b>\n      <span class=\"cstars\">${(D.stars[id] || [0, 0, 0]).map(v => `<em class=\"${v ? 'on' : ''}\">★</em>`).join('')}</span>\n      <small>${open ? (best ? '⏱ ' + fmtTime(best) : 'Neu') : 'Gesperrt'}</small></button>`;\n  }).join('');\n  show(`<div class=\"panel\">\n    <div class=\"top\"><button class=\"back\" data-a=\"title\">‹</button><h2>Welt ${w.id} · ${esc(w.name)}</h2><span class=\"gems\">★ ${w.levels.reduce((n, id) => n + (D.stars[id] || []).filter(Boolean).length, 0)}/${w.levels.length * 3} · ◆ ${D.gems}</span></div>\n    <div class=\"wtabs\">${tabs}</div>\n    <div class=\"cards\">${cards}</div>\n    <div id=\"detail\">${sel ? '' : '<p class=\"note\">Wähle ein Level.</p>'}</div>\n    <div class=\"row\"><button data-a=\"forge\">Schmiede</button><button data-a=\"armory\">Waffenkammer ${Object.keys(D.weapons).length}/${WEAPONS.length}</button><button data-a=\"options\">Optionen</button></div>\n    <p class=\"note soon\">Welt 3 · Pilzwald von Moderbrück — in Arbeit</p>\n  </div>`);\n  if (sel) detail(sel);\n}\n\nasync function detail(id) {\n  const el = $('#detail'); if (!el) return;\n  const l = levelById(id), opts = [];\n  if (D.ghosts[id]) opts.push({ code: D.ghosts[id], label: `Mein Bestzeit-Geist (${fmtTime(D.best[id])})`, on: D.ghostOn });\n  for (const g of D.imported[id] || []) opts.push({ code: g.code, label: `${g.name} (${fmtTime(g.frames)})`, on: true });\n  const render = (list, loading) => {\n    el.innerHTML = `<div class=\"detail\">\n      <div><h3>${esc(l.name)}</h3><p class=\"note\">${D.best[id] ? 'Bestzeit ' + fmtTime(D.best[id]) : 'Noch nicht geschafft'}</p></div>\n      <div class=\"ghosts\"><small>Gegen Geister rennen</small>\n        ${list.length ? list.map((o, i) => `<label><input type=\"checkbox\" data-g=\"${i}\" ${o.on ? 'checked' : ''}> ${esc(o.label)}</label>`).join('') : '<p class=\"note\">Noch keine Geister. Schaff das Level oder importiere einen Code in den Optionen.</p>'}\n        ${loading ? '<p class=\"note\">Lade Online-Bestenliste …</p>' : ''}\n      </div>\n      <button class=\"big go\" data-a=\"go\" data-id=\"${esc(id)}\">Los!</button></div>`;\n    el._opts = list;\n  };\n  render(opts, online());\n  if (online()) {\n    const top = await topGhosts(id, 5);\n    top.forEach((g, i) => opts.push({ code: g.code, label: `#${i + 1} ${g.name} (${fmtTime(g.frames)})`, on: i === 0 }));\n    if ($('#detail') === el) render(opts, false);\n  }\n}\n\n// Kleine Pixel-Leinwand mit einer Szene, hochskaliert\nfunction stage(cv, w, h, draw) {\n  const t = document.createElement('canvas'); t.width = w; t.height = h;\n  const x = t.getContext('2d'), old = R.x, oldT = R.t; R.x = x; R.t = menuT; draw(x); R.x = old; R.t = oldT;\n  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.clearRect(0, 0, cv.width, cv.height); c.drawImage(t, 0, 0, cv.width, cv.height);\n}\nlet forgeAnim = 0;\nfunction forge(msg = '') {\n  mode = 'menu';\n  const row = (key, name, table) => {\n    const cur = D[key], nx = cur + 1, can = nx < AVAILABLE, price = PRICE[nx];\n    const chips = TIERS.map((t, i) => `<canvas class=\"gi ${i === cur ? 'cur' : ''} ${i <= cur ? 'own' : i < AVAILABLE ? '' : 'lock'}\" data-gi=\"${key}:${i}\" title=\"${esc(t.name)}\"></canvas>`).join('');\n    return `<div class=\"gear\">\n      <div class=\"gh\"><b>${name}: <span style=\"color:${TIERS[cur].light}\">${esc(TIERS[cur].name)}</span></b><small>${esc(table[cur].perk)}</small></div>\n      <div class=\"chips\">${chips}</div>\n      ${nx < TIERS.length ? `<div class=\"next\"><span>Nächste Stufe: <b style=\"color:${TIERS[nx].light}\">${esc(TIERS[nx].name)}</b> — ${esc(table[nx].perk)}</span>\n        ${can ? `<button class=\"${D.gems >= price ? 'big' : 'off'}\" data-a=\"buy\" data-k=\"${key}\">◆ ${price}</button>` : '<span class=\"lockt\">ab Welt 3</span>'}</div>` : '<div class=\"next\">Maximum erreicht.</div>'}\n    </div>`;\n  };\n  const nA = Math.min(D.armor + 1, TIERS.length - 1), nS = Math.min(D.shovel + 1, TIERS.length - 1);\n  show(`<div class=\"panel\">\n    <div class=\"top\"><button class=\"back\" data-a=\"map\">‹</button><h2>Schmiede</h2><span class=\"gems\">◆ ${D.gems}</span></div>\n    <div class=\"forge\"><div class=\"pv\"><canvas id=\"preview\" width=\"216\" height=\"120\"></canvas><small>Jetzt <span>→</span> nächste Stufe</small></div>\n      <div class=\"rows\">${row('shovel', 'Schaufel', SHOVEL)}${row('armor', 'Rüstung', ARMOR)}\n      <div class=\"gear\"><div class=\"gh\"><b>Waffe: ${D.weapon ? esc(weaponById(D.weapon).name) : 'keine (normale Schaufel)'}</b><small>Legendäre und mythische Waffen findest du nicht im Laden.</small></div><div class=\"next\"><span></span><button data-a=\"armory\">Waffenkammer</button></div></div>\n      <div class=\"gear soon\"><div class=\"gh\"><b>Relikt</b><small>Bald: Funkenrute, Flügelstiefel, Erdglocke …</small></div></div></div></div>\n    ${msg ? `<p class=\"msg\">${msg}</p>` : ''}\n  </div>`);\n  for (const cv of document.querySelectorAll('[data-gi]')) {\n    const [k, i] = cv.dataset.gi.split(':'), ic = k === 'shovel' ? S.shovelIcon(+i) : S.armorIcon(+i);\n    cv.width = ic.width * 2; cv.height = ic.height * 2;\n    const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(ic, 0, 0, cv.width, cv.height);\n  }\n  // Vorschau läuft animiert (Effekte der hohen Stufen sichtbar)\n  const pv = $('#preview'), id = ++forgeAnim;\n  const tick = () => {\n    if (id !== forgeAnim || !pv.isConnected) return;\n    stage(pv, 72, 40, () => {\n      R.figure(S.hero(D.armor, D.shovel, D.weapon), 12, 18, 1, 0, 0, 8);\n      const nh = S.hero(nA, nS, null), locked = nA >= AVAILABLE && nS >= AVAILABLE;\n      R.x.globalAlpha = locked ? 0.45 : 1; R.figure(nh, 50, 18, 1, 3, 0, 4); R.x.globalAlpha = 1;\n      R.x.fillStyle = '#ffd84a'; R.x.fillRect(33, 22, 5, 1); R.x.fillRect(36, 21, 1, 3); R.x.fillRect(37, 22, 1, 1);\n    });\n    requestAnimationFrame(tick);\n  };\n  tick();\n}\n\n// Grosse Enthüllung nach dem Schmieden\nfunction gearReveal(kind, t) {\n  const tier = TIERS[t], el = document.createElement('div');\n  el.className = 'reveal gear';\n  el.innerHTML = `<div class=\"rays\"></div><div class=\"rcard\" style=\"--c:${tier.light};--g:${tier.dark}\">\n    <p class=\"rar\">${kind === 'shovel' ? 'Neue Schaufel geschmiedet' : 'Neue Rüstung geschmiedet'}</p>\n    <canvas width=\"300\" height=\"168\"></canvas>\n    <h2>${esc(tier.name)}</h2><p class=\"perk\">${esc((kind === 'shovel' ? SHOVEL : ARMOR)[t].perk)}</p>\n    <div class=\"row\"><button class=\"big\" data-r=\"close\">Stark!</button></div></div>`;\n  document.body.appendChild(el);\n  const cv = el.querySelector('canvas'), id = ++forgeAnim;\n  const tick = () => {\n    if (!cv.isConnected) return;\n    stage(cv, 50, 28, () => {\n      R.figure(S.hero(D.armor, D.shovel, D.weapon), 12, 12, 1, 0, 0, 8);\n      R.figure(S.hero(D.armor, D.shovel, D.weapon), 32, 12, 1, 3, 0, 4);\n    });\n    requestAnimationFrame(tick);\n  };\n  tick();\n  el.addEventListener('click', e => { if (e.target.closest('[data-r]')) { el.remove(); forge(); } });\n}\n\nfunction options(msg = '') {\n  mode = 'menu';\n  show(`<div class=\"panel small\">\n    <div class=\"top\"><button class=\"back\" data-a=\"map\">‹</button><h2>Optionen</h2><span></span></div>\n    <label class=\"field\">Dein Name (für Geister)<input id=\"name\" maxlength=\"16\" value=\"${esc(D.name)}\" placeholder=\"z. B. Raphi\"></label>\n    ${toggles()}\n    <label class=\"field\">Geist-Code importieren<textarea id=\"code\" rows=\"3\" placeholder=\"SH1.…\"></textarea></label>\n    <button data-a=\"import\">Importieren</button>\n    <p class=\"note\">${online() ? 'Online-Geister: aktiv.' : 'Online-Geister: aus (siehe README).'} Version 0.4</p>\n    ${msg ? `<p class=\"msg\">${msg}</p>` : ''}\n    <button class=\"danger\" data-a=\"reset\">Spielstand löschen</button>\n  </div>`);\n  $('#name').addEventListener('change', e => { D.name = e.target.value.trim().slice(0, 16); save.write(); });\n}\nconst toggles = () => `<div class=\"row toggles\">\n  <button data-a=\"sfx\" class=\"${D.sfx ? 'on' : ''}\">Effekte ${D.sfx ? 'an' : 'aus'}</button>\n  <button data-a=\"music\" class=\"${D.music ? 'on' : ''}\">Musik ${D.music ? 'an' : 'aus'}</button></div>`;\n\nlet resetArm = 0;\nui.addEventListener('click', async e => {\n  const b = e.target.closest('[data-a]'); if (!b) return;\n  unlockAudio();\n  const a = b.dataset.a, id = b.dataset.id;\n  if (a !== 'nope' && a !== 'buy') sfx('click');\n  switch (a) {\n    case 'title': return title();\n    case 'map': return map();\n    case 'forge': return forge();\n    case 'armory': return armory();\n    case 'equip': D.weapon = id || null; save.write(); sfx('buy'); return armory(id ? `${esc(weaponById(id).name)} ausgerüstet.` : 'Normale Schaufel ausgerüstet.');\n    case 'options': return options();\n    case 'pick': return map(id);\n    case 'world': return map(null, +b.dataset.w);\n    case 'nope': return sfx('nope');\n    case 'play': return startLevel(id, D.ghostOn && D.ghosts[id] ? [D.ghosts[id]] : []);\n    case 'go': {\n      const opts = $('#detail')._opts || [];\n      const codes = [...document.querySelectorAll('[data-g]')].filter(c => c.checked).map(c => opts[+c.dataset.g].code);\n      if (D.ghosts[id]) { D.ghostOn = codes.includes(D.ghosts[id]); save.write(); }\n      return startLevel(id, codes);\n    }\n    case 'resume': return resume();\n    case 'restart': return startLevel(level.id, curCodes);\n    case 'buy': {\n      const k = b.dataset.k, nx = D[k] + 1, price = PRICE[nx];\n      if (nx >= AVAILABLE || D.gems < price) { sfx('nope'); return forge(`Dir fehlen noch ${price - D.gems} Edelsteine.`); }\n      D.gems -= price; D[k] = nx; save.write(); sfx('legend');\n      forge(); return gearReveal(k, nx);\n    }\n    case 'sfx': D.sfx = !D.sfx; save.write(); setAudio(D.sfx, D.music); b.outerHTML = toggles().match(/<button data-a=\"sfx\".*?<\\/button>/)[0]; return;\n    case 'music': D.music = !D.music; save.write(); setAudio(D.sfx, D.music); b.outerHTML = toggles().match(/<button data-a=\"music\".*?<\\/button>/)[0]; return;\n    case 'import': {\n      const g = await decodeGhost($('#code').value);\n      if (!g || !levelById(g.level)) return options('Das ist kein gültiger Geist-Code.');\n      (D.imported[g.level] = D.imported[g.level] || []).unshift({ code: $('#code').value.trim(), name: g.name, frames: g.frames });\n      D.imported[g.level] = D.imported[g.level].slice(0, 5); save.write();\n      return options(`Geist von ${esc(g.name)} für ${esc(g.level)} (${fmtTime(g.frames)}) importiert.`);\n    }\n    case 'share': {\n      const code = b.dataset.code;\n      try { await navigator.clipboard.writeText(code); b.textContent = 'Code kopiert! Schick ihn einem Freund.'; }\n      catch { b.outerHTML = `<textarea class=\"codebox\" readonly rows=\"3\">${esc(code)}</textarea><p class=\"note\">Code markieren und kopieren.</p>`; }\n      return;\n    }\n    case 'reset':\n      if (Date.now() - resetArm < 3000) { save.reset(); return title(); }\n      resetArm = Date.now(); b.textContent = 'Wirklich? Nochmals tippen.'; return;\n  }\n});\n\nfunction tryLandscape() {\n  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch {}\n}\n\nif ('serviceWorker' in navigator && location.protocol === 'https:' && !window.__SH_BUNDLE) navigator.serviceWorker.register('sw.js').catch(() => {});\n\nif (location.search.includes('debug')) window.__sh = { get game() { return game; } };\n\ntitle();\nrequestAnimationFrame(loop);\n","online.js":"// Optionale Online-Geister über Supabase (gratis). Ohne Konfiguration läuft alles lokal.\n// Einrichtung: siehe README.md, Abschnitt \"Online-Geister\".\nimport { CONFIG } from './config.js';\n\nexport const online = () => !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);\nconst headers = () => ({ apikey: CONFIG.supabaseKey, Authorization: `Bearer ${CONFIG.supabaseKey}`, 'Content-Type': 'application/json' });\n\nexport async function uploadGhost({ level, name, frames, code }) {\n  if (!online()) return false;\n  try {\n    const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/ghosts`, {\n      method: 'POST', headers: { ...headers(), Prefer: 'return=minimal' },\n      body: JSON.stringify({ level, name, frames, code, version: CONFIG.version }),\n    });\n    return r.ok;\n  } catch { return false; }\n}\n\nexport async function topGhosts(level, limit = 10) {\n  if (!online()) return [];\n  try {\n    const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/ghosts?level=eq.${encodeURIComponent(level)}&select=name,frames,code&order=frames.asc&limit=${limit}`, { headers: headers() });\n    return r.ok ? await r.json() : [];\n  } catch { return []; }\n}\n","render.js":"// Zeichnet einen Game-Zustand in eine kleine Pixel-Leinwand (z. B. 320×180).\nimport { T } from './game.js';\nimport { THEMES } from './themes.js';\nimport { TIERS } from './gear.js';\nimport { weaponById, RARITY } from './weapons.js';\nimport { ghostAt, fmtTime } from './ghost.js';\nimport * as S from './sprites.js';\n\nconst K = '#140c1c';\n\nexport class Renderer {\n  constructor(ctx) { this.x = ctx; this.cam = { x: 0, y: 0 }; this.t = 0; }\n  resize(w, h) { this.W = w; this.H = h; }\n\n  snapCamera(g) { this.cam = this.target(g); }\n  target(g) {\n    const p = g.p;\n    const x = Math.max(0, Math.min(g.w * T - this.W, p.x + p.w / 2 + p.face * 28 - this.W / 2));\n    const y = Math.max(0, Math.min(g.h * T - this.H, p.y - this.H * 0.55));\n    return { x, y };\n  }\n\n  draw(g, ghosts = []) {\n    const x = this.x, W = this.W, H = this.H, th = THEMES[g.level.theme];\n    this.t++;\n    const tg = this.target(g);\n    this.cam.x += (tg.x - this.cam.x) * 0.14; this.cam.y += (tg.y - this.cam.y) * 0.1;\n    const sh = g.shake ? (Math.random() - 0.5) * g.shake : 0;\n    const cx = Math.round(this.cam.x + sh), cy = Math.round(this.cam.y + (g.shake ? (Math.random() - 0.5) * g.shake : 0));\n\n    // Kulisse\n    const bg = S.backdrop(th, H);\n    x.drawImage(bg.sky, 0, 0, W, H);\n    x.fillStyle = th.stars;\n    for (const s of bg.stars) if ((this.t / 20 + s.p) % 6 > 1) x.fillRect(((s.x - cx * 0.05) % W + W) % W, s.y, 1, 1);\n    for (const [img, f] of [[bg.far, 0.2], [bg.near, 0.45]]) {\n      const ox = -Math.round(cx * f) % img.width;\n      for (let k = ox - img.width; k < W; k += img.width) x.drawImage(img, k, Math.round(-cy * f * 0.3));\n    }\n\n    x.save(); x.translate(-cx, -cy);\n    this.tiles(g, th, cx, cy);\n    this.steam(g);\n    const ps = S.platSprite();\n    for (const pl of g.plats) x.drawImage(ps, Math.round(pl.x), Math.round(pl.y));\n    for (const e of g.ents) this.ent(g, e, th);\n    for (const gh of ghosts) this.ghost(gh, g.frame);\n    this.player(g);\n    for (const q of g.parts) {\n      x.fillStyle = partCol(q.col, th, g, q);\n      const s = q.life > 12 ? 2 : 1;\n      x.fillRect(Math.round(q.x), Math.round(q.y), s, s);\n    }\n    for (const n of g.nums) {\n      x.globalAlpha = Math.min(1, n.life / 15);\n      S.drawText(x, n.txt, Math.round(n.x) + 1, Math.round(n.y) + 1, K, 1, 'center');\n      S.drawText(x, n.txt, Math.round(n.x), Math.round(n.y), n.col, 1, 'center');\n    }\n    x.globalAlpha = 1;\n    x.restore();\n\n    if (g.level.theme === 'hoehle' || g.level.theme === 'bau') this.dark(g, cx, cy, g.level.theme === 'bau' ? 0.35 : 0.55);\n    this.hud(g, ghosts);\n  }\n\n  steam(g) {\n    const x = this.x;\n    for (const v of g.vents) {\n      const on = g.ventOn(v), bx = v.tx * T, by = v.ty * T;\n      if (!on) { if ((this.t >> 3) & 1) { x.fillStyle = '#ffffff30'; x.fillRect(bx + 6, by - 3, 4, 2); } continue; }\n      for (let k = 0; k < 14; k++) {\n        const ph = (this.t * 2.2 + k * 7 + v.tx * 13) % 96, sx = bx + 3 + ((k * 5 + this.t) % 10), sy = by - ph;\n        x.fillStyle = ph > 70 ? '#ffffff30' : ph > 40 ? '#ffffff60' : '#ffffffa0';\n        x.fillRect(Math.round(sx), Math.round(sy), ph > 50 ? 3 : 2, ph > 50 ? 3 : 2);\n      }\n    }\n  }\n\n  tiles(g, th, cx, cy) {\n    const x = this.x, ts = S.tileset(th);\n    const x0 = Math.floor(cx / T), x1 = Math.ceil((cx + this.W) / T), y0 = Math.max(0, Math.floor(cy / T)), y1 = Math.min(g.h - 1, Math.ceil((cy + this.H) / T));\n    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {\n      const c = g.tile(tx, ty); if (c === '.') continue;\n      const v = (tx * 7 + ty * 13) % 3, px = tx * T, py = ty * T;\n      let img;\n      if (c === '#') { if (tx < 0 || tx >= g.w) continue; img = g.tile(tx, ty - 1) === '#' && ty > 0 ? ts.fill[v] : ts.top[v]; }\n      else if (c === 'D') img = ts.dirt; else if (c === 'S') img = ts.stone; else if (c === '^') img = ts.spike;\n      else if (c === '=') img = ts.plank; else if (c === 'B') img = ts.mush; else if (c === 'X') img = ts.gate;\n      else if (c === 'V') img = ts.vent; else if (c === 'R') img = ts.ore;\n      if (img) x.drawImage(img, px, py);\n    }\n  }\n\n  ent(g, e, th) {\n    const x = this.x, f = this.t;\n    switch (e.type) {\n      case 'gem': {\n        const bob = e.fixed ? Math.round(Math.sin(f / 12 + e.x) * 1.5) : 0;\n        if (!e.fixed && e.age > 780 && (f >> 2) & 1) return;\n        x.drawImage(S.gemSprite(e.val), Math.round(e.x), Math.round(e.y) + bob);\n        if ((f + e.x) % 90 < 6) { x.fillStyle = '#fff'; x.fillRect(Math.round(e.x) + 1, Math.round(e.y) + bob + 1, 1, 1); }\n        return;\n      }\n      case 'beetle': { const sp = S.beetleSprite((f >> 3) & 1); x.drawImage(sp[(e.dir > 0 ? 1 : 0) + (e.flash ? 2 : 0)], Math.round(e.x), Math.round(e.y)); return; }\n      case 'blorb': {\n        const sp = S.blorbSprite()[e.flash ? 1 : 0], sq = e.onGround ? (e.t < 12 ? 2 : 0) : -2;\n        x.drawImage(sp, Math.round(e.x) - sq / 2, Math.round(e.y) + sq + 1, 12 + sq, 9 - sq); return;\n      }\n      case 'bat': {\n        const sp = S.batSprite()[e.flash ? 1 : 0], fl = e.state === 'hang' ? 7 : ((f >> 2) & 1 ? 7 : 4);\n        x.drawImage(sp, Math.round(e.x) - 1, Math.round(e.y) + (7 - fl) / 2, 14, fl); return;\n      }\n      case 'mole': {\n        if (e.hidden) return;\n        const sp = S.moleSprite(e.flash > 0 || (e.state === 'dying' && (f >> 2) & 1));\n        const jig = e.state === 'wind' ? ((f >> 1) & 1) * 2 - 1 : 0;\n        x.drawImage(sp[e.face > 0 ? 1 : 0], Math.round(e.x) - 2 + jig, Math.round(e.y) - 2);\n        if (e.state === 'stun') for (let k = 0; k < 3; k++) { const a = f / 8 + k * 2.1; x.fillStyle = '#ffe066'; x.fillRect(Math.round(e.x + 15 + Math.cos(a) * 10), Math.round(e.y - 4 + Math.sin(a) * 3), 2, 2); }\n        return;\n      }\n      case 'rock': {\n        const rx = Math.round(e.x), ry = Math.round(e.y);\n        if (e.delay > 0 && (f >> 1) & 1) return;\n        x.fillStyle = K; x.fillRect(rx + 1, ry, 8, 10); x.fillRect(rx, ry + 1, 10, 8);\n        x.fillStyle = th.stone; x.fillRect(rx + 1, ry + 1, 8, 8); x.fillStyle = th.stoneL; x.fillRect(rx + 2, ry + 2, 3, 2);\n        return;\n      }\n      case 'chest': x.drawImage(S.chestSprite(e.open), e.x, e.y); return;\n      case 'cog': x.drawImage(S.cogSprite((f >> 2) % 4), Math.round(e.x) - 1, Math.round(e.y) - 1); return;\n      case 'knight': x.drawImage(S.knightSprite()[(e.dir > 0 ? 1 : 0) + (e.flash ? 2 : 0)], Math.round(e.x), Math.round(e.y)); return;\n      case 'kuckuck': x.drawImage(S.cuckooSprite()[(e.dir > 0 ? 0 : 1) + (e.flash ? 2 : 0)], Math.round(e.x), Math.round(e.y) - 1 + ((f >> 3) & 1)); return;\n      case 'eproj': {\n        const ex = Math.round(e.x), ey = Math.round(e.y);\n        if (e.kind === 'gear') x.drawImage(S.cogSprite((f >> 1) % 4, 4, 6), ex - 1, ey - 1);\n        else if (e.kind === 'bolt') { x.fillStyle = K; x.fillRect(ex, ey, 4, 8); x.fillStyle = '#e0b040'; x.fillRect(ex + 1, ey + 1, 2, 6); x.fillStyle = '#fff'; x.fillRect(ex + 1, ey + 6, 2, 1); }\n        else { for (let k = 0; k < 3; k++) { const hh = 4 + ((f + k * 3) % 6); x.fillStyle = k === 1 ? '#ffffff' : '#ffd84a'; x.fillRect(ex + k * 4, ey + 10 - hh, 3, hh); } }\n        return;\n      }\n      case 'golem': {\n        if (e.hidden) return;\n        const sp = S.golemSprite(e.flash > 0 || (e.state === 'dying' && (f >> 2) & 1));\n        const sq = e.state === 'crouch' ? 3 : e.state === 'tired' ? 1 : 0, jig = e.state === 'crouch' ? ((f >> 1) & 1) : 0;\n        x.drawImage(sp[e.face > 0 ? 1 : 0], Math.round(e.x) - 1 + jig, Math.round(e.y) - 2 + sq, 30, 32 - sq);\n        // Uhrzeiger auf der Brust\n        const ccx = Math.round(e.x) + 13.5, ccy = Math.round(e.y) + 15 + sq;\n        x.fillStyle = K;\n        for (const [len, sp2] of [[4, 0.05], [3, 0.004]]) { const a = f * sp2 * (e.state === 'tired' ? 0.2 : 1); for (let k = 0; k <= len; k++) x.fillRect(Math.round(ccx + Math.cos(a) * k), Math.round(ccy + Math.sin(a) * k), 1, 1); }\n        if (e.state === 'tired') for (let k = 0; k < 3; k++) { const a = f / 8 + k * 2.1; x.fillStyle = '#ffe066'; x.fillRect(Math.round(e.x + 14 + Math.cos(a) * 11), Math.round(e.y - 5 + Math.sin(a) * 3), 2, 2); }\n        return;\n      }\n      case 'proj':\n        if (e.kind === 'star') {\n          const sx = Math.round(e.x), sy = Math.round(e.y), c = (f >> 1) & 1 ? '#ffffff' : '#d8c8ff';\n          x.fillStyle = K; x.fillRect(sx + 1, sy, 4, 6); x.fillRect(sx, sy + 1, 6, 4);\n          x.fillStyle = c; x.fillRect(sx + 2, sy, 2, 6); x.fillRect(sx, sy + 2, 6, 2);\n        } else {\n          const sx = Math.round(e.x), sy = Math.round(e.y), hgt = 6 + ((f >> 1) & 3);\n          x.fillStyle = K; x.fillRect(sx, sy + 10 - hgt - 1, 10, hgt + 1);\n          x.fillStyle = '#ff9a50'; x.fillRect(sx + 1, sy + 10 - hgt, 8, hgt - 1); x.fillStyle = '#ffe070'; x.fillRect(sx + 3, sy + 10 - hgt, 4, 2);\n        }\n        return;\n      case 'altar': {\n        if (!e.taken) { x.fillStyle = 'rgba(255,170,60,0.16)'; x.beginPath(); x.arc(e.x + 12, e.y + 2, 22 + Math.sin(f / 8) * 3, 0, 7); x.fill(); }\n        x.drawImage(S.altarSprite(!e.taken), e.x + 4, e.y + 12);\n        if (!e.taken) {\n          const ic = S.weaponIcon('urfunke');\n          x.drawImage(ic, e.x + 12 - ic.width / 2, e.y - 6 + Math.round(Math.sin(f / 14) * 2));\n          if (f % 4 === 0) g.parts.push({ x: e.x + 8 + Math.random() * 8, y: e.y + 4, vx: (Math.random() - 0.5) * 0.4, vy: -0.6, life: 26, col: 'fire', grav: -0.01 });\n        }\n        return;\n      }\n      case 'apple': x.drawImage(S.appleSprite(), e.x, e.y + Math.round(Math.sin(f / 15) * 1)); return;\n      case 'lantern':\n        if (e.lit) { x.fillStyle = 'rgba(255,216,74,0.12)'; x.beginPath(); x.arc(e.x + 4, e.y + 5, 16 + Math.sin(f / 9) * 2, 0, 7); x.fill(); }\n        x.drawImage(S.lanternSprite(e.lit), e.x, e.y); return;\n      case 'sign':\n        x.fillStyle = K; x.fillRect(e.x + 6, e.y + 6, 3, 8); x.fillRect(e.x, e.y, 14, 8);\n        x.fillStyle = '#c08040'; x.fillRect(e.x + 1, e.y + 1, 12, 6); x.fillStyle = '#8a5a2a'; x.fillRect(e.x + 7, e.y + 7, 1, 7);\n        x.fillStyle = K; x.fillRect(e.x + 3, e.y + 3, 8, 1);\n        if ((f >> 4) & 1) S.drawText(x, '!', e.x + 6, e.y - 8, '#ffe066');\n        return;\n      case 'goal': {\n        const gx = e.x + 5, top = e.y + 4, bot = e.y + e.h;\n        x.fillStyle = K; x.fillRect(gx - 1, top - 1, 4, bot - top + 1); x.fillStyle = '#e8e8f0'; x.fillRect(gx, top, 2, bot - top);\n        x.fillStyle = '#ffd84a'; x.fillRect(gx - 1, top - 4, 4, 4);\n        for (let i = 0; i < 14; i++) { const wy = Math.round(Math.sin(f / 7 + i / 2.5) * 1.5); x.fillStyle = K; x.fillRect(gx + 2 + i, top + 1 + wy, 1, 10); x.fillStyle = i < 7 ? '#ff4f7a' : '#ffd84a'; x.fillRect(gx + 2 + i, top + 2 + wy, 1, 8); }\n        return;\n      }\n    }\n  }\n\n  player(g) {\n    const p = g.p; if (p.dead) return;\n    if (p.inv > 0 && (this.t >> 2) & 1 && p.hurt <= 0) return;\n    const hs = S.hero(g.gear.armor, g.gear.shovel, g.gear.weapon);\n    if (p.dash > 0) { this.x.globalAlpha = 0.6; }\n    this.figure(hs, p.x, p.y, p.face, g.pose(), p.anim, p.atk, p.hurt > 0 ? hs.white : null, p.land, p.atkLen || 16);\n    this.x.globalAlpha = 1;\n    const wp = g.gear.weapon && weaponById(g.gear.weapon);\n    if (wp && (this.t + p.anim) % 24 < 3) {\n      // Glitzern an der Klinge\n      this.x.fillStyle = wp.rar === 'mythisch' ? '#ff9af0' : '#fff6b0';\n      const bx = p.atk > 0 ? (p.face > 0 ? p.x + 22 : p.x - 12) : (p.face > 0 ? p.x - 2 : p.x + 11);\n      this.x.fillRect(Math.round(bx), Math.round(p.atk > 0 ? p.y + 5 : p.y - 8), 1, 1);\n    }\n  }\n  figure(hs, px, py, face, pose, anim, atk = 8, white = null, land = 0, atkLen = 16) {\n    const x = this.x, i = face > 0 ? 0 : 1, X = Math.round(px), Y = Math.round(py);\n    const wind = atk > atkLen * 0.78;\n    const legs = pose === 1 ? ((anim >> 3) & 1 ? 'run1' : 'run2') : pose === 2 || pose === 4 ? 'air' : 'stand';\n    const U = hs.shU[i], H = hs.shH[i], Dn = hs.shD[i];\n    if (hs.fx && !white) this.fx(hs.fx, X, Y, face, false);\n    if (pose <= 2) x.drawImage(U, face > 0 ? X - 5 : X + 8, Y + 7 - U.height);\n    const body = (white || hs)[legs][i];\n    if (land > 0) { const q = Math.min(3, land); x.drawImage(body, X - 5 - q, Y - 10 + q, 20 + q * 2, 24 - q); }\n    else x.drawImage(body, X - 5, Y - 10);\n    if (pose === 3) {\n      if (wind) x.drawImage(U, face > 0 ? X + 7 : X - 4, Y + 4 - U.height);\n      else x.drawImage(H, face > 0 ? X + 8 : X + 2 - H.width, Y + 2);\n    }\n    if (pose === 4) x.drawImage(Dn, X + 2, Y + 9);\n    if (hs.fx && !white) this.fx(hs.fx, X, Y, face, true);\n  }\n  // Effekte der hohen Rüstungsstufen. front=false: hinter dem Helden, true: davor.\n  fx(kind, X, Y, face, front) {\n    const x = this.x, t = this.t;\n    const P = (col, row) => [face > 0 ? X - 5 + col : X + 14 - col, Y - 10 + row];\n    const dot = (c, r, col, s = 1) => { const [a, b] = P(c, r); x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), s, s); };\n    switch (kind) {\n      case 'visor': if (front) { x.globalAlpha = 0.35 + 0.35 * Math.sin(t / 8); for (let c = 6; c <= 13; c++) dot(c, 9, '#bff6ff'); x.globalAlpha = 1; } return;\n      case 'shine': if (front && t % 120 < 12) { const k = t % 120; for (let d = 0; d < 3; d++) dot(4 + k + d, 2 + k - d, '#ffffff'); } return;\n      case 'sparkle': if (front) for (let k = 0; k < 2; k++) { const ph = (t + k * 37) % 70; if (ph < 8) dot(2 + ((k * 7 + Math.floor(t / 70) * 5) % 16), 4 + ((k * 11 + Math.floor(t / 70) * 3) % 18), ph < 4 ? '#ffffff' : '#bfe8ff'); } return;\n      case 'stars':\n        if (!front) { for (let k = 0; k < 3; k++) if ((t + k * 20) % 60 < 30) dot(2 + k, 16 + k * 2, '#ffffff'); }\n        else { const a = t / 20; dot(9.5 + Math.cos(a) * 9, 12 + Math.sin(a) * 4, Math.sin(a) > 0 ? '#ffd84a' : '#fff6b0'); }\n        return;\n      case 'embers': if (!front) for (let k = 0; k < 3; k++) { const ph = (t * 0.6 + k * 23) % 40; dot(3 + k * 2 + Math.sin((t + k * 9) / 6), 20 - ph * 0.5, ph < 20 ? '#ff8a2a' : '#c02a00'); } return;\n      case 'void':\n        for (let k = 0; k < 3; k++) {\n          const a = t / 24 + k * 2.09, z = Math.sin(a);\n          if ((z > 0) !== front) continue;\n          const [a1, b1] = P(9.5 + Math.cos(a) * 11, 13 + z * 3);\n          x.fillStyle = '#140c1c'; x.fillRect(Math.round(a1) - 1, Math.round(b1) - 2, 3, 5);\n          x.fillStyle = (t >> 2) & 1 ? '#ff4fd8' : '#ffb0f0'; x.fillRect(Math.round(a1), Math.round(b1) - 1, 1, 3);\n        }\n        if (!front && t % 3 === 0) { x.globalAlpha = 0.5; dot(4 + (t % 5), 22 - (t % 7), '#ff4fd8'); x.globalAlpha = 1; }\n        return;\n      case 'gear':\n        if (!front) { const g = S.cogSprite((t >> 3) % 4, 7, 10), [a, b] = P(9.5, 10); x.globalAlpha = 0.85; x.drawImage(g, Math.round(a - g.width / 2), Math.round(b - g.height / 2) - 1); x.globalAlpha = 1; }\n        return;\n      case 'divine':\n        if (!front) {\n          // Lichtflügel\n          const flap = Math.sin(t / 10) * 2;\n          x.globalAlpha = 0.55;\n          for (let r = 0; r < 9; r++) { const w = 9 - r; const [a, b] = P(face > 0 ? 6 - w : 13, 11 + r - Math.round(flap * (1 - r / 9))); x.fillStyle = r % 3 === 0 ? '#ffffff' : '#ffe9a8'; x.fillRect(Math.round(face > 0 ? a : a - w + 1), Math.round(b), w, 1); }\n          x.globalAlpha = 1;\n          // Heiligenschein\n          for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; dot(9.5 + Math.cos(a) * 5, -2 + Math.sin(a) * 1.5, k % 4 === Math.floor(t / 6) % 4 ? '#ffffff' : '#ffd84a'); }\n        } else if (t % 9 === 0) dot(2 + (t * 7) % 16, 4 + (t * 3) % 18, '#fff6b0');\n        return;\n    }\n  }\n  ghost(gh, frame) {\n    const s = ghostAt(gh, frame); if (!s) return;\n    const x = this.x;\n    x.globalAlpha = s.finished ? 0.25 : 0.5;\n    const pose = s.f & 7;\n    if (pose !== 5) this.figure(S.ghostHero(), s.x, s.y, s.f & 8 ? -1 : 1, pose, (s.f & 16) ? 8 : 0, 8);\n    x.globalAlpha = 0.8;\n    S.drawText(x, gh.name, Math.round(s.x + 5), Math.round(s.y) - 12, '#8fe8ff', 1, 'center');\n    x.globalAlpha = 1;\n  }\n\n  dark(g, cx, cy, a) {\n    const x = this.x, px = g.p.x - cx + 5, py = g.p.y - cy + 7;\n    const gr = x.createRadialGradient(px, py, 30, px, py, 150);\n    gr.addColorStop(0, 'rgba(8,4,16,0)'); gr.addColorStop(1, `rgba(8,4,16,${a})`);\n    x.fillStyle = gr; x.fillRect(0, 0, this.W, this.H);\n  }\n\n  hud(g, ghosts) {\n    const x = this.x, W = this.W, p = g.p;\n    for (let i = 0; i < p.maxhp; i++) x.drawImage(S.heart(i < p.hp), 6 + (i % 10) * 8, 6 + Math.floor(i / 10) * 7);\n    const gy0 = p.maxhp > 10 ? 7 : 0;\n    x.translate(0, gy0);\n    x.drawImage(S.gemSprite(5), 6, 16);\n    if (g.gems > (this.lastGems ?? g.gems)) this.bump = 10;\n    this.lastGems = g.gems;\n    if (this.bump > 0) this.bump--;\n    S.drawText(x, g.gems, 16, 17 - (this.bump > 6 ? 1 : 0), this.bump > 0 ? '#ffd84a' : '#fff');\n    x.translate(0, -gy0);\n    if (g.chain >= 2) {\n      const c = g.chain >= 8 ? '#ff7ae0' : g.chain >= 4 ? '#ffd84a' : '#ffffff';\n      S.drawText(x, 'KETTE', W - 30, 30, '#c4abd8', 1, 'center');\n      S.drawText(x, '×' + g.chain, W - 30, 38, c, 2, 'center');\n    }\n    if (g.banner) {\n      const b = g.banner, a = Math.min(1, b.t / 20), y0 = this.H / 2 - 30;\n      x.globalAlpha = a;\n      x.fillStyle = 'rgba(20,12,28,0.78)'; x.fillRect(0, y0, W, 40);\n      x.fillStyle = b.col; x.fillRect(0, y0, W, 1); x.fillRect(0, y0 + 39, W, 1);\n      if (b.sub) S.drawText(x, b.sub, W / 2, y0 + 6, b.col, 1, 'center');\n      S.drawText(x, b.text, W / 2, y0 + (b.sub ? 16 : 13), (this.t >> 2) & 1 ? '#ffffff' : b.col, 2, 'center');\n      x.globalAlpha = 1;\n      if (b.t > 70 && b.t % 6 < 3) { x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(0, 0, W, this.H); }\n    }\n    S.drawText(x, fmtTime(g.frame), W / 2, 6, '#fff', 1, 'center');\n    let gy = 14;\n    for (const gh of ghosts) {\n      const d = g.frame - gh.frames;\n      S.drawText(x, `${gh.name} ${fmtTime(gh.frames)}`, W / 2, gy, '#8fe8ff', 1, 'center'); gy += 7;\n      if (g.done) { S.drawText(x, (d <= 0 ? '-' : '+') + (Math.abs(d) / 60).toFixed(2), W / 2, gy, d <= 0 ? '#7dffa0' : '#ff7a8a', 1, 'center'); gy += 7; }\n    }\n    if (g.sign) {\n      const lines = S.wrapText(g.sign, Math.floor((W - 40) / 4));\n      const bw = Math.max(...lines.map(S.textWidth)) + 12, bh = lines.length * 7 + 8, bx = Math.round(W / 2 - bw / 2), by = 34;\n      x.fillStyle = K; x.fillRect(bx - 1, by - 1, bw + 2, bh + 2); x.fillStyle = '#f4e6c8'; x.fillRect(bx, by, bw, bh);\n      x.fillStyle = '#c8a878'; x.fillRect(bx, by + bh - 2, bw, 2);\n      lines.forEach((l, i) => S.drawText(x, l, W / 2, by + 5 + i * 7, '#3a2418', 1, 'center'));\n    }\n    const b = g.boss;\n    if (b && !b.dead && b.state !== 'idle') {\n      const bw = Math.min(160, W - 60), bx = Math.round(W / 2 - bw / 2), by = this.H - 14;\n      S.drawText(x, b.title || 'ROSTMAULWURF', W / 2, by - 8, '#ffb070', 1, 'center');\n      x.fillStyle = K; x.fillRect(bx - 1, by - 1, bw + 2, 6); x.fillStyle = '#3a1010'; x.fillRect(bx, by, bw, 4);\n      x.fillStyle = '#ff5a3a'; x.fillRect(bx, by, Math.round(bw * Math.max(0, b.hp) / b.maxhp), 4);\n    }\n    if (g.frame < 150 && !g.done && !g.banner) {\n      const a = g.frame < 120 ? 1 : (150 - g.frame) / 30;\n      x.globalAlpha = a;\n      x.fillStyle = 'rgba(20,12,28,0.7)'; x.fillRect(0, this.H / 2 - 22, W, 34);\n      S.drawText(x, g.level.id, W / 2, this.H / 2 - 16, '#ffd84a', 1, 'center');\n      S.drawText(x, g.level.name, W / 2, this.H / 2 - 7, '#fff', 2, 'center');\n      x.globalAlpha = 1;\n    }\n  }\n}\n\nfunction partCol(c, th, g, q) {\n  const alt = (q.x * 7 + q.y) % 2 < 1;\n  switch (c) {\n    case 'dirt': return alt ? th.dirtL : th.dirt;\n    case 'stone': return alt ? th.stoneL : th.stone;\n    case 'spark': return alt ? '#ffe066' : '#ffffff';\n    case 'poof': return alt ? '#ffffff' : '#c8b8e8';\n    case 'hero': return alt ? TIERS[g.gear.armor].light : '#c23a5a';\n    case 'spore': return alt ? '#ffb0c0' : '#ffffff';\n    case 'dust': return alt ? '#e8dcc8' : '#b8a890';\n    case 'ghost': return alt ? '#8fe8ff' : '#e8ffff';\n    case 'fire': return q.life > 18 ? '#ffe070' : q.life > 9 ? '#ff8a2a' : '#c02a00';\n    case 'soul': return alt ? '#b07aff' : '#ffffff';\n    case 'star': return alt ? '#d8c8ff' : '#ffffff';\n    case 'ore': return alt ? '#b04cff' : '#f0c0ff';\n    default: return '#fff';\n  }\n}\n","save.js":"// Spielstand im Browser (localStorage). Fällt still auf Arbeitsspeicher zurück.\nconst KEY = 'schaufelheld-v1';\nconst DEF = {\n  gems: 0, earned: 0, shovel: 0, armor: 0, unlocked: 1,\n  best: {},        // levelId -> Frames\n  ghosts: {},      // levelId -> eigener bester Geist-Code\n  imported: {},    // levelId -> [{code, name, frames}]\n  cleared: {},     // levelId -> true\n  name: '', sfx: true, music: true, ghostOn: true,\n  weapons: {},     // freigeschaltete Waffen\n  weapon: null,    // ausgerüstete Waffe (null = Schaufel)\n  deathsTotal: 0, stars: {}, chests: {},\n};\nconst fresh = () => JSON.parse(JSON.stringify(DEF));\nconst data = fresh();\ntry { const raw = localStorage.getItem(KEY); if (raw) Object.assign(data, JSON.parse(raw)); } catch {}\n\nexport const save = {\n  get d() { return data; },\n  write() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} },\n  reset() { const name = data.name; for (const k in data) delete data[k]; Object.assign(data, fresh(), { name }); this.write(); },\n};\n","sprites.js":"// Pixel-Grafik: Sprites aus Textzeilen, Tiles und Kulissen prozedural pro Welt-Thema.\nimport { TIERS } from './gear.js';\nimport { weaponById } from './weapons.js';\nimport { ARMOR_ART, LEGS, SHOVEL_ART, WEAPON_ART } from './heroart.js';\n\nconst cache = new Map();\nconst mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };\n\nexport function fromRows(rows, pal) {\n  const w = Math.max(...rows.map(r => r.length)), h = rows.length;\n  const c = mk(w, h), x = c.getContext('2d');\n  rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); } } });\n  return c;\n}\nexport function flipX(c) { const o = mk(c.width, c.height), x = o.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return o; }\nfunction rotCW(rows) { const h = rows.length, w = rows[0].length, out = []; for (let x = 0; x < w; x++) { let s = ''; for (let y = h - 1; y >= 0; y--) s += rows[y][x] || '.'; out.push(s); } return out; }\nfunction rotCCW(rows) { return rotCW(rotCW(rotCW(rows))); }\n// Silhouette einfärben (für Treffer-Blitz und Geister)\nexport function tint(c, col, alpha = 1) {\n  const o = mk(c.width, c.height), x = o.getContext('2d');\n  x.drawImage(c, 0, 0); x.globalCompositeOperation = 'source-in'; x.globalAlpha = alpha; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);\n  return o;\n}\nconst memo = (key, fn) => { if (!cache.has(key)) cache.set(key, fn()); return cache.get(key); };\n\n/* ---------- Held ---------- */\n// Grafik-Daten in heroart.js. Rahmen 20×24, Körper ab (4, 8).\nfunction paint(x, segs, pal) {\n  for (const [y, x0, str] of segs) for (let i = 0; i < str.length; i++) {\n    const col = pal[str[i]]; if (col) { x.fillStyle = col; x.fillRect(x0 + i, y, 1, 1); }\n  }\n}\nfunction heroFrame(art, legs) {\n  const c = mk(20, 24), x = c.getContext('2d'), pal = { k: K, ...art.pal };\n  paint(x, art.cape, pal);\n  paint(x, legs.map((r, i) => [20 + i, 4, r]), pal);\n  paint(x, art.torso, pal);\n  paint(x, art.helm, pal);\n  return c;\n}\nfunction bladeSet(rows, pal) {\n  const p = { k: K, W: '#ffffff', r: '#e0304f', ...pal };\n  const h = fromRows(rows, p), d = fromRows(rotCW(rows), p), u = fromRows(rotCCW(rows), p);\n  return { shH: [h, flipX(h)], shD: [d, flipX(d)], shU: [u, flipX(u)] };\n}\nfunction weaponPal(w) { return { h: w.handle, H: w.light, s: w.dark, S: w.light, w: '#ffffff', x: w.light, W: '#ffffff' }; }\nexport function hero(armor, shovel, weapon = null) {\n  return memo(`hero${armor}.${shovel}.${weapon}`, () => {\n    const art = ARMOR_ART[armor], out = { fx: art.fx || null, tier: armor };\n    for (const k in LEGS) { const r = heroFrame(art, LEGS[k]); out[k] = [r, flipX(r)]; }\n    const wp = weapon && weaponById(weapon);\n    Object.assign(out, wp ? bladeSet(WEAPON_ART[wp.id], weaponPal(wp)) : bladeSet(SHOVEL_ART[shovel].rows, SHOVEL_ART[shovel].pal));\n    out.white = {}; for (const k in LEGS) out.white[k] = [tint(out[k][0], '#ffffff'), tint(out[k][1], '#ffffff')];\n    return out;\n  });\n}\nexport function ghostHero() {\n  return memo('ghost', () => {\n    const h = hero(0, 0), o = {};\n    for (const k of ['stand', 'run1', 'run2', 'air', 'shH', 'shD', 'shU']) o[k] = [tint(h[k][0], '#8fe8ff'), tint(h[k][1], '#8fe8ff')];\n    return o;\n  });\n}\n// Icons (Klinge nach oben) für Menüs\nexport function weaponIcon(id) { return memo('wicon' + id, () => fromRows(rotCCW(WEAPON_ART[id]), { k: K, W: '#ffffff', r: '#e0304f', ...weaponPal(weaponById(id)) })); }\nexport function shovelIcon(t) { return memo('sicon' + t, () => fromRows(rotCCW(SHOVEL_ART[t].rows), { k: K, ...SHOVEL_ART[t].pal })); }\nexport function armorIcon(t) { return memo('aicon' + t, () => heroFrame(ARMOR_ART[t], LEGS.stand)); }\n\n/* ---------- Gegner & Objekte ---------- */\nconst BEETLE = ['....kkkkkk....', '..kkGGGGggkk..', '.kGGGgggggggk.', '.kGggggggggggk', 'kykggggggggggk', 'kkkggggggggggk', '.kkkkkkkkkkkk.'];\nconst BLEGS = [['.l..l...l..l..', 'l..l...l..l...'], ['..l..l...l..l.', '...l..l...l..l']];\nconst BLORB = ['....kkkk....', '..kkPPPPkk..', '.kPPPPpppppk', 'kPPwkpppwkpk', 'kPpwkpppwkpk', 'kppppppppppk', 'kpppkkkppppk', 'kppppppppppk', '.kkkkkkkkkk.'];\nconst BAT = ['kk..........kk', 'kBk...kk...kBk', 'kBBk.kbbk.kBBk', '.kBBkbebekBBk.', '..kkkbbbbkkk..', '.....kbbk.....' stars };\n  });\n}\n\n/* ---------- Bitmap-Schrift 3×5 ---------- */\nconst GL = {\n  '0': '75557', '1': '26227', '2': '71747', '3': '71317', '4': '55711', '5': '74717', '6': '74757', '7': '71122', '8': '75757', '9': '75717',\n  A: '25755', B: '65656', C: '34443', D: '65556', E: '74647', F: '74644', G: '34553', H: '55755', I: '72227', J: '11152', K: '55655', L: '44447', M: '57755',\n  N: '65555', O: '25552', P: '65644', Q: '25563', R: '65655', S: '34216', T: '72222', U: '55557', V: '55552', W: '55775', X: '55255', Y: '55222', Z: '71247',\n  'Ä': '52575', 'Ö': '52552', 'Ü': '50557', '.': '00002', ',': '00024', ':': '02020', '!': '22202', '?': '71302', '-': '00700', '+': '02720', '/': '11244',\n  '=': '07070', \"'\": '22000', '(': '24442', ')': '21112', '>': '42124', '<': '12421', '%': '51245', ' ': '00000', '◀': '13731', '▶': '46764', '▼': '07720', '♥': '05772', '·': '00200', '×': '05250',\n};\nexport function textWidth(s) { return s.length * 4 - 1; }\nexport function drawText(x, str, px0, py0, col, scale = 1, align = 'left') {\n  str = String(str).toUpperCase().replace(/ß/g, 'SS');\n  let px = px0 - (align === 'center' ? textWidth(str) * scale / 2 : align === 'right' ? textWidth(str) * scale : 0);\n  px = Math.round(px);\n  x.fillStyle = col;\n  for (const ch of str) {\n    const g = GL[ch] || GL['?'];\n    for (let row = 0; row < 5; row++) { const bits = +g[row]; for (let b = 0; b < 3; b++) if (bits & (4 >> b)) x.fillRect(px + b * scale, py0 + row * scale, scale, scale); }\n    px += 4 * scale;\n  }\n}\nexport function wrapText(str, maxChars) {\n  const words = String(str).split(' '), lines = []; let cur = '';\n  for (const w of words) { if ((cur + ' ' + w).trim().length > maxChars) { lines.push(cur.trim()); cur = w; } else cur += ' ' + w; }\n  if (cur.trim()) lines.push(cur.trim());\n  return lines;\n}\n","themes.js":"// Welt-Themen: Farben, Kulisse und Musik.\n// Musik: 32 Achtelnoten pro Schleife, \".\" = Pause, \"-\" = Ton halten.\n\nexport const THEMES = {\n  . F2 . C3 . G2 . G2 .' } },\n};\n","weapons.js":"// Legendäre und mythische Waffen. Sie ersetzen die Schaufel-Optik und legen einen Effekt\n// auf die Werte der aktuellen Schaufel-Stufe (Schaden, Reichweite, Stein bleiben erhalten).\n// Freigeschaltet werden sie nur über Bedingungen, nie über Edelsteine.\n\nexport const RARITY = {\n  legendaer: { name: 'Legendär', col: '#ffd84a', glow: '#ffb020' },\n  mythisch: { name: 'Mythisch', col: '#ff7ae0', glow: '#9a4cff' },\n};\n\nexport const WEAPONS = [\n  { id: 'federklinge', name: 'Federklinge', rar: 'legendaer', dark: '#3a8fd0', light: '#e8f8ff', handle: '#d8d8e8',\n    perk: 'Schneller laufen, höher springen, längere Klinge.',\n    hint: 'Wer im Moosweg keinem Wesen ein Leid tut, dem wächst eine Feder.',\n    cond: '1-1 schaffen, ohne einen einzigen Gegner zu besiegen.' },\n  { id: 'blitzspaten', name: 'Blitzspaten', rar: 'legendaer', dark: '#c09000', light: '#fff36a', handle: '#3a2a60',\n    perk: 'Rasend schnelle Hiebe und schnellerer Lauf.',\n    hint: 'Durchquere den Moosweg, bevor das Moos es merkt.',\n    cond: '1-1 in unter 25 Sekunden schaffen.' },\n  { id: 'erdfresser', name: 'Erdfresser', rar: 'legendaer', dark: '#6a3a1a', light: '#e0a050', handle: '#3a2010',\n    perk: 'Gräbt Erde im Umkreis von 3×3, doppelte Beute aus Erde.',\n    hint: 'Die Wurzelhöhlen wollen restlos umgegraben werden.',\n    cond: 'In 1-2 jeden einzelnen Erdblock ausgraben und das Ziel erreichen.' },\n  { id: 'goldschaufel', name: 'Goldschaufel des Königs', rar: 'legendaer', dark: '#b07a10', light: '#fff0a0', handle: '#7a1830',\n    perk: 'Jeder Edelstein zählt doppelt.',\n    hint: 'Drei Truhen schlafen hinter Stein. Weck sie alle.',\n    cond: 'Die drei verborgenen Truhen in Welt 1 öffnen.' },\n  { id: 'geisterklinge', name: 'Geisterklinge', rar: 'legendaer', dark: '#3a9ab0', light: '#c8ffff', handle: '#2a3a5a', ghost: true,\n    perk: 'In der Luft nochmals A: Geister-Sprint, dabei unverwundbar.',\n    hint: 'Schlage einen fremden Gei
