<title>Schaufelheld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Schaufelheld – Oberfläche im Pixel-Schmiede-Stil.
   Texturen, Rahmen und Symbole entstehen zur Laufzeit in src/ui-skin.js (CSS-Variablen --tex-*, --fr-*, --bv-*). */
:root{--bg:#0e0814;--ink:#fff1dc;--mute:#cdb6a0;--gold:#ffd84a;--gold2:#c8901c;--k:#140c1c;--crim:#a8203a;--jade:#7dffcf;--parch-ink:#3a2214}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:16px/1.35 "Pixelify Sans",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#screen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
i.px{display:inline-block;width:calc(var(--w) * 2px);height:calc(var(--h) * 2px);background-size:100% 100%;image-rendering:pixelated;vertical-align:-2px;font-style:normal}
i.px.x3{width:calc(var(--w) * 3px);height:calc(var(--h) * 3px);vertical-align:-4px}
i.px.x4{width:calc(var(--w) * 4px);height:calc(var(--h) * 4px)}

/* Pixel-Schrift-Effekte */
.ptxt,h1,h2,.rar,.rankbig,.wtab,.big,.gems{text-shadow:2px 0 var(--k),-2px 0 var(--k),0 2px var(--k),0 -2px var(--k),2px 2px var(--k),-2px 2px var(--k),2px -2px var(--k),-2px -2px var(--k),0 4px 0 #0009}

/* ---------- Knöpfe ---------- */
.btn,.panel button:not(.card):not(.sc):not(.wtab),.title button,.rcard button{
  position:relative;min-height:44px;padding:4px 16px;margin:4px;color:var(--ink);font-weight:700;font-size:16px;letter-spacing:.02em;
  border:8px solid transparent;border-image:var(--bv-wood) 4 fill / 8px stretch;background:var(--tex-wood) 0 0/64px;background-clip:padding-box;image-rendering:pixelated;
  text-shadow:2px 2px 0 var(--k);transition:transform .05s;filter:drop-shadow(0 3px 0 #000a)}
.panel button:not(.card):not(.sc):not(.wtab):active,.title button:active,.rcard button:active{border-image-source:var(--bv-wood-p);transform:translateY(2px);filter:none}
button.big{border-image-source:var(--bv-crim)!important;background:#a8203a!important;color:var(--gold)!important;font-size:20px!important;padding:6px 26px!important}
button.big:active{border-image-source:var(--bv-crim-p)!important}
button.off{border-image-source:var(--bv-stone)!important;background:#2a2434!important;color:#8a8298!important}
button.danger{border-image-source:var(--bv-crim)!important;background:#4a0c18!important;color:#ffb0bc!important;margin-top:10px!important}
.toggles button.on{border-image-source:var(--bv-moss)!important;background:#26703e!important}
button.back{width:44px;height:44px;padding:0!important;font-size:22px!important;border-image-source:var(--bv-iron)!important;background:#4a4458!important;margin:0!important}
.ghostbtn{border-image-source:var(--bv-jade)!important;background:#1a7a60!important;margin-top:10px!important}

/* ---------- Panels ---------- */
#ui{position:fixed;inset:0;z-index:8;display:flex;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:auto;touch-action:pan-y;
  background:radial-gradient(ellipse at 50% 40%,transparent 40%,#0008 100%)}
#ui[hidden]{display:none}
#ui>*{margin:auto}
.panel{width:min(780px,100%);position:relative;padding:6px 10px 10px;
  border:21px solid transparent;border-image:var(--fr-iron) 7 / 21px stretch;background:var(--tex-stone) 0 0/64px;background-clip:padding-box;image-rendering:pixelated;
  box-shadow:0 10px 0 -4px #0009,0 0 60px #0008}
.panel.small{width:min(460px,100%)}
.panel::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,#ffd84a14,transparent 60%);pointer-events:none}
.top{display:flex;align-items:center;gap:10px;margin:-2px 0 10px;position:relative}
.top h2{flex:1;margin:0;font-size:24px;color:var(--gold);line-height:1.1}
h2{margin:0 0 8px;font-size:24px;color:var(--gold)}
h3{margin:0;font-size:20px}
.gems{color:var(--gold);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:6px}
.note{color:var(--mute);font-size:14px;margin:6px 0}
.msg{margin:10px 0 0;padding:8px 12px;border:8px solid transparent;border-image:var(--bv-moss) 4 fill / 8px;color:#fff;text-shadow:2px 2px 0 var(--k)}
.soon{text-align:center;opacity:.85}
/* Banner-Leiste unter Überschriften */
.top::after{content:"";position:absolute;left:54px;right:0;bottom:-6px;height:4px;background:repeating-linear-gradient(90deg,var(--gold2) 0 8px,transparent 8px 12px);opacity:.6}

/* Pergament */
.parch,.detail,.stats div,.achc.on,.wcard:not(.locked),.rows .gear{
  color:var(--parch-ink);border:8px solid transparent;border-image:var(--bv-gold) 4 / 8px stretch;background:var(--tex-parch) 0 0/64px;background-clip:padding-box;image-rendering:pixelated;text-shadow:none}
.detail .note,.rows .gear small,.stats small,.wcard p,.achc small{color:#6a4a2a}

/* ---------- Titelbild ---------- */
.title{text-align:center;position:relative}
.title .logo{display:block;margin:0 auto 4px;width:auto;max-width:94vw;height:min(25vh,150px);image-rendering:pixelated;filter:drop-shadow(0 0 18px #ffb02066);cursor:pointer;animation:logo 4s ease-in-out infinite}
@keyframes logo{50%{transform:translateY(-4px);filter:drop-shadow(0 0 26px #ffb020aa)}}
.title .tag{display:inline-block;margin:0 0 14px;padding:2px 16px;border:8px solid transparent;border-image:var(--bv-wood) 4 fill / 8px;color:var(--gold);text-shadow:2px 2px 0 var(--k);font-size:15px}
.title .menu{display:flex;flex-direction:column;align-items:center;gap:2px}
.title button.big{min-width:240px;font-size:24px!important}
.title .gems{margin-top:10px;font-size:16px}
.title .tip{margin-top:8px;font-size:13px;color:var(--mute);max-width:420px;margin-inline:auto}
.title .daily{border-image-source:var(--bv-gold)!important;background:#c8901c!important;color:#2a1400!important;text-shadow:1px 1px 0 #fff6b8!important;animation:pulse 1.2s ease-in-out infinite}
.title .daily small{display:block;font-size:12px}
@keyframes pulse{50%{transform:scale(1.05);filter:drop-shadow(0 0 12px #ffd84a)}}

/* ---------- Weltkarte ---------- */
.wtabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.wtab{min-height:36px;padding:2px 12px;font-size:15px;font-weight:700;color:var(--ink);border:8px solid transparent;border-image:var(--bv-iron) 4 fill / 8px;background:#4a4458;background-clip:padding-box;image-rendering:pixelated}
.wtab.on{border-image-source:var(--bv-gold);background:#c8901c;color:#2a1400;text-shadow:1px 1px 0 #fff6b8}
.wtab.locked{opacity:.55}
.wtab.sec{border-image-source:var(--bv-jade);background:#1a7a60}.wtab.sec.on{border-image-source:var(--bv-jade-p);color:#e8fff6}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{position:relative;text-align:left;min-height:98px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;color:var(--ink);
  border:8px solid transparent;border-image:var(--bv-iron) 4 / 8px;background:linear-gradient(170deg,var(--c1) 0%,var(--c2) 100%) padding-box;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #000a)}
.card::before{content:"";position:absolute;inset:0;background:var(--tex-stone) 0 0/64px;opacity:.25;mix-blend-mode:overlay;pointer-events:none}
.card .no{font-size:13px;color:var(--gold);text-shadow:1px 1px 0 var(--k)}
.card b{font-size:17px;line-height:1.1;text-shadow:2px 2px 0 var(--k)}
.card small{margin-top:auto;font-size:13px;text-shadow:1px 1px 0 var(--k)}
.card.sel{border-image-source:var(--bv-gold);animation:selglow 1.4s ease-in-out infinite}
@keyframes selglow{50%{filter:drop-shadow(0 4px 0 #000a) drop-shadow(0 0 10px #ffd84a)}}
.card.locked{filter:grayscale(.9) brightness(.55)}
.card.locked::after{content:"";position:absolute;right:6px;bottom:6px;width:21px;height:24px;background:var(--lock) 0 0/100% 100%;image-rendering:pixelated}
.card.secretcard{--c1:#14402a;--c2:#06140c;border-image-source:var(--bv-jade)}
.card.secretcard.locked{filter:none;opacity:.85}
.card .rank{position:absolute;top:2px;right:6px;font-weight:700;font-size:22px}
.cstars{display:flex;gap:2px}
.ccoins,.coinrow{display:flex;gap:3px;align-items:center}
.ccoins i,.coinrow i{width:12px;height:12px;background:#2a1a3a;border:2px solid var(--k);image-rendering:pixelated}
.ccoins i.on,.coinrow i.on{background:var(--coin) 0 0/100% 100%;border:0}
.coinrow{justify-content:center;margin:0 0 8px;flex-wrap:wrap}.coinrow i{width:21px;height:21px}
.coinrow i.new{animation:pop .5s cubic-bezier(.3,1.8,.5,1) .9s both}
.coinrow small{width:100%;text-align:center;color:var(--mute);font-size:12px}
.th-wald{--c1:#2a6a3a;--c2:#1a0f24}.th-hoehle{--c1:#4a3488;--c2:#0e0818}.th-dornen{--c1:#a83a50;--c2:#1a0a1a}.th-bau{--c1:#b04a1a;--c2:#1a0806}
.th-uhrturm{--c1:#2a6a74;--c2:#0a1a20}.th-glocke{--c1:#7a5aa0;--c2:#140e22}.th-pendel{--c1:#b07a30;--c2:#1a0c06}
.th-pilz{--c1:#2a8a6a;--c2:#081814}.th-grotte{--c1:#1a6a6a;--c2:#040c10}.th-moder{--c1:#a8406a;--c2:#140810}
.detail{display:grid;grid-template-columns:1fr 1.4fr auto;gap:12px;align-items:center;margin-top:10px;padding:8px 10px}
.detail h3{color:#5a1020}
.ghosts small{color:#6a4a2a;font-weight:700}
.ghosts label{display:flex;gap:8px;align-items:center;min-height:30px}
.ghosts input{width:20px;height:20px;accent-color:#a8203a}

/* ---------- Schmiede ---------- */
.forge{display:flex;gap:12px;align-items:flex-start}
#preview{width:216px;height:120px;image-rendering:pixelated;display:block;border:8px solid transparent;border-image:var(--bv-iron) 4 / 8px;background:radial-gradient(#5a2a14,#1a0a08 75%) padding-box}
.pv{flex:none;text-align:center}.pv small{color:var(--mute);font-size:12px}
.rows{flex:1;display:grid;gap:8px;min-width:0}
.rows .gear{padding:6px 10px}
.gh{display:flex;flex-direction:column}.gh b{font-size:16px}
.tn{display:inline-block;padding:0 6px;background:#2a1a10;color:var(--c);text-shadow:1px 1px 0 var(--k);border:2px solid var(--k);line-height:1.25}
.chips{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap;align-items:flex-end}
.chips canvas.gi{image-rendering:pixelated;height:30px;width:auto;padding:2px;background:#3a2a1a;opacity:.55;border:2px solid #5a4028}
.chips canvas.gi.own{opacity:1;background:#5a3a1a}
.chips canvas.gi.cur{border-color:var(--gold);background:#8a5a10;box-shadow:0 0 8px #ffd84a}
.chips canvas.gi.lock{filter:brightness(0) drop-shadow(0 0 1px #ffffff80);opacity:.9;background:transparent;border-color:transparent}
.next{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.lockt{color:#6a4a2a;font-size:14px}
.rows .gear.soon{opacity:.75}

/* ---------- Ergebnis ---------- */
.result{text-align:center}
.result .lvl{color:var(--mute);margin:-4px 0 8px}
.rankbig{font-size:64px;font-weight:700;line-height:1;margin:-6px 0 0}
.rankbig.new{animation:rankin .7s cubic-bezier(.2,1.6,.4,1) 1.2s both}
@keyframes rankin{0%{transform:scale(3) rotate(-20deg);opacity:0}100%{transform:scale(1);opacity:1}}
.rS{color:#ffd84a}.rA{color:#7dffa0}.rB{color:#7fd0ff}.rC{color:#cdb6a0}
.secretmsg{padding:4px 10px;font-weight:700;margin:4px 0 8px;border:8px solid transparent;border-image:var(--bv-jade) 4 fill / 8px;color:#e8fff6;text-shadow:2px 2px 0 var(--k)}
.starrow{display:flex;justify-content:center;gap:14px;margin:0 0 8px}
.star{display:flex;flex-direction:column;align-items:center;opacity:.45}
.star i.px{width:42px;height:42px}
.star small{font-size:12px;color:var(--mute)}
.star.on{opacity:1}
.star.new i.px{animation:pop .5s cubic-bezier(.3,1.8,.5,1) both;animation-delay:var(--d)}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{padding:4px 6px}
.stats small{display:block;font-size:12px}.stats b{font-size:22px;color:#5a1020}.stats em{display:block;font-style:normal;font-size:11px;color:#8a5a10}
.vs{margin:8px 0 0;font-weight:700;text-shadow:2px 2px 0 var(--k)}.vs.win{color:#7dffa0}.vs.lose{color:#ff8a9a}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0;color:var(--mute);font-size:14px}
.field input,.field textarea,.codebox{font:16px "Pixelify Sans",monospace;padding:8px;color:var(--parch-ink);user-select:text;-webkit-user-select:text;width:100%;
  border:8px solid transparent;border-image:var(--bv-wood-p) 4 / 8px;background:var(--tex-parch) 0 0/64px padding-box;image-rendering:pixelated}
.codebox{margin-top:10px;font-size:12px}

/* ---------- Waffenkammer, Erfolge, Garderobe ---------- */
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.wcard{display:flex;gap:8px;align-items:flex-start;padding:6px 8px}
.wcard.locked{border:8px solid transparent;border-image:var(--bv-stone) 4 / 8px;background:#1e1a26 padding-box;color:var(--mute)}
.wcard.on{border-image-source:var(--bv-crim)}
.wcard .wi{flex:none;width:40px;display:grid;place-items:center;padding-top:2px}
.wcard canvas{image-rendering:pixelated}
.wcard canvas.sil{filter:brightness(0) drop-shadow(0 0 1px #ffffff60)}
.wcard b{display:block;font-size:16px;line-height:1.1}
.wcard small{font-size:12px;font-weight:700;text-transform:uppercase;text-shadow:1px 1px 0 var(--k)}
.wcard p{margin:2px 0 4px;font-size:13px}
.wcard.locked p{font-style:italic;color:var(--mute)}
.wcard button{min-height:34px!important;padding:0 10px!important;margin:2px 0!important;font-size:14px!important}
.bar{height:14px;border:4px solid var(--k);background:#2a1a3a;margin:0 0 10px;image-rendering:pixelated}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#ffd84a 0 6px,#c8901c 6px 8px)}
.achgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.achc{padding:6px 8px;border:8px solid transparent;border-image:var(--bv-stone) 4 / 8px;background:#1e1a26 padding-box;color:var(--mute)}
.achc b{display:block;font-size:14px}.achc small{display:block;font-size:12px}.achc em{font-style:normal;font-size:12px;color:#c8901c}
.achc.on b{color:#5a1020}
.wardrobe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wardrobe .sc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:8px solid transparent;border-image:var(--bv-iron) 4 / 8px;background:#2a2434 padding-box;image-rendering:pixelated}
.wardrobe .sc canvas{width:100%;max-width:168px;height:auto;image-rendering:pixelated;background:radial-gradient(#4a2c74,#140c1c 75%)}
.wardrobe .sc b{text-shadow:2px 2px 0 var(--k)}
.wardrobe .sc.on{border-image-source:var(--bv-gold)}.wardrobe .sc.locked{opacity:.5}
.wardrobe .sc small{font-size:12px;color:var(--mute)}

/* ---------- Einblendungen ---------- */
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:4px;pointer-events:none;width:min(360px,92vw)}
.toast{display:flex;flex-direction:column;padding:4px 10px;border:8px solid transparent;border-image:var(--bv-gold) 4 / 8px;background:var(--tex-wood-d) 0 0/64px padding-box;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #000a);animation:tin .4s cubic-bezier(.2,1.5,.4,1)}
.toast b{color:var(--gold);font-size:15px;text-shadow:2px 2px 0 var(--k)}.toast span{font-size:13px;color:var(--ink)}
.toast.out{opacity:0;transform:translateY(-10px);transition:.4s}
@keyframes tin{from{transform:translateY(-30px) scale(.8);opacity:0}}
.reveal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0a0512ee;overflow:hidden;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:50%;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(#ffffff10 0 8deg,transparent 8deg 20deg);animation:spin 18s steps(90) infinite}
.reveal.legendaer .rays{background:repeating-conic-gradient(#ffd84a22 0 8deg,transparent 8deg 20deg)}
.reveal.mythisch .rays{background:repeating-conic-gradient(#ff7ae026 0 6deg,transparent 6deg 14deg,#9a4cff22 14deg 20deg,transparent 20deg 28deg)}
.reveal.gear .rays{background:repeating-conic-gradient(#ffb02018 0 8deg,transparent 8deg 20deg)}
@keyframes spin{to{transform:rotate(1turn)}}
.rcard{position:relative;text-align:center;padding:8px 16px 14px;max-width:min(480px,92vw);animation:rise .6s cubic-bezier(.2,1.4,.4,1) both;
  border:21px solid transparent;border-image:var(--fr-goldpanel) 7 / 21px;background:var(--tex-stone) 0 0/64px padding-box;image-rendering:pixelated}
.reveal.mythisch .rcard{border-image-source:var(--fr-jadepanel)}
@keyframes rise{from{transform:translateY(40px) scale(.7);opacity:0}}
.rcard .rar{margin:0;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.rcard canvas{display:block;margin:6px auto;image-rendering:pixelated;max-height:34vh;width:auto;filter:drop-shadow(0 0 14px var(--g));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.rcard h2{font-size:clamp(26px,5vw,36px);margin:4px 0;color:#fff}
.rcard .perk{margin:0 0 4px;font-size:17px;text-shadow:2px 2px 0 var(--k)}
.rcard .cond{margin:0 0 8px;color:var(--mute);font-size:14px}
.dchest{margin:8px auto;animation:float 2s ease-in-out infinite;filter:drop-shadow(0 0 20px #ffb020)}

/* ---------- Touch-Steuerung (Stein und Eisen) ---------- */
#touch{position:fixed;inset:0;pointer-events:auto;z-index:5}
#touch[hidden]{display:none}
#touch button{position:absolute;width:64px;height:64px;font-size:24px;font-weight:700;color:#fff1dc;pointer-events:none;text-shadow:2px 2px 0 var(--k);
  border:8px solid transparent;border-image:var(--bv-iron) 4 fill / 8px;background:#4a4458;background-clip:padding-box;image-rendering:pixelated;opacity:.85}
#touch button.on{border-image-source:var(--bv-iron-p);transform:translateY(2px)}
#touch .acts .a{border-image-source:var(--bv-crim)!important;background:#a8203a!important;color:var(--gold)!important}
#touch .acts .a.on{border-image-source:var(--bv-crim-p)!important}
#touch .acts .b{border-image-source:var(--bv-gold)!important;background:#c8901c!important;color:#2a1400!important;text-shadow:1px 1px 0 #fff6b8!important}
#touch .acts .b.on{border-image-source:var(--bv-gold-p)!important}
#touch button em{display:none}
.pad button[data-k=left]{left:calc(env(safe-area-inset-left) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px)}
.pad button[data-k=right]{left:calc(env(safe-area-inset-left) + 150px);bottom:calc(env(safe-area-inset-bottom) + 22px)}
.pad button[data-k=down]{left:calc(env(safe-area-inset-left) + 84px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:60px;height:54px}
.acts .a{right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 50px);width:72px!important;height:72px!important}
.acts .b{right:calc(env(safe-area-inset-right) + 104px);bottom:calc(env(safe-area-inset-bottom) + 18px);width:68px!important;height:68px!important}
#pauseBtn{position:fixed;z-index:6;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 10px);width:44px;height:44px;font-weight:700;letter-spacing:-2px;color:var(--ink);text-shadow:2px 2px 0 var(--k);
  border:8px solid transparent;border-image:var(--bv-iron) 4 fill / 8px;background:#4a4458;background-clip:padding-box;image-rendering:pixelated;opacity:.85}
#pauseBtn[hidden]{display:none}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px dashed #ffffff40;background:#ffffff0c;pointer-events:none;z-index:6}
#stick[hidden]{display:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border:8px solid transparent;border-image:var(--bv-iron) 4 fill / 8px;background:#4a4458;background-clip:padding-box;image-rendering:pixelated}
body.stickmode .pad{display:none}

/* Hochformat: Spielfeld oben, Steuerpult unten */
body.portrait #screen{top:0;transform:translateX(-50%)}
body.portrait #touch{background:linear-gradient(to bottom,transparent var(--ch),transparent var(--ch)),var(--tex-stone) 0 var(--ch)/64px;background-repeat:no-repeat,repeat;image-rendering:pixelated;clip-path:none}
body.portrait #touch::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--ch);background:var(--bg);z-index:-1}
body.portrait #touch::after{content:"";position:absolute;left:0;right:0;top:var(--ch);height:12px;border-top:4px solid var(--k);background:repeating-linear-gradient(90deg,#c8901c 0 12px,#8a5a10 12px 14px);box-shadow:0 4px 0 #0008}
body.portrait #touch{--s:min(74px,18.5vw)}
body.portrait #touch button{width:var(--s);height:var(--s);font-size:26px;opacity:1}
body.portrait .pad button[data-k=left]{left:calc(env(safe-area-inset-left) + 3vw);bottom:calc(env(safe-area-inset-bottom) + var(--s) * .95 + 14px)}
body.portrait .pad button[data-k=down]{left:calc(env(safe-area-inset-left) + 3vw + var(--s) * .72);bottom:calc(env(safe-area-inset-bottom) + 12px);width:var(--s);height:calc(var(--s) * .9)}
body.portrait .pad button[data-k=right]{left:calc(env(safe-area-inset-left) + 3vw + var(--s) * 1.44);bottom:calc(env(safe-area-inset-bottom) + var(--s) * .95 + 14px)}
body.portrait .acts .a{right:calc(env(safe-area-inset-right) + 3vw)!important;bottom:calc(env(safe-area-inset-bottom) + var(--s) * .95 + 8px)!important;width:calc(var(--s) * 1.25)!important;height:calc(var(--s) * 1.25)!important}
body.portrait .acts .b{right:calc(env(safe-area-inset-right) + 3vw + var(--s) * 1.3)!important;bottom:calc(env(safe-area-inset-bottom) + 14px)!important;width:calc(var(--s) * 1.1)!important;height:calc(var(--s) * 1.1)!important}
body.portrait #touch button em{display:block;position:absolute;left:-10px;right:-10px;bottom:-26px;font:700 12px "Pixelify Sans",sans-serif;font-style:normal;color:var(--gold);text-shadow:2px 2px 0 var(--k)}
body.portrait .acts .b em{bottom:auto;top:-28px}
body.portrait #pauseBtn{top:calc(env(safe-area-inset-top) + 6px)}
body.touchdev:not(.portrait) #touch button{opacity:.75}
@media (max-height:360px){body.touchdev:not(.portrait) #touch button{width:56px;height:56px;font-size:20px}}

/* ---------- Kleine Bildschirme ---------- */
@media (max-height:420px){
  .panel{border-width:15px;border-image-width:15px;padding:2px 8px 8px}.top{margin-bottom:6px}.card{min-height:84px}
  .detail{margin-top:6px;padding:6px 8px}
}
@media (max-width:640px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.forge{flex-direction:column;align-items:center}
  .achgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wardrobe{grid-template-columns:repeat(2,minmax(0,1fr))}.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{border-width:15px;border-image-width:15px;padding:2px 6px 8px}
}
@media (prefers-reduced-motion:reduce){.rays,.rcard canvas,.title .logo,.card.sel,.title .daily{animation:none}}
.px.huge{width:84px!important;height:84px!important}

@media (orientation:portrait){.title .logo{width:92vw;height:auto}}

</style>

<body>
<canvas id="screen"></canvas>
<div id="touch" hidden>
  <div class="pad">
    <button data-k="left" aria-label="Links">◀</button>
    <button data-k="down" aria-label="Schaufel nach unten">▼</button>
    <button data-k="right" aria-label="Rechts">▶</button>
  </div>
  <div id="stick" hidden><i></i></div>
  <div class="acts">
    <button data-k="attack" class="b" aria-label="Schaufel">B<em>Schaufel</em></button>
    <button data-k="jump" class="a" aria-label="Springen">A<em>Sprung</em></button>
  </div>
</div>
<button id="pauseBtn" hidden aria-label="Pause">II</button>
<div id="ui" hidden></div>
<script>
(() => {
  const SRC = {"audio.js":"// Chiptune-Soundeffekte und Musik, komplett synthetisiert (WebAudio, keine Dateien).\nlet ac = null, master = null, musicGain = null, sfxGain = null;\nconst st = { sfx: true, music: true };\n\nexport function unlockAudio() {\n  if (!ac) {\n    try {\n      ac = new (window.AudioContext || window.webkitAudioContext)();\n      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);\n      musicGain = ac.createGain(); musicGain.gain.value = st.music ? 0.32 : 0; musicGain.connect(master);\n      sfxGain = ac.createGain(); sfxGain.gain.value = st.sfx ? 0.8 : 0; sfxGain.connect(master);\n    } catch { ac = null; }\n  }\n  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});\n}\nexport function setAudio(sfx, music) {\n  st.sfx = sfx; st.music = music;\n  if (sfxGain) sfxGain.gain.value = sfx ? 0.8 : 0;\n  if (musicGain) musicGain.gain.value = music ? 0.32 : 0;\n}\n\nfunction osc(type, f0, f1, dur, vol, when = 0, out = sfxGain) {\n  if (!ac) return;\n  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();\n  o.type = type; o.frequency.setValueAtTime(f0, t);\n  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);\n  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);\n  o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);\n}\nlet noiseBuf = null;\nfunction noise(dur, vol, freq = 1200, when = 0) {\n  if (!ac) return;\n  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }\n  const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();\n  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;\n  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);\n  s.connect(f).connect(g).connect(sfxGain); s.start(t); s.stop(t + dur + 0.02);\n}\n\nconst SFX = {\n  jump: () => osc('square', 300, 620, 0.12, 0.12),\n  swing: () => noise(0.08, 0.15, 3000),\n  dig: () => { noise(0.14, 0.35, 700); osc('triangle', 180, 90, 0.12, 0.2); },\n  crack: () => { noise(0.2, 0.4, 1600); osc('square', 220, 70, 0.15, 0.12); },\n  clink: () => { osc('square', 1600, 1400, 0.06, 0.08); osc('triangle', 2400, 2200, 0.1, 0.06, 0.02); },\n  // Edelstein-Serie: jeder weitere Stein in kurzer Folge einen Halbton höher (bis eine Oktave)\n  gem: (n = 1) => { const k = 2 ** (Math.min(12, n - 1) / 12); osc('square', 988 * k, 988 * k, 0.06, 0.08); osc('square', 1319 * k, 1319 * k, 0.12, 0.08, 0.05); },\n  hit: () => { osc('square', 440, 110, 0.1, 0.15); noise(0.06, 0.2, 2000); },\n  // Pogo-Kette: steigende Tonleiter\n  bounce: (n = 1) => { const k = 2 ** ([0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19][Math.min(11, n - 1)] / 12); osc('square', 200 * k, 800 * k, 0.1, 0.12); if (n >= 3) osc('triangle', 523 * k, 523 * k, 0.12, 0.08, 0.03); },\n  chainEnd: (n = 3) => [0, 4, 7, 12].slice(0, Math.min(4, n - 1)).forEach((s, i) => osc('square', 523 * 2 ** (s / 12), 523 * 2 ** (s / 12), 0.1, 0.07, i * 0.05)),\n  dash: () => { noise(0.18, 0.25, 4000); osc('sine', 900, 300, 0.2, 0.12); },\n  wave: () => { noise(0.25, 0.3, 500); osc('triangle', 140, 60, 0.2, 0.2); },\n  revive: () => [262, 330, 392, 523, 659, 784].forEach((n, i) => osc('triangle', n, n, 0.3, 0.12, i * 0.08)),\n  legend: () => {\n    [392, 523, 659, 784, 1047].forEach((n, i) => osc('square', n, n, 0.18, 0.09, i * 0.09));\n    [1047, 1319, 1568].forEach(n => osc('square', n, n, 0.9, 0.06, 0.5)); osc('triangle', 131, 131, 1.2, 0.25, 0.5); noise(0.8, 0.15, 6000, 0.5);\n  },\n  star: () => { osc('square', 1568, 1568, 0.08, 0.08); osc('square', 2093, 2093, 0.25, 0.08, 0.08); },\n  tick: () => osc('square', 1760, 1760, 0.02, 0.04),\n  secret: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((n, i) => osc('triangle', n, n, 0.12, 0.12, i * 0.07)),\n  coin: () => { [988, 1319, 1568, 1976].forEach((n, i) => osc('square', n, n, 0.12, 0.08, i * 0.05)); osc('triangle', 2637, 2637, 0.4, 0.06, 0.2); },\n  golden: () => { noise(0.2, 0.3, 3000); [784, 988, 1175, 1568].forEach((n, i) => osc('square', n, n, 0.1, 0.09, i * 0.04)); },\n  rush: () => { [262, 330, 392, 523, 659, 784, 1047].forEach((n, i) => osc('sawtooth', n, n, 0.12, 0.06, i * 0.03)); noise(0.5, 0.2, 5000, 0.1); },\n  flag: () => [784, 1047, 1319, 1568, 2093].forEach((n, i) => osc('triangle', n, n, 0.12, 0.1, i * 0.06)),\n  crumble: () => noise(0.15, 0.25, 900),\n  chestRare: (r = 0) => { if (r >= 0.88) [523, 659, 784, 1047, 1319, 1568].forEach((n, i) => osc('square', n, n, 0.15, 0.09, 0.3 + i * 0.07)); },\n  sleep: () => [392, 330, 262].forEach((n, i) => osc('sine', n, n, 0.4, 0.08, i * 0.35)),\n  achieve: () => [659, 784, 988, 1319].forEach((n, i) => osc('square', n, n, 0.12, 0.08, i * 0.08)),\n  boing: () => { osc('triangle', 150, 900, 0.25, 0.25); osc('square', 300, 1200, 0.2, 0.05); },\n  hurt: () => { osc('sawtooth', 400, 80, 0.3, 0.18); noise(0.15, 0.2, 900); },\n  die: () => { [0, 0.12, 0.24, 0.36].forEach((w, i) => osc('square', 440 / (i + 1), 200 / (i + 1), 0.14, 0.14, w)); },\n  poof: () => { noise(0.2, 0.3, 1200); osc('square', 600, 120, 0.15, 0.08); },\n  heal: () => [523, 659, 784].forEach((n, i) => osc('triangle', n, n, 0.12, 0.15, i * 0.06)),\n  check: () => [392, 523, 659, 784].forEach((n, i) => osc('square', n, n, 0.12, 0.08, i * 0.07)),\n  chest: () => [523, 659, 784, 1047, 1319].forEach((n, i) => osc('square', n, n, 0.14, 0.09, i * 0.06)),\n  win: () => [523, 523, 523, 659, 784, 1047].forEach((n, i) => osc('square', n, n, 0.2, 0.1, [0, .12, .24, .36, .5, .7][i])),\n  win2: () => SFX.win(),\n  blob: () => osc('sine', 200, 420, 0.12, 0.12),\n  screech: () => osc('sawtooth', 1800, 1200, 0.12, 0.04),\n  bossStart: () => { noise(0.6, 0.4, 400); osc('sawtooth', 80, 40, 0.6, 0.2); },\n  charge: () => osc('sawtooth', 120, 260, 0.3, 0.12),\n  thud: () => { noise(0.4, 0.5, 300); osc('triangle', 90, 40, 0.3, 0.35); },\n  rumble: () => noise(0.5, 0.3, 200),\n  pop: () => { noise(0.25, 0.4, 600); osc('square', 100, 300, 0.15, 0.12); },\n  boom: () => { noise(0.3, 0.4, 500); osc('triangle', 120, 40, 0.25, 0.25); },\n  bossDie: () => { noise(1, 0.4, 600); [330, 262, 196, 131].forEach((n, i) => osc('square', n, n / 2, 0.3, 0.12, i * 0.2)); },\n  buy: () => [659, 880, 1175].forEach((n, i) => osc('square', n, n, 0.12, 0.1, i * 0.07)),\n  nope: () => osc('square', 160, 120, 0.15, 0.1),\n  click: () => osc('square', 880, 880, 0.04, 0.06),\n};\nexport function sfx(name, v) { if (ac && SFX[name]) SFX[name](v); }\n\n/* ---------- Musik ---------- */\nconst NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };\nconst freq = n => { const m = n.match(/^([A-G]#?)(\\d)$/); if (!m) return 0; return 440 * 2 ** ((NOTE[m[1]] + (+m[2] + 1) * 12 - 69) / 12); };\nconst parse = s => s.trim().split(/\\s+/);\nlet song = null, timer = null, step = 0, nextT = 0;\n\nexport function playMusic(m) {\n  if (song === m) return;\n  stopMusic(); song = m; if (!m || !ac) return;\n  const lead = parse(m.lead), bass = parse(m.bass), dt = 60 / m.bpm / 2;\n  step = 0; nextT = ac.currentTime + 0.1;\n  const len = (arr, i) => { let n = 1; while (arr[(i + n) % arr.length] === '-' && n < 8) n++; return n; };\n  timer = setInterval(() => {\n    if (!ac) return;\n    while (nextT < ac.currentTime + 0.25) {\n      const i = step % lead.length, j = step % bass.length;\n      const l = lead[i], b = bass[j];\n      if (l !== '.' && l !== '-') { const d = dt * len(lead, i); osc('square', freq(l), freq(l), d * 0.9, 0.09, nextT - ac.currentTime, musicGain); osc('square', freq(l) * 1.005, freq(l) * 1.005, d * 0.6, 0.03, nextT - ac.currentTime + 0.01, musicGain); }\n      if (b !== '.' && b !== '-') { const d = dt * len(bass, j); osc('triangle', freq(b), freq(b), d * 0.95, 0.22, nextT - ac.currentTime, musicGain); }\n      if (step % 4 === 0) noiseHat(nextT - ac.currentTime, step % 8 === 0 ? 0.06 : 0.03);\n      nextT += dt; step++;\n    }\n  }, 60);\n}\nfunction noiseHat(when, vol) {\n  if (!ac || !noiseBuf) { noise(0.001, 0.0001); return; }\n  const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();\n  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 6000;\n  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);\n  s.connect(f).connect(g).connect(musicGain); s.start(t); s.stop(t + 0.06);\n}\nexport function stopMusic() { if (timer) clearInterval(timer); timer = null; song = null; }\n","config.js":"// Für Online-Geister hier die Supabase-Projekt-URL und den öffentlichen \"anon\"-Schlüssel eintragen.\n// Der anon-Schlüssel ist dafür gedacht, im Browser zu stehen; die Rechte regeln die Policies (README).\nexport const CONFIG = {\n  version: '0.8.0',\n  supabaseUrl: '',\n  supabaseKey: '',\n};\n","game.js":"// Spiellogik ohne DOM: läuft im Browser und in Node-Tests gleich.\n// Fester Zeitschritt: ein step() = 1/60 Sekunde.\nimport { SHOVEL, ARMOR } from './gear.js';\nimport { weaponMods } from './weapons.js';\n\nexport const T = 16;\nconst SOLID = new Set(['#', 'D', 'S', 'B', '^', 'X', 'V', 'R', 'F', 'J', 'c']);\nconst GRAV = 0.36, MAXFALL = 6.5, BOUNCE = 5.5;\n\nconst overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;\nconst cx = e => e.x + e.w / 2;\nconst sign = v => (v < 0 ? -1 : 1);\n\n// kleiner deterministischer Zufall, damit Geister-Läufe reproduzierbar aussehen\nfunction rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }\n\nexport class Game {\n  constructor(level, gear, opt = {}) {\n    this.level = level;\n    this.sh = SHOVEL[gear.shovel];\n    this.ar = ARMOR[gear.armor];\n    this.gear = gear;\n    this.mod = weaponMods(gear.weapon);\n    this.dmg = Math.round(this.sh.dmg * this.mod.dmgMul);\n    this.reach = this.sh.reach + this.mod.reach;\n    // Statistiken für Sterne und Waffen-Bedingungen\n    this.kills = 0; this.hurtCount = 0; this.bossHurt = 0; this.bossClean = false;\n    this.chain = 0; this.maxChain = 0; this.soulUsed = false; this.streak = 0; this.streakT = 0;\n    this.freeze = 0; this.nums = []; this.banner = null;\n    this.tiles = level.map.map(r => r.split(''));\n    this.h = this.tiles.length;\n    this.w = this.tiles[0].length;\n    this.rand = rng(opt.seed || 7);\n    this.ents = []; this.parts = []; this.events = []; this.vents = []; this.plats = [];\n    this.frame = 0; this.gems = 0; this.deaths = 0; this.dirtTotal = 0;\n    this.secretTotal = 0; this.secretsFound = 0; this.coins = []; this.crumbles = new Map();\n    this.rush = 0; this.rushT = 0; this.idle = 0; this.flagBonus = false; this.exit = null;\n    this.done = false; this.shake = 0; this.sign = null; this.boss = null;\n    this.rec = [];\n    const signs = [];\n    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {\n      const c = this.tiles[y][x];\n      if (c === 'D') this.dirtTotal++;\n      if (c === 'V') this.vents.push({ tx: x, ty: y });\n      if (c === 'H') this.secretTotal++;\n      if ('.#=DSB^XVRFHJc'.includes(c)) continue;\n      this.tiles[y][x] = '.';\n      const px = x * T, py = y * T;\n      switch (c) {\n        case 'P': this.spawn = { x: px + 3, y: py + 2 }; break;\n        case 'b': this.add(beetle(px + 1, py + 7)); break;\n        case 'o': this.add(blorb(px + 2, py + 6)); break;\n        case 'v': this.add(bat(px + 2, py + 2)); break;\n        case 'G': this.add(gem(px + 4, py + 4, 5, true)); break;\n        case 'O': this.add({ type: 'coin', x: px + 2, y: py + 2, w: 12, h: 12, idx: 0 }); break;\n        case 'Y': this.add({ type: 'door', x: px, y: py - 8, w: 16, h: 24 }); break;\n        case 's': this.add(spitter(px + 1, py + 4)); break;\n        case 'N': this.boss = this.add(morchel(px - 8, py - 14)); break;\n        case 'h': this.add({ type: 'apple', x: px + 4, y: py + 8, w: 8, h: 8 }); break;\n        case 'T': this.add({ type: 'chest', x: px + 1, y: py + 4, w: 14, h: 12, open: false, key: `${level.id}:${x}:${y}` }); break;\n        case 'Q': this.add({ type: 'altar', x: px - 4, y: py - 8, w: 24, h: 24, taken: false }); break;\n        case 'C': this.add({ type: 'lantern', x: px + 4, y: py + 2, w: 8, h: 14, lit: false }); break;\n        case 'E': this.add({ type: 'goal', x: px + 2, y: py - 32, w: 12, h: 48 }); break;\n        case 'i': { const s = { type: 'sign', x: px + 1, y: py + 2, w: 14, h: 14, text: '' }; signs.push(s); this.add(s); break; }\n        case 'M': this.boss = this.add(mole(px - 8, py - 10)); break;\n        case 'W': this.boss = this.add(golem(px - 6, py - 14)); break;\n        case 'm': this.plats.push(plat(px, py, 'x')); break;\n        case 'n': this.plats.push(plat(px, py, 'y')); break;\n        case 'z': this.add({ type: 'cog', x: px - 2, y: py - 2, w: 20, h: 20 }); break;\n        case 'k': this.add(knight(px + 2, py + 2)); break;\n        case 'u': this.add(kuckuck(px + 1, py + 3)); break;\n      }\n    }\n    signs.sort((a, b) => a.x - b.x).forEach((s, i) => { s.text = level.signs[i] || ''; });\n    this.secretTotal += countFakeGroups(this.tiles);\n    // Hinter falschen Wänden verborgene Kammern bleiben abgedeckt, bis die Wand bricht\n    this.hidden = new Set();\n    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {\n      if (this.tiles[y][x] !== 'F') continue;\n      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {\n        const cells = new Set(), st = [[x + dx, y + dy]]; let open = true;\n        while (st.length && open) {\n          const [a, b] = st.pop(), k = a + ',' + b;\n          if (cells.has(k) || this.hidden.has(k)) continue;\n          const c = this.tile(a, b);\n          if (SOLID.has(c)) continue;\n          if (b < 0 || b >= this.h || a < 0 || a >= this.w) { open = false; break; }\n          cells.add(k); if (cells.size > 60) { open = false; break; }\n          st.push([a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1]);\n        }\n        if (open) for (const k of cells) this.hidden.add(k);\n      }\n    }\n    // Münzen in fester Reihenfolge nummerieren (für den Spielstand)\n    this.ents.filter(e => e.type === 'coin').sort((a, b) => a.x - b.x || a.y - b.y).forEach((c, i) => { c.idx = i; });\n    // Seltene goldene Gegner (deterministisch pro Level)\n    for (const e of this.ents) if (e.foe && e !== this.boss && ['beetle', 'blorb', 'knight', 'bat'].includes(e.type) && this.rand() < 0.07) {\n      e.golden = true; e.hp += 2; e.loot = 60;\n    }\n    this.coinTotal = this.ents.filter(e => e.type === 'coin').length;\n    if (!this.spawn) this.spawn = { x: 24, y: 100 };\n    this.check = { ...this.spawn };\n    const p = this.p = {\n      type: 'player', x: this.spawn.x, y: this.spawn.y, w: 10, h: 14, vx: 0, vy: 0,\n      face: 1, hp: this.ar.hp, maxhp: this.ar.hp, atk: 0, atkCd: 0, pogo: false,\n      inv: 0, hurt: 0, safe: 0, coyote: 0, jbuf: 0, jumping: false, dead: 0, drop: 0, anim: 0,\n      land: 0, dash: 0, dashUsed: false,\n    };\n    p.onGround = false;\n  }\n\n  add(e) { this.ents.push(e); return e; }\n  ev(name, x, y, v) { this.events.push({ name, x, y, v }); }\n  num(x, y, txt, col = '#fff') { this.nums.push({ x, y, txt: String(txt), col, life: 40 }); }\n  // Dampfstoss: 70 von 120 Frames aktiv, Säule 6 Kacheln über dem Rohr\n  // Geheimnisse\n  secret(x, y, label) {\n    this.secretsFound++; this.ev('secret', x, y);\n    this.banner = { text: label || 'GEHEIMNIS!', sub: `${this.secretsFound} / ${this.secretTotal}`, col: '#7dffcf', t: 80 };\n    this.burst(x, y, 24, 'spark', 2.5, 0.02, 30); this.freeze = Math.max(this.freeze, 8);\n  }\n  revealBlock(tx, ty) {\n    this.tiles[ty][tx] = 'J'; this.shake = 4;\n    this.dropGems(tx * T + 8, ty * T - 2, 25);\n    this.secret(tx * T + 8, ty * T + 8, 'VERSTECKTER BLOCK!');\n  }\n  // Bröckelplattformen: zerfallen kurz nach dem Betreten, wachsen nach 3 Sekunden nach\n  stepCrumbles() {\n    for (const [k, c] of this.crumbles) {\n      c.t++;\n      if (c.state === 'shake' && c.t > 22) { this.tiles[c.ty][c.tx] = '.'; c.state = 'gone'; c.t = 0; this.burst(c.tx * T + 8, c.ty * T + 6, 8, 'crumble', 1.5); this.ev('crumble'); }\n      else if (c.state === 'gone' && c.t > 180) {\n        const p = this.p, box = { x: c.tx * T, y: c.ty * T, w: T, h: T };\n        if (!overlap(p, box)) { this.tiles[c.ty][c.tx] = 'c'; this.crumbles.delete(k); }\n      }\n    }\n  }\n  touchCrumble(tx, ty) {\n    const k = tx + ',' + ty;\n    if (!this.crumbles.has(k)) this.crumbles.set(k, { tx, ty, t: 0, state: 'shake' });\n  }\n  addRush(n) {\n    if (this.rushT > 0) return;\n    this.rush = Math.max(0, Math.min(100, this.rush + n));\n    if (this.rush >= 100) { this.rushT = 600; this.rush = 100; this.ev('rush'); this.banner = { text: 'RAUSCH!', sub: 'ALLES ZÄHLT DOPPELT', col: '#ffd84a', t: 70 }; this.freeze = Math.max(this.freeze, 12); }\n  }\n  ventOn(v) { return (this.frame + v.tx * 23) % 120 < 70; }\n  dirtLeft() { let n = 0; for (const r of this.tiles) for (const c of r) if (c === 'D') n++; return n; }\n\n  tile(tx, ty) {\n    if (tx < 0 || tx >= this.w) return '#';\n    if (ty < 0 || ty >= this.h) return '.';\n    return this.tiles[ty][tx];\n  }\n  solid(tx, ty) { return SOLID.has(this.tile(tx, ty)); }\n\n  moveX(b) {\n    b.x += b.vx; b.hitWall = false;\n    const top = Math.floor(b.y / T), bot = Math.floor((b.y + b.h - 0.01) / T);\n    if (b.vx > 0) {\n      const tx = Math.floor((b.x + b.w - 0.01) / T);\n      for (let ty = top; ty <= bot; ty++) if (this.solid(tx, ty)) { b.x = tx * T - b.w; b.vx = 0; b.hitWall = true; break; }\n    } else if (b.vx < 0) {\n      const tx = Math.floor(b.x / T);\n      for (let ty = top; ty <= bot; ty++) if (this.solid(tx, ty)) { b.x = (tx + 1) * T; b.vx = 0; b.hitWall = true; break; }\n    }\n  }\n  moveY(b) {\n    const prevBot = b.y + b.h;\n    b.    e.dx = nx - e.x; e.dy = ny - e.y; e.x = nx; e.y = ny;\n    } };\n}\nfunction knight(x, y) {\n  return foeBase({ type: 'knight', x, y, w: 12, h: 14, hp: 3, dmg: 1, dir: -1, t: 0, loot: 14,\n    hurtBy(g, e, dmg, dir, src) {\n      const front = sign(cx(g.p) - cx(e)) === e.dir;\n      if (src !== 'pogo' && dir && front) {\n        g.ev('clink'); g.burst(e.dir > 0 ? e.x + e.w : e.x, e.y + 7, 8, 'spark', 2, 0.05, 12);\n        if (!g.p.dead) { g.p.vx = e.dir * 2.4; g.p.hurt = Math.max(g.p.hurt, 6); }\n        g.num(cx(e), e.y - 4, 'BLOCK', '#a9b5c2'); e.vx = -e.dir * 0.8;\n        return;\n      }\n      hurtFoe(g, e, dmg, dir, src);\n    },\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      const dx = cx(g.p) - cx(e);\n      if (++e.t % 80 === 0 && Math.abs(dx) < 130) e.dir = sign(dx);\n      if (Math.abs(e.vx) > 0.5) e.vx *= 0.85; else e.vx = 0.35 * e.dir;\n      e.vy = Math.min(MAXFALL, e.vy + GRAV);\n      g.moveX(e); if (e.hitWall) e.dir *= -1;\n      g.moveY(e);\n      if (e.onGround) { const ahead = Math.floor((e.dir > 0 ? e.x + e.w + 1 : e.x - 1) / T); if (!g.solid(ahead, Math.floor((e.y + e.h + 2) / T))) e.dir *= -1; }\n      if (e.y > g.h * T + 20) e.dead = true;\n    } });\n}\nfunction kuckuck(x, y) {\n  return foeBase({ type: 'kuckuck', x, y, w: 14, h: 10, hp: 1, dmg: 1, ox: x, oy: y, dir: 1, t: 0, loot: 10,\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      e.t++; e.x += e.dir * 0.8;\n      if (e.x > e.ox + 56) e.dir = -1; if (e.x < e.ox - 56) e.dir = 1;\n      e.y = e.oy + Math.sin(e.t / 20) * 3;\n      if (e.t % 110 === 0 && Math.abs(cx(g.p) - cx(e)) < 120 && g.p.y > e.y) { g.add(eproj(cx(e) - 2, e.y + e.h, 0, 2.4, 'bolt')); g.ev('screech'); }\n    } });\n}\nfunction eproj(x, y, vx, vy, kind) {\n  const sz = { shock: [12, 10], gear: [12, 12], bolt: [4, 8], spore: [7, 7] }[kind];\n  return { type: 'eproj', kind, x, y, w: sz[0], h: sz[1], vx, vy, dmg: 1, life: kind === 'gear' ? 300 : 160, e.vy = -7.2; e.vx = Math.max(-2.4, Math.min(2.4, dx / 36)); g.ev('charge'); } return;\n        case 'leap':\n          grav(); if (e.hitWall) e.vx = 0;\n          if (e.onGround) {\n            e.state = 'tired'; e.t = 80; g.shake = 9; g.ev('thud'); g.freeze = Math.max(g.freeze, 4);\n            for (const d of [-1, 1]) g.add(eproj(cx(e) - 6 + d * 12, e.y + e.h - 10, d * 3 * fast, 0, 'shock'));\n          }\n          return;\n        case 'throw':\n          e.vx = 0; e.face = sign(dx); grav();\n          if (e.t % 10 === 0 && e.t > 0 && (e.t <= 30 || fast > 1)) { g.add(eproj(cx(e) - 6, e.y + 2, e.face * (1.2 + g.rand() * 1.3) * fast, -3.8, 'gear')); g.ev('swing'); }\n          if (--e.t <= 0) { e.state = 'walk'; e.t = 80; }\n          return;\n        case 'tired': e.vx = 0; grav(); if (--e.t <= 0) { e.state = 'walk'; e.t = 50; } return;\n        case 'dying':\n          e.vx = 0; grav();\n          if (e.t % 8 === 0) { g.burst(e.x + g.rand() * e.w, e.y + g.rand() * e.h, 10, 'spark', 2.5, 0, 24); g.ev('boom'); g.shake = 6; }\n          if (--e.t <= 0) {\n            e.dead = true; g.dropGems(cx(e), e.y, 400);\n            g.add({ type: 'goal', x: Math.round(cx(e) / T) * T + 2, y: e.y + e.h - 48, w: 12, h: 48 });\n            g.setGate('.'); g.ev('win2');\n          }\n          return;\n      }\n    } });\n}\n\n/* ---------- Welt 3: Pilzwald ---------- */\nfunction spitter(x, y) {\n  return foeBase({ type: 'spitter', x, y, w: 14, h: 12, hp: 2, dmg: 1, t: 30, face: -1, loot: 12,\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      const dx = cx(g.p) - cx(e); e.face = sign(dx);\n      if (++e.t % 110 === 0 && Math.abs(dx) < 150) {\n        const v = Math.max(-2.4, Math.min(2.4, dx / 45));\n        g.add(eproj(cx(e) - 3, e.y - 2, v, -3.6, 'spore')); g.ev('blob', e.x, e.y); e.puff = 10;\n      }\n      if (e.puff) e.puff--;\n    } });\n}\nfunction morchel(x, y) {\n  return foeBase({ type: 'morchel', title: 'MORCHELMUTTER', x, y, w: 30, h: 30, hp: 38, maxhp: 38, dmg: 2, state: 'idle', t: 0, face: -1, cyc: 0, home: { x, y },\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      const p = g.p, dx = cx(p) - cx(e), fast = e.hp <= e.maxhp / 2 ? 1.3 : 1;\n      const grav = () => { e.vy = Math.min(MAXFALL, e.vy + GRAV); g.moveX(e); g.moveY(e); };\n      switch (e.state) {\n        case 'idle': grav(); return;\n        case 'roar': e.vx = 0; grav(); if (e.t % 10 === 0) g.shake = 3; if (--e.t <= 0) { e.state = 'walk'; e.t = 60; } return;\n        case 'walk': e.face = sign(dx); e.vx = e.face * 0.5 * fast; grav(); if (--e.t <= 0) { e.state = ['hop', 'volley', 'hop', 'summon'][e.cyc++ % 4]; e.t = 30; e.hops = 3; } return;\n        case 'hop':\n          grav();\n          if (e.onGround) {\n            e.vx = 0;\n            if (e.landed) { e.landed = false; g.shake = 6; g.ev('thud'); for (const d of [-1, 1]) g.add(eproj(cx(e) - 6 + d * 12, e.y + e.h - 10, d * 2.6 * fast, 0, 'shock')); if (--e.hops <= 0) { e.state = 'tired'; e.t = 70; return; } }\n            if (--e.t <= 0) { e.vy = -6.4; e.vx = Math.max(-2.6, Math.min(2.6, dx / 40)); e.landed = true; e.t = 14; g.ev('boing'); }\n          }\n          return;\n        case 'volley':\n          e.vx = 0; grav();\n          if (e.t % 6 === 0 && e.t > 0) { const k = (30 - e.t) / 6; g.add(eproj(cx(e) - 3, e.y, (k - 2) * 0.9 * fast + sign(dx) * 0.6, -4.4, 'spore')); g.ev('blob'); }\n          if (--e.t <= 0) { e.state = 'walk'; e.t = 70; }\n          return;\n        case 'summon':\n          e.vx = 0; grav();\n          if (e.t === 15 && g.ents.filter(o => o.type === 'blorb' && !o.dead).length < 3) for (const d of [-1, 1]) { const b = blorbAt(cx(e) + d * 24, e.y + 10); b.vy = -3; g.add(b); }\n          if (--e.t <= 0) { e.state = 'walk'; e.t = 60; }\n          return;\n        case 'tired': e.vx = 0; grav(); if (--e.t <= 0) { e.state = 'walk'; e.t = 50; } return;\n        case 'dying':\n          e.vx = 0; grav();\n          if (e.t % 8 === 0) { g.burst(e.x + g.rand() * e.w, e.y + g.rand() * e.h, 10, 'spore', 2.5, 0, 24); g.ev('boom'); g.shake = 6; }\n          if (--e.t <= 0) {\n            e.dead = true; g.dropGems(cx(e), e.y, 500);\n            g.add({ type: 'goal', x: Math.round(cx(e) / T) * T + 2, y: e.y + e.h - 48, w: 12, h: 48 });\n            g.setGate('.'); g.ev('win2');\n          }\n          return;\n      }\n    } });\n}\nfunction blorbAt(x, y) { return blorb(x, y); }\n\n// Zusammenhängende falsche Wände zählen als ein Geheimnis\nexport function countFakeGroups(tiles) {\n  const seen = new Set(); let n = 0;\n  for (let y = 0; y < tiles.length; y++) for (let x = 0; x < tiles[y].length; x++) {\n    if (tiles[y][x] !== 'F' || seen.has(x + ',' + y)) continue;\n    n++; const st = [[x, y]];\n    while (st.length) { const [a, b] = st.pop(), k = a + ',' + b; if (seen.has(k) || !tiles[b] || tiles[b][a] !== 'F') continue; seen.add(k); st.push([a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1]); }\n  }\n  return n;\n}\n","gear.js":"// Ausrüstung: 12 Materialstufen. AVAILABLE bestimmt, wie viele aktuell kaufbar sind.\n// Neue Welten schalten weitere Stufen frei (AVAILABLE erhöhen + Perks implementieren).\n\nexport const TIERS = [\n  { id: 'holz',           name: 'Holz',           dark: '#6b4426', light: '#b98a52' },\n  { id: 'bronze',         name: 'Bronze',         dark: '#8a4f1f', light: '#e9a25a' },\n  { id: 'eisen',          name: 'Eisen',          dark: '#4e5866', light: '#a9b5c2' },\n  { id: 'stahl',          name: 'Stahl',          dark: '#5f7894', light: '#eef5fc' },\n  { id: 'titan',          name: 'Titan',          dark: '#454f75', light: '#bcc8f2' },\n  { id: 'adamantium',     name: 'Adamantium',     dark: '#17735a', light: '#7dffcf' },\n  { id: 'mithril',        name: 'Mithril',        dark: '#7f8cb3', light: '#ffffff' },\n  { id: 'sternenmetall',  name: 'Sternenmetall',  dark: '#33247a', light: '#c9a8ff' },\n  { id: 'drachenknochen', name: 'Drachenknochen', dark: '#a07e52', light: ' ngerer Schutz nach Treffer' },\n  { hp: 12, kb: 0.0, spike: 1, inv: 110, perk: 'Kein Rückstoss mehr' },\n  { hp: 12, kb: 0.0, spike: 1, inv: 110, perk: 'Lava-fest' },\n  { hp: 13, kb: 0.0, spike: 1, inv: 110, perk: 'Doppelsprung' },\n  { hp: 14, kb: 0.0, spike: 0, inv: 110, perk: 'Stacheln egal' },\n  { hp: 15, kb: 0.0, spike: 0, inv: 110, perk: 'Unsichtbar für Fledermäuse' },\n  { hp: 16, kb: 0.0, spike: 0, inv: 110, perk: 'Rückspulen bei Absturz' },\n  { hp: 20, kb: 0.0, spike: 0, inv: 130, perk: 'Ewiger Glanz' },\n];\n","ghost.js":"// Geister: Aufzeichnung eines Laufs (x, y, Pose alle 2 Frames) als teilbarer Code.\n// Format: \"SH1.\" + base64url(JSON-Kopf) + \".\" + base64url(Bytes) — Bytes optional deflate-komprimiert.\n// Bytes pro Sample: dx, dy (Int8) und Flags. Grosse Sprünge (Respawn) via Escape 127 + 2×Int16.\n\nconst b64 = {\n  enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, ''); },\n  dec(str) { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },\n};\nconst txt = { enc: s => new TextEncoder().encode(s), dec: b => new TextDecoder().decode(b) };\n\nasync function pipe(bytes, Stream, fmt) {\n  const out = new Response(new Blob([bytes]).stream().pipeThrough(new Stream(fmt)));\n  return new Uint8Array(await out.arrayBuffer());\n}\nconst canZip = () => typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';\n\nexport async function encodeGhost({ level, name, frames, gear, rec }) {\n  const out = [];\n  let px = 0, py = 0;\n  for (const [x, y, f] of rec) {\n    const dx = x - px, dy = y - py;\n    if (dx > -127 && dx < 127 && dy > -127 && dy < 127) out.push(dx & 255, dy & 255, f & 255);\n    else out.push(127, x & 255, (x >> 8) & 255, y & 255, (y >> 8) & 255, f &  'right', KeyD: 'right', ArrowDown: 'down', KeyS: 'down',\n  Space: 'jump', KeyZ: 'jump', KeyK: 'jump', ArrowUp: 'jump', KeyW: 'jump',\n  KeyX: 'attack', KeyJ: 'attack', KeyC: 'attack',\n};\nconst NAMES = ['left', 'right', 'down', 'jump', 'attack'];\nconst kb = {}, touch = {}, prev = {}, latch = {};\n\nexport const input = { left: false, right: false, down: false, jump: false, attack: false, jumpP: false, attackP: false };\n\n// Daumen-Stick: linke Bildschirmhälfte, Ursprung dort, wo der Daumen aufsetzt\nconst stick = { id: null, ox: 0, oy: 0, on: false };\nexport function setStickMode(on) { stick.on = on; stick.id = null; }\nexport function initInput(touchEl, onAny) {\n  const stickEl = touchEl.querySelector('#stick'), knob = stickEl && stickEl.querySelector('i');\n  addEventListener('keydown', e => { const k = KEYS[e.code]; if (k) { if (!kb[k]) latch[k] = true; kb[k] = true; e.preventDefault(); } onAny && onAny(e); });\n  addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) kb[k] = false; });\n  addEventListener('blur', () => { for (const k in kb) kb[k] = false; });\n\n  const btns = [...touchEl.querySelectorAll('[data-k]')];\n  const update = (e) => {\n    e.preventDefault();\n    const was = { ...touch };\n    for (const n of NAMES) touch[n] = false;\n    const rects = btns.filter(b => b.offsetParent !== null).map(b => [b, b.getBoundingClientRect()]);\n    let stickSeen = false;\n    for (const t of e.touches) {\n      if (stick.on) {\n        if (stick.id === null && t.clientX < innerWidth * 0.45 && e.type === 'touchstart' && [...e.changedTouches].some(c => c.identifier === t.identifier)) {\n          stick.id = t.identifier; stick.ox = t.clientX; stick.oy = t.clientY;\n          if (stickEl) { stickEl.hidden = false; stickEl.style.left = stick.ox + 'px'; stickEl.style.top = stick.oy + 'px'; }\n        }\n        if (t.identifier === stick.id) {\n          stickSeen = true;\n          let dx = t.clientX - stick.ox, dy = t.clientY - stick.oy;\n          const d = Math.hypot(dx, dy), max = 44;\n          if (d > max) { stick.ox += dx * (1 - max / d); stick.oy += dy * (1 - max / d); dx = t.clientX - stick.ox; dy = t.clientY - stick.oy; if (stickEl) { stickEl.style.left = stick.ox + 'px'; stickEl.style.top = stick.oy + 'px'; } }\n          if (knob) knob.style.transform = `translate(${dx}px,${dy}px)`;\n          if (dx < -12) touch.left = true; if (dx > 12) touch.right = true; if (dy > 20) touch.down = true;\n          continue;\n        }\n      }\n      let best = null, bd = 1e9;\n      for (const [b, r] of rects) {\n        const pad = 18, x = t.clientX, y = t.clientY;\n        if (x < r.left - pad || x > r.right + pad || y < r.top - pad || y > r.bottom + pad) continue;\n        const d = (x - (r.left + r.right) / 2) ** 2 + (y - (r.top + r.bottom) / 2) ** 2;\n        if (d < bd) { bd = d; best = b; }\n      }\n      if (best) { if (!touch[best.dataset.k] && !was[best.dataset.k]) latch[best.dataset.k] = true; touch[best.dataset.k] = true; }\n    }\n    if (stick.on && !stickSeen && stick.id !== null) { stick.id = null; if (stickEl) stickEl.hidden = true; }\n    for (const b of btns) b.classList.toggle('on', !!touch[b.dataset.k]);\n    onAny && onAny(e);\n  };\n  for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) touchEl.addEventListener(ev, update, { passive: false });\n}\n\nexport function pollInput() {\n  const pad = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;\n  const gp = {};\n  if (pad) {\n    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0, b = i => pad.buttons[i] && pad.buttons[i].pressed;\n    gp.left = ax < -0.4 || b(14); gp.right = ax > 0.4 || b(15); gp.down = ay > 0.5 || b(13);\n    gp.jump = b(0); gp.attack = b(2) || b(1);\n  }\n  for (const n of NAMES) {\n    const v = !!(kb[n] || touch[n] || gp[n]);\n    input[n] = v;\n    if (n === 'jump') input.jumpP = (v && !prev.jump) || !!latch.jump;\n    if (n === 'attack') input.attackP = (v && !prev.attack) || !!latch.attack;\n    latch[n] = false;\n    prev[n] = v;\n  }\n  return input;\n}\nexport function clearInput() { for (const n of NAMES) { kb[n] = false; touch[n] = false; prev[n] = true; latch[n] = false; } }\n","levels.js":"// Levels werden aus 20 Kacheln breiten Segmenten zusammengesetzt (14 Reihen hoch).\n// Kürzere Segmente werden oben mit Luft aufgefüllt.\n//\n// Kacheln:  # Boden   = Plattform (von unten durchspringbar)   D Erde (grabbar)\n//           S Stein (ab Eisen-Schaufel)   ^ Stacheln   B Sprungpilz\n// Objekte:  P Start   C Laterne/Checkpoint   E Ziel   G Edelstein   h Apfel\n//           T Truhe   i Schild   b Käfer   o Blorb   v Fledermaus   M Boss   Q Altar\n\nexport const ROWS = 14; // Standardhöhe; Levels dürfen höher sein (siehe 1-3)\n\nfunction seg(...rows) {\n  while (rows.length < ROWS) rows.unshift('');\n  return rows;\n}\nfunction build(segs) {\n  const out = Array.from({ length: ROWS }, () => '');\n  for (const s of segs) {\n    const w = Math.max(...s.map(r => r.length));\n    s.forEach((r, i) => { out[i] += r.padEnd(w, '.'); });\n  }\n  return out;\n}\nconst G3 = '####################';\nconst CEIL = [G3, G3];\n\n/* ---------- 1-1 Moosweg ---------- */\nconst L1 = build([\n  seg('..............G.G...',\n      '....................',\n      '.............===....',\n      '.P.i...i.D..........', G3, G3, G3),\n  seg('..........GGG.......',\n      '....................',\n      '...............##...',\n      '...i..b.....DD.##...', G3, G3, G3),\n  seg('......GG............',\n      '....................',\n      '....................',\n      '..........b.........',\n      '####...####^^^######',\n      '####...#############',\n      '####...#############'),\n  seg('..............G.....',\n      '.............===....',\n      '....................',\n      '.........===........',\n      '................DDD.',\n      '.....===........DDD.',\n      '..C....h........DDD.', G3, G3, G3),\n  seg('.....v..............',\n      '.......... #^^^#######'),\n  seg('....v.....v....v....',\n      '....................',\n      '....................',\n      '......=...=...=.....',\n      '....................',\n      '###^^^^^^^^^^^^^^###', G3, G3),\n  seg('...........GGG......',\n      '....................',\n      WALL, WALL, WALL, WALL, WALL,\n      '...i...B..##########', G3, G3, G3),\n  seg('......b.............',\n      '##########...#######', '##########...#######', '##########...#######',\n      '##########...#######', '##########...#######', '##########...#######',\n      '##########...#######', '##########...#######', '##########...#######'),\n  seg('..C.................',\n      '######..............',\n      '######..............',\n      '######...o..........',\n      '######..####........',\n      '######..####...v....',\n      '######..####........', G3, G3, G3),\n  seg('....GGG.............',\n      '....................',\n      'SSS===..............',\n      'STS...b....B....E...', G3, G3, G3),\n]);\n\n// Geheimer Himmelspfad über dem Dornenkamm: 6 zusätzliche Reihen oben.\n// Pilz auf dem Plateau → Schaufel-Sprung → Wolkenplattform → Kette aus 12 Erdblöcken → Altar.\nfunction addSky(map, n, place) {\n  const w = map[0].length;\n  const sky = Array.from({ length: n }, () => '.'.repeat(w).split(''));\n  const rows = [...sky, ...map.map(r => r.split(''))];\n  for (const [x, y, str] of place) for (let i = 0; i < str.length; i++) rows[y][x + i] = str[i];\n  return rows.map(r => r.join(''));\n}\nconst SKY = [\n  [62, 5, '====='], [63, 6, 'G'], [63, 10, 'B'],\n  [105, 5, '====='], [107, 4, 'Q'],\n];\nfor (let k = 0; k < 12; k++) SKY.push([69 + k * 3, 6, 'D']);\nfor (let k = 0; k < 6; k++) SKY.push([70 + k * 6, 3, 'G']);\nconst L3S = addSky(L3, 6, SKY);\n\n/* ---------- 1-B Bau des Rostmaulwurfs ---------- */\nconst LB = [\n  '####################################',\n  '####################################',\n  '...................................#',\n  '...................................#',\n ches || 'ontouchstart' in window;\nconst R = new Renderer(ctx);\nlet VH = 180, VW = 320;\nconst D = save.d;\nsetAudio(D.sfx, D.music);\ninitSkin();\n\nconst embers = [];\nlet curCodes = [], mode = 'menu', game = null, ghosts = [], level = null, doneT = 0, menuT = 0;\n\n// Auflösung je nach Gerät:\n// Handy hochkant: Spielfeld oben (11 Kacheln breit), Steuerung darunter, nichts verdeckt.\n// Handy quer: stärker gezoomt (9 Kacheln hoch), damit Figuren gross genug sind.\n// Computer: 180 px hoch wie gehabt.\nfunction resize() {\n  const portrait = isTouch && innerHeight > innerWidth;\n  document.body.classList.toggle('portrait', portrait);\n  document.body.classList.toggle('touchdev', isTouch);\n  let sc;\n  if (portrait) {\n    const ctrl = Math.round(Math.max(210, innerHeight * 0.3));\n    const cssH = innerHeight - ctrl;\n    VW = 160; VH = Math.max(150, Math.min(248, Math.round(VW * cssH / innerWidth)));\n    sc = Math.min(innerWidth / VW, cssH / VH);\n    document.documentElement.style.setProperty('--ch', Math.round(VH * sc) + 'px');\n  } else {\n    VH = isTouch ? 144 : 180;\n    VW = Math.max(240, Math.min(isTouch ? 360 : 400, Math.round(VH * innerWidth / innerHeight)));\n    sc = Math.min(innerWidth / VW, innerHeight / VH);\n  }\n  canvas.width = VW; canvas.height = VH; ctx.imageSmoothingEnabled = false;\n  canvas.style.width = VW * sc + 'px'; canvas.style.height = VH * sc + 'px';\n  R.resize(VW, VH);\n}\naddEventListener('resize', resize); resize();\n\ninitInput(touchEl, () => unlockAudio());\nconst applyControls = () => { setStickMode(!!D.stick); document.body.classList.toggle('stickmode', !!D.stick); };\napplyControls();\naddEventListener('pointerdown', () => unlockAudio(), { capture: true });\naddEventListener('keydown', e => { if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'play') pause(); else if (mode === 'pause') resume(); } });\ndocument.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pause(); });\npau
