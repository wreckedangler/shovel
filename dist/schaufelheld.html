: 2, pocket: 1, arc: 2 }, styles: { lauf: 5, abgrund: 1, hoehle: 1 } },\n  { id: 'hoehle', name: 'Tiefhöhle', foes: { b: 3, o: 3, q: 2 }, air: { v: 3 }, chunks: { flat: 3, gap: 3, step: 3, dirt: 5, bridge: 2, spikes: 1, pocket: 2, shroom: 1 }, styles: { hoehle: 5, lauf: 1, schacht: 1 } },\n  { id: 'dornen', name: 'Dornenhang', foes: { b: 2, f: 3, q: 3 }, air: { w: 2, v: 1 }, chunks: { flat: 2, gap: 3, step: 3, spikes: 6, bridge: 3, shroom: 3, pocket: 1 }, styles: { lauf: 4, abgrund: 2, schacht: 1 } },\n  { id: 'bau', name: 'Maulwurfsbau', foes: { o: 3, b: 3, q: 1 }, air: { v: 2 }, chunks: { flat: 3, gap: 2, step: 3, dirt: 7, vent: 2, pocket: 2, spikes: 1 }, styles: { hoehle: 4, lauf: 2 } },\n  { id: 'uhrturm', name: 'Zahnradwerk', foes: { k: 3, b: 2 }, air: { u: 3 }, chunks: { flat: 3, gap: 3, step: 2, mover: 4, vent: 3, cog: 2, bridge: 2, pocket: 1 }, styles: { lauf: 3, abgrund: 2, schacht: 2 } },\n  { id: 'glocke', name: 'Glockenhallen', foes: { k: 3, o: 2 }, air: { u: 2, v: 2 }, chunks: { flat: 3, gap: 3, step: 3, mover: 3, bridge: 3, spikes: 2, pocket: 1 }, styles: { lauf: 3, abgrund: 3, schacht: 1 } },\n  { id: 'pilz', name: 'Pilzdickicht', foes: { s: 2, o: 2, f: 3 }, air: { w: 2 }, chunks: { flat: 3, gap: 3, step: 2, crumble: 4, shroom: 5, bridge: 2, pocket: 1 }, styles: { lauf: 4, abgrund: 2, schacht: 1 } },\n  { id: 'grotte', name: 'Leuchtgrotte', foes: { q: 3, s: 2, f: 1 }, air: { w: 3, v: 2 }, chunks: { flat: 3, gap: 3, step: 3, crumble: 3, bridge: 3, spikes: 2, pocket: 2 }, styles: { hoehle: 3, abgrund: 2, lauf: 1 } },\n  { id: 'moder', name: 'Modersumpf', foes: { s: 3, o: 2, q: 2, f: 2 }, air: { w: 3 }, chunks: { flat: 2, gap: 3, step: 2, crumble: 4, spikes: 3, bridge: 2, shroom: 2, pocket: 1 }, styles: { lauf: 3, abgrund: 3 } },\n];\nconst ADJ = ['Flüsternde', 'Verlorene', 'Glühende', 'Vergessene', 'Gebrochene', 'Stille', 'Tiefe', 'Ewige', 'Rostige', 'Gezackte', 'Brüllende', 'Versunkene', 'Goldene', 'Schwarze', 'Kalte', 'Wilde'];\nconst NOUN = { lauf: ['Pfad', 'Weg', 'Grat', 'Steig', 'Hang'], hoehle: ['Stollen', 'Gänge', 'Tiefe', 'Kammern', 'Adern'], abgrund: ['Kluft', 'Schlucht', 'Brücken', 'Inseln', 'Leere'], schacht: ['Schacht', 'Turm', 'Aufstieg', 'Kamin', 'Spirale'] };\nconst masc = { Pfad: 0, Weg: 0, Grat: 0, Steig: 0, Hang: 0, Stollen: 0, Schacht: 0, Turm: 0, Aufstieg: 0, Kamin: 0 };\n\nfunction pickW(r, obj) { const e = Object.entries(obj); let t = r() * e.reduce((a, [, w]) => a + w, 0); for (const [k, w] of e) { t -= w; if (t <= 0) return k; } return e[0][0]; }\nconst ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));\n\n/* ---------- Gitter ---------- */\nclass Grid {\n  constructor(w, h) { this.w = w; this.h = h; this.c = Array.from({ length: h }, () => Array(w).fill('.')); }\n  get(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? '#' : this.c[y][x]; }\n  set(x, y, ch) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.c[y][x] = ch; }\n  ground(x, gy, ch = '#') { for (let y = gy; y < this.h; y++) this.set(x, y, ch); }\n  rows() { return this.c.map(r => r.join('')); }\n}\n\n// Schwierigkeit 0..1 aus der Tiefe (ab Tiefe 40 volle Härte)\nconst diffOf = depth => Math.min(1, depth / 40);\n\n/* ---------- Waagrechte Bauarten ---------- */\nfunction horizontal(r, bio, style, depth, chased = false) {\n  const d = diffOf(depth), H = 14, W = ri(r, 90, 110) + Math.round(d * 50);\n  const g = new Grid(W + 60, H);\n  const cave = style === 'hoehle', abyss = style === 'abgrund';\n  let x = 0, gy = 10, last = '', coins = 0, sinceCheck = 0; const TOP = cave ? 7 : 4;\n  const foeP = 0.22 + d * 0.35;\n  const groundFoe = () => pickW(r, bio.foes), airFoe = () => pickW(r, bio.air);\n  const putGround = (a, b, y = gy) => { for (let k = a; k < b; k++) g.ground(k, y); };\n  const gems = (a, b, y) => { for (let k = a; k < b; k++) if (g.get(k, y) === '.') g.set(k, y, 'G'); };\n  const arc = (x0, w, y0, hgt) => { for (let k = 0; k < w; k++) { const yy = y0 - Math.round(Math.sin((k + 0.5) / w * Math.PI) * hgt); if (g.get(x0 + k, yy) === '.') g.set(x0 + k, yy, 'G'); } };\n  const maybeFoe = (a, b) => { if (b - a >= 3 && r() < foeP) g.set(ri(r, a + 1, b - 2), gy - 1, groundFoe()); if (r() < foeP * 0.5 && Object.keys(bio.air).length) g.set(ri(r, a, b - 1), gy - ri(r, 3, 4), airFoe()); };\n  const coin = (cx, cy) => { if (coins < 3 && g.get(cx, cy) === '.') { g.set(cx, cy, 'O'); coins++; return true; } return false; };\n\n  // Start\n  putGround(0, 7); g.set(2, gy - 1, 'P'); x = 7;\n  const CH = {\n    flat() { const w = ri(r, 4, 8); putGround(x, x + w); maybeFoe(x, x + w); if (r() < 0.5) gems(x + 1, x + w - 1, gy - 3); if (r() < 0.12) g.set(x + w - 2, gy - 1, 'T'); else if (r() < 0.06) g.set(x + 1, gy - 1, 'h'); x += w; },\n    gap() {\n      const w = ri(r, 2, d > 0.4 ? 3 : 2); arc(x - 1, w + 2, gy - 2, 2);\n      if (Object.keys(bio.air).includes('w') && r() < 0.25 + d * 0.3) g.set(x + Math.floor(w / 2), gy - 3, 'w');\n      x += w; let ny = Math.max(TOP, Math.min(11, gy + ri(r, w > 2 ? 0 : -1, 1))); ny = Math.max(ny, gy - (w > 2 ? 0 : 1)); gy = ny; const lw = ri(r, 3, 5); putGround(x, x + lw); x += lw;\n    },\n    step() {\n      const up = (r() < 0.55 || gy >= 11) && gy > TOP, room = up ? Math.min(2, gy - TOP) : Math.min(3, 11 - gy);\n      if (room < 1) return CH.flat(); const k = ri(r, 1, room);\n      gy += up ? -k : k; const w = ri(r, 4, 7); putGround(x, x + w); maybeFoe(x, x + w); if (up) gems(x, x + 2, gy - 2); x += w;\n    },\n    spikes() {\n      const pre = 2, w = ri(r, 2, d > 0.5 ? 3 : 2); putGround(x, x + pre + w + 3);\n      for (let k = 0; k < w; k++) g.set(x + pre + k, gy, '^');\n      arc(x + pre - 1, w + 2, gy - 2, 2);\n      if (r() < 0.4 && gy > 8) { for (let k = 0; k < 3; k++) g.set(x + pre + k - 1 + Math.floor(w / 2), gy - 3, '='); }\n      x += pre + w + 3;\n    },\n    bridge() {\n      const w = ri(r, 6, 9 + Math.round(d * 3)); let px = x;\n      // Plattformen über einer Grube, Abstände ≤ 2, Höhenunterschied ≤ 2\n      let py = gy;\n      while (px < x + w - 2) { const pw = ri(r, 2, 3); const ny = Math.max(5, Math.min(gy + 1, py + ri(r, -2, 2))); py = ny; for (let k = 0; k < pw; k++) g.set(px + k, py, '='); if (r() < 0.5) g.set(px + 1, py - 2, 'G'); if (r() < 0.2 && bio.air.w) g.set(px + pw, py - 2, 'w'); px += pw + ri(r, 1, 2); }\n      x = px; const lw = ri(r, 3, 5); gy = Math.max(Math.max(TOP, py - 2), Math.min(11, py + 1)); putGround(x, x + lw); x += lw;\n    },\n    dirt() {\n      const w = ri(r, 6, 9); putGround(x, x + w);\n      const kind = r();\n      if (kind < 0.5) { const hh = ri(r, 3, 4); for (let yy = gy - hh; yy < gy; yy++) for (let k = 2; k < 4; k++) g.set(x + k, yy, 'D'); g.set(x + 5, gy - 1, r() < 0.3 ? 'T' : 'G'); }\n      else { for (let k = 1; k < w - 1; k++) for (let yy = gy - 2; yy < gy; yy++) g.set(x + k, yy, 'D'); g.set(x + Math.floor(w / 2), gy - 4, 'G'); g.set(x + Math.floor(w / 2) + 1, gy - 4, 'G'); }\n      x += w;\n    },\n    shroom() {\n      if (gy < 9 || cave) return CH.step();\n      putGround(x, x + 3); g.set(x + 1, gy, 'B'); const ny = gy - 3; x += 3; const lw = ri(r, 4, 6);\n      for (let k = x; k < x + lw; k++) g.ground(k, ny); gy = ny; gems(x, x + lw, gy - 2);\n      if (r() < 0.6) coin(x + lw - 1, gy - 1); else maybeFoe(x, x + lw); x += lw;\n    },\n    crumble() {\n      const w = ri(r, 3, 5); arc(x, w, gy - 2, 1); for (let k = 0; k < w; k++) g.set(x + k, gy, 'c'); x += w; const lw = ri(r, 3, 5); putGround(x, x + lw); x += lw;\n    },\n    mover() {\n      const w = 8; g.set(x + 2, gy, 'm'); g.set(x + 3, gy - 3, 'G'); g.set(x + 4, gy - 3, 'G');\n      x += w; const lw = ri(r, 3, 5); putGround(x, x + lw); x += lw;\n    },\n    vent() {\n      if (gy < 10 || cave) return CH.step();\n      putGround(x, x + 3); g.set(x + 1, gy, 'V'); x += 3; const ny = gy - 5, lw = ri(r, 4, 6);\n      for (let k = x; k < x + lw; k++) g.ground(k, ny); gy = ny; gems(x - 2, x, gy - 3); x += lw;\n    },\n    cog() { const w = 7; putGround(x, x + w); g.set(x + 3, gy - 3, 'z'); gems(x + 1, x + 2, gy - 1); x += w; },\n    pocket() {\n      // Falsche Wand im Boden, darunter eine abgedeckte Kammer mit Münze oder Truhe\n      if (gy > 9) return CH.flat();\n      const w = 7; putGround(x, x + w); g.set(x + 2, gy, 'F'); g.set(x + 3, gy, 'F');\n      for (let k = 1; k < 6; k++) g.set(x + k, gy + 1, '.');\n      if (!coin(x + 5, gy + 1)) g.set(x + 5, gy + 1, 'T'); g.set(x + 1, gy + 1, 'G');\n      x += w;\n    },\n    // Fallen (ab Tiefe 6)\n    icicles() { const w = 8; putGround(x, x + w); if (gy >= 6) { for (let k = 1; k < w - 1; k++) g.set(x + k, gy - 5, '#'); g.set(x + 2, gy - 4, 'L'); g.set(x + 5, gy - 4, 'L'); } x += w; },\n    saws() { const w = 9; putGround(x, x + w); g.set(x + 4, gy - 1, 'Z'); gems(x + 3, x + 6, gy - 3); x += w; },\n    arrows() { const w = 10; putGround(x, x + w); g.set(x + w - 1, gy - 1, 'A'); if (r() < 0.5) gems(x + 2, x + 6, gy - 2); x += w; },\n    flips() { const w = ri(r, 3, 5); for (let k = 0; k < w; k++) g.set(x + k, gy, 'K'); arc(x, w, gy - 2, 1); x += w; const lw = ri(r, 3, 5); putGround(x, x + lw); x += lw; },\n    troll() { const w = 2; g.set(x + 1, gy - 4, 'I'); arc(x - 1, w + 2, gy - 2, 2); x += w; const lw = ri(r, 3, 5); putGround(x, x + lw); x += lw; },\n    arc() { const w = 6; putGround(x, x + w); g.set(x + 2, gy - 2, 'H'); if (!coin(x + 2, gy - 4)) g.set(x + 2, gy - 4, 'G'); x += w; },\n  };\n  const pool = { ...bio.chunks };\n  if (abyss) { pool.gap = (pool.gap || 1) * 2; pool.bridge = (pool.bridge || 1) * 2.5; pool.flat = 1; pool.dirt = 0; }\n  if (cave) { pool.shroom = 0; pool.vent = 0; pool.dirt = (pool.dirt || 1) + 2; }\n  if (chased) { pool.mover = 0; pool.vent = 0; pool.pocket = 0; pool.dirt = 0; pool.cog = 0; }\n  const tw = Math.max(0, Math.min(3, (depth - 5) / 6));\n  if (tw > 0) {\n    const caveB = ['hoehle', 'grotte', 'bau'].includes(bio.id), mech = ['uhrturm', 'glocke', 'bau'].includes(bio.id);\n    pool.icicles = tw * (caveB || cave ? 1.5 : 0.5); pool.saws = tw * (mech ? 1.6 : 0.7); pool.arrows = tw * (bio.id === 'dornen' ? 1.8 : 0.8); pool.flips = tw * (mech || bio.id === 'wald' ? 1.2 : 0.6);\n    if (depth >= 25) pool.troll = 0.5;\n  }\n  while (x < W - 10) {\n    if (sinceCheck > 38 && last !== 'gap') { putGround(x, x + 4); g.set(x + 1, gy - 1, 'C'); x += 4; sinceCheck = 0; continue; }\n    let name = pickW(r, pool); if (name === last && r() < 0.7) name = pickW(r, pool);\n    const x0 = x, gy0 = gy; CH[name](); last = name; sinceCheck += x - x0; \n  }\n  // Fehlende Münzen: Geheimkammer oder versteckter Block nachrüsten\n  while (coins < 3) { coins < 2 && gy <= 9 ? CH.pocket() : CH.arc(); }\n  putGround(x, x + 12); g.set(x + 5, gy - 1, 'E'); for (let k = 0; k < 3; k++) g.set(x + 1 + k, gy - 3, 'G');\n  // Höhlendecke folgt dem Boden mit 5 Kacheln Luft\n  if (cave) {\n    const topOf = k => { for (let y = 0; y < H; y++) if ('#^cBVF=DSm'.includes(g.get(k, y)) && k >= 0 && k < g.w) return y; return 99; };\n    const tops = Array.from({ length: g.w }, (_, k) => topOf(k));\n    for (let k = 0; k < g.w; k++) {\n      let m = 99; for (let j = k - 2; j <= k + 2; j++) if (j >= 0 && j < g.w) m = Math.min(m, tops[j]);\n      const ceil = m === 99 ? 3 : Math.max(0, m - 5);\n      for (let y = 0; y < ceil; y++) g.set(k, y, '#');\n      if (ceil > 0 && r() < 0.04 && bio.air.v && g.get(k, ceil) === '.') g.set(k, ceil, 'v');\n    }\n  }\n  return g.rows().map(row => row.slice(0, x + 12));\n}\n\n/* ---------- Senkrechter Schacht ---------- */\nfunction shaft(r, bio, depth) {\n  const d = diffOf(depth), W = 20, H = ri(r, 42, 56) + Math.round(d * 16);\n  const g = new Grid(W, H);\n  for (let y = 0; y < H; y++) { g.set(0, y, '#'); g.set(W - 1, y, '#'); }\n  for (let x = 0; x < W; x++) { g.set(x, H - 1, '#'); g.set(x, H - 2, '#'); }\n  g.set(3, H - 3, 'P');\n  let y = H - 2, px = 2, coins = 0, sinceCheck = 0;\n  const coin = (cx, cy) => { if (coins < 3 && g.get(cx, cy) === '.') { g.set(cx, cy, 'O'); coins++; } };\n  let opw = 3;\n  while (y > 6) {\n    const pw = ri(r, 3, 5);\n    const big = r() < 0.12 && bio.chunks.shroom && y < H - 4;\n    const rise = big ? 4 : 2, ny = y - rise;\n    // neue Plattform höchstens 3 Kacheln seitlich vom Rand der alten\n    let nx = Math.max(1, Math.min(W - 1 - pw, px + ri(r, -pw - 2, opw + 2)));\n    if (big) { g.set(Math.max(1, Math.min(W - 2, px + 1)), y - 1, 'B'); nx = Math.max(1, Math.min(W - 1 - pw, px + ri(r, -2, 2))); }\n    // feste oder bröckelnde Plattformen nur, wenn sie nicht direkt über der alten liegen (sonst Kopfstoss)\n    const overlap = nx < px + opw && nx + pw > px;\n    const solid = '=';\n    for (let k = 0; k < pw; k++) g.set(nx + k, ny, solid);\n    if (r() < 0.25 + d * 0.3) { if (solid !== 'c' && pw >= 4 && r() < 0.5) g.set(nx + 1, ny - 1, pickW(r, bio.foes)); else if (Object.keys(bio.air).length) g.set(Math.max(2, Math.min(W - 3, nx + ri(r, -3, pw + 2))), ny - 2, pickW(r, bio.air)); }\n    if (r() < 0.45) g.set(nx + Math.floor(pw / 2), ny - 2, 'G');\n    sinceCheck += rise;\n    if (sinceCheck > 14 && solid !== 'c') { g.set(nx + pw - 1, ny - 1, 'C'); sinceCheck = 0; }\n    px = nx; y = ny; opw = pw;\n  }\n  // Gipfel: Ziel auf der letzten Plattform\n  g.set(px + 1, y - 1, 'E'); g.set(3, H - 3, 'P');\n  // Drei Münzen: je eine im unteren, mittleren und oberen Drittel, gern knapp über einer Plattform\n  for (let band = 0; band < 3; band++) {\n    const y0 = 6 + Math.floor((H - 10) * band / 3), y1 = 6 + Math.floor((H - 10) * (band + 1) / 3), cand = [];\n    for (let yy = y0; yy < y1; yy++) for (let x = 1; x < W - 1; x++) if ('=#c'.includes(g.get(x, yy)) && g.get(x, yy - 1) === '.') cand.push([x, yy - 1]);\n    if (!cand.length) continue;\n    const [cx, cy] = cand[Math.floor(r() * cand.length)];\n    if (g.get(cx, cy - 2) === '.' && g.get(cx, cy - 1) === '.' && r() < 0.6) coin(cx, cy - 2); else coin(cx, cy);\n  }\n  return g.rows();\n}\n\n/* ---------- Öffentliche Schnittstelle ---------- */\nexport function generateLevel(seed, depth = 1) {\n  // Sicherheitsnetz: falls die Prüfung je scheitert, wird mit einer Variante neu gewürfelt\n  let L;\n  for (let tryN = 0; tryN < 8; tryN++) { L = generateOnce(seed, depth, tryN); const r = reachable(L.map); if (r.ok && r.coins === 3) break; }\n  return L;\n}\nfunction generateOnce(seed, depth, tryN) {\n  const r = rng(hashSeed('sh' + seed + ':' + depth + (tryN ? '#' + tryN : '')));\n  const bio = BIOMES[Math.floor(r() * BIOMES.length)];\n  let style = pickW(r, bio.styles);\n  if (depth < 3 && style === 'schacht') style = 'lauf';\n  // Verfolgung wird vorab gewürfelt, damit das Level dazu passt (keine Warte-Bausteine)\n  let chase = null;\n  if (style === 'schacht' && depth >= 6 && r() < 0.35) chase = { kind: ['bau', 'moder', 'uhrturm'].includes(bio.id) ? 'lava' : 'flut', speed: Math.min(0.55, 0.3 + depth * 0.005), delay: 150 };\n  else if (style !== 'schacht' && depth >= 12 && r() < 0.2) chase = { kind: style === 'hoehle' ? 'decke' : 'wurm', speed: Math.min(1.55, 1.05 + depth * 0.008), delay: 120 };\n  const map = style === 'schacht' ? shaft(r, bio, depth) : horizontal(r, bio, style, depth, !!chase);\n  const noun = NOUN[style][Math.floor(r() * NOUN[style].length)];\n  let adj = ADJ[Math.floor(r() * ADJ.length)]; if (noun in masc) adj = adj.replace(/e$/, 'er');\n  const width = map[0].length, par = Math.round(style === 'schacht' ? 30 + map.length * 0.9 : 20 + width * 0.42);\n  const elite = depth >= 15 ? Math.min(0.35, (depth - 14) * 0.015) : 0;\n  return { id: `∞${depth}-${seed}`, name: `${adj} ${noun}`, theme: bio.id, biome: bio.name, style, par: chase ? Math.round(par * 0.8) : par, map, signs: [], gen: true, seed, depth, chase, elite };\n}\n// Seeds der endlosen Tiefen: aus dem Welt-Seed und der Tiefe\nexport const STYLE_NAME = { lauf: 'Pfad', hoehle: 'Höhle', abgrund: 'Abgrund', schacht: 'Schacht' };\n\n/* ---------- Erreichbarkeit (statisch, ohne Gegner) ----------\n   Prüft auf dem Kachelraster, ob Start → Ziel und alle Münzen erreichbar sind.\n   Konservativ: Sprung ≤ 3 Kacheln weit und ≤ 2 hoch, Pilz 3 hoch, Dampf 5 hoch. */\nconst SOLIDS = new Set(['#', 'D', 'S', 'B', '^', 'V', 'R', 'F', 'c', 'J', 'A', 'K', 'I']);\nexport function reachable(map) {\n  const H = map.length, W = map[0].length;\n  const at = (x, y) => (x < 0 || x >= W ? '#' : y < 0 ? '.' : y >= H ? '.' : map[y][x]);\n  // Erde und falsche Wände gelten als durchlässig (graben/zerschlagen), H als Luft\n  const blocks = (x, y) => { const c = at(x, y); return SOLIDS.has(c) && c !== 'D' && c !== 'F'; };\n  const floor = (x, y) => { const c = at(x, y + 1); return (SOLIDS.has(c) && c !== 'I') || c === '=' || c === 'm'; };\n  const standable = (x, y) => y >= 0 && y < H && !blocks(x, y) && at(x, y) !== '^' && floor(x, y) && at(x, y + 1) !== '^';\n  let start, goal; const coins = [];\n  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const c = map[y][x]; if (c === 'P') start = [x, y]; if (c === 'E') goal = [x, y]; if (c === 'O') coins.push([x, y]); }\n  if (!start || !goal) return { ok: false, why: 'Start/Ziel fehlt' };\n  // Fallen bis zum nächsten Stand\n  const fall = (x, y) => { for (let yy = y; yy < H; yy++) { if (blocks(x, yy)) return null; if (at(x, yy) === '^') return null; if (standable(x, yy)) return [x, yy]; } return null; };\n  const clearCol = (x, y0, y1) => { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) if (blocks(x, y)) return false; return true; };\n  const seen = new Set(), st = [], key = (x, y) => x + ',' + y;\n  const s0 = fall(start[0], start[1]) || start; st.push(s0); seen.add(key(...s0));\n  const visitedAir = new Set();\n  const push = p => { if (p && !seen.has(key(...p))) { seen.add(key(...p)); st.push(p); } };\n  while (st.length) {\n    const [x, y] = st.pop();\n    visitedAir.add(key(x, y)); for (let k = 1; k <= 3; k++) visitedAir.add(key(x, y - k));\n    const under = at(x, y + 1);\n    let lift = 2; if (under === 'B') lift = 3; if (under === 'V') lift = 5;\n    for (let dx = -4; dx <= 4; dx++) for (let dy = -lift; dy <= 6; dy++) {\n      const nx = x + dx, ny = y + dy;\n      if (Math.abs(dx) === 4 && dy < 0) continue;\n      if (!standable(nx, ny)) continue;\n      // Flugbahn: entweder in der Startspalte hoch und dann hinüber, oder früh hinüber und in der Zielspalte hoch\n      const peak = Math.min(y, ny) - (dy <= 0 ? 1 : 0), step = Math.sign(dx);\n      const rowClear = (yy, a, b) => { for (let cx = a; cx !== b + step; cx += step) if (blocks(cx, yy)) return false; return true; };\n      let ok;\n      if (dx === 0) ok = clearCol(x, y, ny) && clearCol(x, y, peak);\n      else if (dy >= 0 && Math.abs(dx) === 1) ok = !blocks(nx, y) && clearCol(nx, y, ny);\n      else ok = (clearCol(x, y, peak) && rowClear(peak, x + step, nx) && clearCol(nx, peak, ny))\n        || (clearCol(x, y, y - 1) && rowClear(Math.min(y, ny) - 1 < peak ? y - 1 : y - 1, x + step, nx) && clearCol(nx, peak, y - 1) && clearCol(nx, peak, ny))\n        || (dy > 0 && rowClear(y, x + step, x + step) && clearCol(x + step, y, ny) && rowClear(ny, x + step, nx));\n      if (ok) {\n        push([nx, ny]); for (let k = 0; k <= 3; k++) visitedAir.add(key(nx, ny - k));\n        // Flugbahn markieren: Münzen in der Luft über Lücken sind erreichbar\n        for (let cx = x; cx !== nx + (step || 1); cx += step || 1) for (let yy = Math.min(y, ny) - 2; yy <= Math.max(y, ny); yy++) if (!blocks(cx, yy)) visitedAir.add(key(cx, yy));\n      }\n    }\n    // Schwebeplattform: trägt bis zu 3 Kacheln seitlich\n    if (under === 'm') for (let dx = -6; dx <= 6; dx++) push(fall(x + dx, y));\n  }\n  if (globalThis.__DBG) globalThis.__SEEN = [...seen];\n  const reach = p => seen.has(key(...p)) || visitedAir.has(key(...p));\n  const ok = reach(goal), coinsOk = coins.filter(reach).length;\n  return { ok, coins: coinsOk, coinTotal: coins.length, why: ok ? '' : 'Ziel unerreichbar' };\n}\n","ghost.js":"// Geister: Aufzeichnung eines Laufs (x, y, Pose alle 2 Frames) als teilbarer Code.\n// Format: \"SH1.\" + base64url(JSON-Kopf) + \".\" + base64url(Bytes) — Bytes optional deflate-komprimiert.\n// Bytes pro Sample: dx, dy (Int8) und Flags. Grosse Sprünge (Respawn) via Escape 127 + 2×Int16.\n\nconst b64 = {\n  enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, ''); },\n  dec(str) { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },\n};\nconst txt = { enc: s => new TextEncoder().encode(s), dec: b => new TextDecoder().decode(b) };\n\nasync function pipe(bytes, Stream, fmt) {\n  const out = new Response(new Blob([bytes]).stream().pipeThrough(new Stream(fmt)));\n  return new Uint8Array(await out.arrayBuffer());\n}\nconst canZip = () => typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';\n\nexport async function encodeGhost({ level, name, frames, gear, rec }) {\n  const out = [];\n  let px = 0, py = 0;\n  for (const [x, y, f] of rec) {\n    const dx = x - px, dy = y - py;\n    if (dx > -127 && dx < 127 && dy > -127 && dy < 127) out.push(dx & 255, dy & 255, f & 255);\n    else out.push(127, x & 255, (x >> 8) & 255, y & 255, (y >> 8) & 255, f & 255);\n    px = x; py = y;\n  }\n  let bytes = new Uint8Array(out), z = 0;\n  if (canZip()) { try { bytes = await pipe(bytes, CompressionStream, 'deflate-raw'); z = 1; } catch { z = 0; bytes = new Uint8Array(out); } }\n  const head = { v: 1, l: level, n: String(name || 'Anonym').slice(0, 16), t: frames, s: gear.shovel, a: gear.armor, z, c: rec.length };\n  return 'SH1.' + b64.enc(txt.enc(JSON.stringify(head))) + '.' + b64.enc(bytes);\n}\n\nexport async function decodeGhost(code) {\n  try {\n    const [tag, h, d] = String(code).trim().split('.');\n    if (tag !== 'SH1') return null;\n    const head = JSON.parse(txt.dec(b64.dec(h)));\n    let bytes = b64.dec(d);\n    if (head.z) bytes = await pipe(bytes, DecompressionStream, 'deflate-raw');\n    const rec = [];\n    let x = 0, y = 0, i = 0;\n    const s8 = v => (v > 127 ? v - 256 : v);\n    while (i < bytes.length && rec.length < head.c) {\n      if (bytes[i] === 127) {\n        x = s16(bytes[i + 1] | bytes[i + 2] << 8); y = s16(bytes[i + 3] | bytes[i + 4] << 8);\n        rec.push([x, y, bytes[i + 5]]); i += 6;\n      } else { x += s8(bytes[i]); y += s8(bytes[i + 1]); rec.push([x, y, bytes[i + 2]]); i += 3; }\n    }\n    return { level: head.l, name: head.n, frames: head.t, gear: { shovel: head.s, armor: head.a }, rec };\n  } catch { return null; }\n}\nconst s16 = v => (v > 32767 ? v - 65536 : v);\n\n// Position des Geists zu einem Frame (mit Interpolation)\nexport function ghostAt(g, frame) {\n  const r = g.rec; if (!r.length) return null;\n  const k = frame / 2 - 1, i = Math.floor(k);\n  if (i >= r.length - 1) return { x: r[r.length - 1][0], y: r[r.length - 1][1], f: r[r.length - 1][2], finished: true };\n  if (i < 0) return { x: r[0][0], y: r[0][1], f: r[0][2] };\n  const a = r[i], b = r[i + 1], t = k - i;\n  if (Math.abs(b[0] - a[0]) > 40 || Math.abs(b[1] - a[1]) > 40) return { x: a[0], y: a[1], f: a[2] };\n  return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, f: t < 0.5 ? a[2] : b[2] };\n}\n\nexport const fmtTime = frames => {\n  const s = frames / 60, m = Math.floor(s / 60);\n  return `${m}:${(s - m * 60).toFixed(2).padStart(5, '0')}`;\n};\n","heroart.js":"// Pixel-Art für Held, Rüstungen, Schaufeln und Spezialwaffen.\n// Held: 20×24-Rahmen, Körper beginnt bei x=4, y=8 (Kollisionsbox 10×14 liegt bei x=5, y=10).\n// Rüstung = Umhang (hinten) + Beine + Torso + Helm, jeweils als Segmente [y, x, 'pixel'].\n// Buchstaben werden über die Palette der Stufe eingefärbt, '.' bleibt durchsichtig.\n// fx: Effekte, die der Renderer zusätzlich zeichnet.\n\nexport const K = '#140c1c';\n\nconst TORSO = [[14, 7, 'kkaaakk'], [15, 6, 'kAAAAAAk'], [16, 5, 'kAAaAAaAAk'], [17, 5, 'kaAAAAAAak'], [18, 5, 'kkaaxxaakk'], ms + coinGems;\n  D.gems += earned; D.earned += earned; D.cleared[id] = true;\n  const li = LEVELS.findIndex(l => l.id === id);\n  if (!level.secret && !level.qual) D.unlocked = Math.max(D.unlocked, li + 2);\n  // Geheimausgang\n  let secretMsg = '';\n  if (viaSecret && level.secretExit && !D.secretOpen[level.secretExit]) { D.secretOpen[level.secretExit] = true; secretMsg = `Geheimlevel entdeckt: ${levelById(level.secretExit).name}`; }\n  const gruft = LEVELS.find(l => l.coinsNeeded);\n  if (gruft && !D.secretOpen[gruft.id] && totalCoins(D) >= gruft.coinsNeeded) { D.secretOpen[gruft.id] = true; secretMsg = (secretMsg ? secretMsg + ' · ' : '') + 'Die Schaufelgruft hat sich geöffnet!'; }\n  // Rang\n  const info = LEVEL_INFO[id];\n  const rank = rankFor(level, { frames, deaths: game.deaths, coinsGot: D.coins[id].length, coinsTotal: info.coins, secretsGot: D.secrets[id], secretsTotal: info.secrets });\n  const oldRank = D.ranks[id], newRank = !oldRank || RANK_ORDER[rank] > RANK_ORDER[oldRank];\n  if (newRank && !cheated) D.ranks[id] = rank;\n  const old = D.best[id], record = !cheated && (!old || frames < old);\n  const code = await encodeGhost({ level: id, name: D.name || 'Ich', frames, gear: { shovel: D.shovel, armor: D.armor }, rec: game.rec });\n  if (record) { D.best[id] = frames; D.ghosts[id] = code; }\n  // Waffen-Bedingungen am Levelende\n  if (id === '1-1' && game.kills === 0) unlockWeapon('federklinge');\n  if (id === '1-1' && frames < 25 * 60) unlockWeapon('blitzspaten');\n  if (id === '1-2' && game.dirtTotal > 0 && game.dirtLeft() === 0) unlockWeapon('erdfresser');\n  if (ghosts.some(g => !g.own && g.frames - frames >= 120)) unlockWeapon('geisterklinge');\n  // Schlüssel für die Schatzkammer (jeder Anlass zählt nur einmal pro Level)\n  let keyHtml = '';\n  const award = (tag, kind, why) => { const k = id + ':' + tag; if (cheated || D.keyLog[k]) return; D.keyLog[k] = true; keyHtml += grantKey(kind, 1, why); };\n  if (first) award('clear', level.boss || level setTimeout(() => sfx('star'), 350 + i * 350));\n  setTimeout(() => sfx(rank === 'S' ? 'legend' : 'star'), 1300);\n  setTimeout(showReveals, 1900);\n}\n\n/* ---------- Erfolge & Einblendungen ---------- */\nfunction toast(title, text, kind = '') {\n  let box = $('#toasts');\n  if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }\n  const el = document.createElement('div'); el.className = 'toast ' + kind;\n  el.innerHTML = `<b>${ic(kind === 'ach' ? 'trophy' : 'scroll')} ${esc(title)}</b><span>${text}</span>`;\n  box.appendChild(el);\n  setTimeout(() => el.classList.add('out'), 2800); setTimeout(() => el.remove(), 3300);\n}\nfunction checkAch() {\n  if (playCheats(D).length && (mode === 'play' || mode === 'won')) return;\n  for (const a of ACH) {\n    if (D.ach[a.id] || !a.test(D)) continue;\n    D.ach[a.id] = true; D.gems += a.gems; D.earned += a.gems;\n    toast('Erfolg: ' + a.name, `${esc(a.desc)} +${a.gems} ${ic('gem')}`, 'ach'); sfx('achieve'); haptic('unlock');\n    const c = CHEATS.find(x => x.ach === a.id); if (c) setTimeout(() => learnCheat(c), 900);\n  }\n  save.write();\n}\nfunction achs() {\n  mode = 'menu';\n  const n = Object.keys(D.ach).length;\n  show(`<div class=\"panel\">\n    <div class=\"top\"><button class=\"back\" data-a=\"map\">‹</button><h2>Erfolge</h2><span class=\"gems\">${n} / ${ACH.length}</span></div>\n    <div class=\"bar\"><i style=\"width:${n / ACH.length * 100}%\"></i></div>\n    <div class=\"achgrid\">${ACH.map(a => `<div class=\"achc ${D.ach[a.id] ? 'on' : ''}\"><b>${ic(D.ach[a.id] ? 'trophy' : 'lock')} ${esc(a.name)}</b><small>${esc(a.desc)}</small><em>+${a.gems} ${ic('gem')}</em></div>`).join('')}</div>\n  </div>`);\n}\nfunction wardrobe(msg = '') {\n  mode = 'menu';\n  show(`<div class=\"panel\">\n    <div class=\"top\"><button class=\"back\" data-a=\"map\">‹</button><h2>Garderobe</h2><span class=\"gems\">Schal</span></div>\n    <div class=\"wardrobe\">${SCARVES.map(sc => { const ok     <h2>${esc(tier.name)}</h2><p class=\"perk\">${esc((kind === 'shovel' ? SHOVEL : ARMOR)[t].perk)}</p>\n    <div class=\"row\"><button class=\"big\" data-r=\"close\">Stark!</button></div></div>`;\n  document.body.appendChild(el);\n  const cv = el.querySelector('canvas'), id = ++forgeAnim;\n  const tick = () => {\n    if (!cv.isConnected) return;\n    stage(cv, 50, 28, () => {\n      R.figure(S.hero(D.armor, D.shovel, D.weapon), 14, 12, 1, 1, menuT, 8, null, 0, 16, 2, 0);\n      R.figure(S.hero(D.armor, D.shovel, D.weapon), 34, 12, 1, 3, 0, 6);\n    });\n    requestAnimationFrame(tick);\n  };\n  tick();\n  el.addEventListener('click', e => { if (e.target.closest('[data-r]')) { el.remove(); forge(); } });\n}\n\nfunction options(msg = '') {\n  mode = 'menu';\n  show(`<div class=\"panel small\">\n    <div class=\"top\"><button class=\"back\" data-a=\"map\">‹</button><h2>Optionen</h2><span></span></div>\n    <label class=\"field\">Dein Name (für Geister)<input id=\"name\" maxlength=\"16\" value=\"${esc(D.name)}\" placeholder=\"z. B. Raphi\"></label>\n    ${toggles()}\n    <label class=\"field\">Geist-Code importieren<textarea id=\"code\" rows=\"3\" placeholder=\"SH1.…\"></textarea></label>\n    <button data-a=\"import\">Importieren</button>\n    <p class=\"note\">${online() ? 'Online-Geister: aktiv.' : 'Online-Geister: aus (siehe README).'} Version 0.13</p>\n    ${msg ? `<p class=\"msg\">${msg}</p>` : ''}\n    <button class=\"danger\" data-a=\"reset\">Spielstand löschen</button>\n  </div>`);\n  $('#name').addEventListener('change', e => { D.name = e.target.value.trim().slice(0, 16); save.write(); });\n}\nconst toggles = () => `<div class=\"row toggles\">\n  <button data-a=\"sfx\" class=\"${D.sfx ? 'on' : ''}\">Effekte ${D.sfx ? 'an' : 'aus'}</button>\n  <button data-a=\"music\" class=\"${D.music ? 'on' : ''}\">Musik ${D.music ? 'an' : 'aus'}</button>\n  ${isTouch ? `<button data-a=\"stick\" class=\"${D.stick ? 'on' : ''}\">Links: ${D.stick ? 'Daumen-Stick' : 'Pfeiltast eatbook();\n    case 'cheatenter': {\n      const v = $('#cheatcode').value, c = cheatByCode(v);\n      if (!v.trim()) return;\n      if (/^(GAMEBOY|RETRO)$/i.test(v.trim())) { toggleRetro(); return cheatbook('Die Farben verblassen … oder kehren zurück.'); }\n      if (!c) { sfx('nope'); return cheatbook('Nichts geschieht. Das Wort hat keine Macht.'); }\n      D.cheatsKnown[c.id] = true; D.cheatsOn[c.id] = true; save.write(); sfx('legend');\n      return cheatbook(`${esc(c.name)} erwacht.`);\n    }\n    case 'cheattoggle': D.cheatsOn[id] = !D.cheatsOn[id]; save.write(); sfx(D.cheatsOn[id] ? 'secret' : 'click'); return cheatbook();\n    case 'logo': { const now = Date.now(); logoTaps = logoTaps.filter(t => now - t < 3000); logoTaps.push(now); if (logoTaps.length >= 7) { logoTaps = []; toggleRetro(); } return; }\n    case 'equip': D.weapon = id || null; save.write(); sfx('buy'); return armory(id ? `${esc(weaponById(id).name)} ausgerüstet.` : 'Normale Schaufel ausgerüstet.');\n    case 'options': return options();\n    case 'pick': return map(id);\n    case 'world': return map(null, +b.dataset.w);\n    case 'nope': return sfx('nope');\n    case 'play': return startLevel(id, D.ghostOn && D.ghosts[id] ? [D.ghosts[id]] : []);\n    case 'go': {\n      const opts = $('#detail')._opts || [];\n      const codes = [...document.querySelectorAll('[data-g]')].filter(c => c.checked).map(c => opts[+c.dataset.g].code);\n      if (D.ghosts[id]) { D.ghostOn = codes.includes(D.ghosts[id]); save.write(); }\n      return startLevel(id, codes);\n    }\n    case 'resume': return resume();\n    case 'restart': return startLevel(level.id, curCodes);\n    case 'buy': {\n      const k = b.dataset.k, nx = D[k] + 1, price = PRICE[nx];\n      const sp = SHARD_PRICE[nx] || 0;\n      if (nx >= AVAILABLE || D.gems < price) { sfx('nope'); return forge(`Dir fehlen noch ${price - D.gems} Edelsteine.`); }\n      if (D.shards < sp) { sfx('nope'); return forge(`Dir fehlen noch ${sp - D.shards} Splitter. Die gibt es in der Schatzkammer.`); }\n      D.gems -= price; D.shards -= sp; D[k] = nx; save.write(); sfx('legend');\n      forge(); return gearReveal(k, nx);\n    }\n    case 'stick': D.stick = !D.stick; save.write(); applyControls(); b.outerHTML = toggles().match(/<button data-a=\"stick\".*?<\\/button>/s)[0]; return;\n    case 'vibrate': D.vibrate = !D.vibrate; save.write(); haptic('hit'); b.outerHTML = toggles().match(/<button data-a=\"vibrate\".*?<\\/button>/s)[0]; return;\n    case 'fullscreen': D.fullscreen = !D.fullscreen; save.write(); if (!D.fullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {}); b.outerHTML = toggles().match(/<button data-a=\"fullscreen\".*?<\\/button>/s)[0]; return;\n    case 'sfx': D.sfx = !D.sfx; save.write(); setAudio(D.sfx, D.music); b.outerHTML = toggles().match(/<button data-a=\"sfx\".*?<\\/button>/)[0]; return;\n    case 'music': D.music = !D.music; save.write(); setAudio(D.sfx, D.music); b.outerHTML = toggles().match(/<button data-a=\"music\".*?<\\/button>/)[0]; return;\n    case 'import': {\n      const g = await decodeGhost($('#code').value);\n      if (!g || !levelById(g.level)) return options('Das ist kein gültiger Geist-Code.');\n      (D.imported[g.level] = D.imported[g.level] || []).unshift({ code: $('#code').value.trim(), name: g.name, frames: g.frames });\n      D.imported[g.level] = D.imported[g.level].slice(0, 5); save.write();\n      return options(`Geist von ${esc(g.name)} für ${esc(g.level)} (${fmtTime(g.frames)}) importiert.`);\n    }\n    case 'share': {\n      const code = b.dataset.code;\n      try { await navigator.clipboard.writeText(code); b.textContent = 'Code kopiert! Schick ihn einem Freund.'; }\n      catch { b.outerHTML = `<textarea class=\"codebox\" readonly rows=\"3\">${esc(code)}</textarea><p class=\"note\">Code markieren und kopieren.</p>`; }\n      return;\n    }\n    case 'reset':\n      if (Date.now() - resetArm < 3000) { save.reset(); return title(); }\n      resetArm = Date.now(); b.textContent = 'Wirklich? Nochmals tippen.'; return;\n  }\n});\n\n// Vollbild auf Android (iOS kennt das nur als installierte Web-App)\nfunction goFullscreen() {\n  if (!isTouch || !D.fullscreen || document.fullscreenElement) return;\n  try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen({ navigationUI: 'hide' }); if (r) r.catch(() => {}); } catch {}\n}\n\n\nif ('serviceWorker' in navigator && location.protocol === 'https:' && !window.__SH_BUNDLE) navigator.serviceWorker.register('sw.js').catch(() => {});\n\nif (location.search.includes('debug')) window.__sh = { get game() { return game; } };\n\ninitTreasury({ D, save, sfx, haptic, show, ic, serifImg, S, R, esc, back: () => lastMenu, checkAch });\nui.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { unlockAudio(); treasuryClick(b) || collectionClick(b); } });\nif (/[?&]debug/.test(location.search)) window.__sh = { get game() { return game; }, startLevel: id => startLevel(id) };\nsplash();\nrefreshLogo(() => { if (mode === 'menu' && document.querySelector('.title')) title(); else if (document.querySelector('.splash')) splash(); });\nrequestAnimationFrame(loop);\n","online.js":"// Optionale Online-Geister über Supabase (gratis). Ohne Konfiguration läuft alles lokal.\n// Einrichtung: siehe README.md, Abschnitt \"Online-Geister\".\nimport { CONFIG } from './config.js';\n\nexport const online = () => !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);\nconst headers = () => ({ apikey: CONFIG.supabaseKey, Authorization: `Bearer ${CONFIG.supabaseKey}`, 'Content-Type': 'application/json' });\n\nexport async function uploadGhost({ level, name, frames, code }) {\n  if (!online()) return false;\n  try {\n    const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/ghosts`, {\n      method: 'POST', headers: { ...headers(), Prefer: 'return=minimal' },\n      body: JSON.stringify({ level, name, frames, code, version: CONFIG.version }),\n    });\n    return r.ok;\n  } catch { return false; }\n}\n\nexport async function topGhosts(level, limit = 10) {\n  if (!online()) return [];\n  try {\n    const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/ghosts?level=eq.${encodeURIComponent(level)}&select=name,frames,code&order=frames.asc&limit=${limit}`, { headers: headers() });\n    return r.ok ? await r.json() : [];\n  } catch { return []; }\n}\n","progress.js":"// Fortschritt: Erfolge, Ränge, Gesamtfortschritt, Schal-Stile, Tagesschatz.\nimport { LEVELS } from './levels.js';\nimport { WEAPONS } from './weapons.js';\nimport { countFakeGroups } from './game.js';\n\n// Zählwerte einmal aus den Karten berechnen\nexport const LEVEL_INFO = Object.fromEntries(LEVELS.map(l => {\n  const all = l.map.join('');\n  const coins = (all.match(/O/g) || []).length;\n  const secrets = (all.match(/H/g) || []).length + countFakeGroups(l.map.map(r => r.split('')));\n  return [l.id, { coins, secrets }];\n}));\nexport const TOTAL_COINS = Object.values(LEVEL_INFO).reduce((n, i) => n + i.coins, 0);\n\nexport const coinsOf = (D, id) => (D.coins[id] || []).length;\nexport const totalCoins = D => Object.values(D.coins).reduce((n, c) => n + c.length, 0);\nexport const totalSecrets = D => Object.values(D.secrets).reduce((n, c) => n + c, 0);\nexport const TOTAL_SECRETS = Object.values(LEVEL_INFO).reduce((n, i) => n + i.secrets, 0);\n\nexport function rankFor(level, r) {\n  // r: { frames, deaths, coinsGot, coinsTotal, secretsGot, secretsTotal }\n  let p = r.frames <= level.par * 60 ? 3 : r.frames <= level.par * 90 ? 2 : 1;\n  p += r.deaths === 0 ? 2 : r.deaths <= 2 ? 1 : 0;\n  p += !r.coinsTotal || r.coinsGot === r.coinsTotal ? 2 : r.coinsGot > 0 ? 1 : 0;\n  p += !r.secretsTotal || r.secretsGot === r.secretsTotal ? 1 : 0;\n  return p >= 7 ? 'S' : p >= 5 ? 'A' : p >= 3 ? 'B' : 'C';\n}\nexport const RANK_ORDER = { S: 4, A: 3, B: 2, C: 1 };\n\nexport function completion(D) {\n  const normal = LEVELS.filter(l => !l.secret), secret = LEVELS.filt th.max(C.D.armor, 2), Math.max(C.D.shovel, 2), null), 6, 3, 1, 0, 0, 8);\n    x.filter = 'none'; }\n    C.R.x = old; C.R.t = oldT;\n  }\n  if (sil) { x.globalCompositeOperation = 'source-in'; x.fillStyle = '#3a3020'; x.fillRect(0, 0, 20, 20); }\n  const c = document.createElement('canvas'); c.width = 20 * scale; c.height = 20 * scale;\n  const o = c.getContext('2d'); o.imageSmoothingEnabled = false; o.drawImage(t, 0, 0, c.width, c.height);\n  iconCache.set(key, c); return c;\n}\nconst canvasImg = (cv, cls = '') => `<img class=\"pxim ${cls}\" src=\"${cv.toDataURL()}\" width=\"${cv.width}\" height=\"${cv.height}\" alt=\"\">`;\n\n/* ---------- Schatzkammer ---------- */\nexport function treasury(msg = '') {\n  const { D, ic, esc } = C;\n  const card = ch => {\n    const keys = D.keys[ch.id] || 0, can1 = keys > 0 || (!ch.keyOnly && D.gems >= ch.price), price10 = ch.price * 9;\n    return `<div class=\"chestcard rar-${ch.id}\" style=\"--cc:${ch.col}\">\n      <div class=\"chimg\">${canvasImg(chestCanvas(ch, 3))}</div>\n      <div class=\"chinfo\"><b>${C.serifImg(ch.name, 11, ch.id === 'urlicht' ? 'pale' : 'gold', 2)}</b>\n        <div class=\"odds\">${ch.odds.map((o, k) => o ? `<span style=\"color:${RAR[k].col}\">${RAR[k].name} ${o}%</span>` : '').join('')}</div>\n        ${ch.up ? `<small class=\"upn\">${Math.round(ch.up * 100)}% Chance auf Aufwertung beim Öffnen</small>` : '<small class=\"upn\">Nur mit Schlüssel. Bosse und Rekorde bringen ihn.</small>'}\n        <div class=\"chbtns\">\n          ${keys ? `<button class=\"big\" data-t=\"open\" data-c=\"${ch.id}\" data-key=\"1\">${ic('lock')} Schlüssel · ${keys}</button>` : ''}\n          ${!ch.keyOnly ? `<button class=\"${!keys && D.gems >= ch.price ? 'big' : D.gems >= ch.price ? '' : 'off'}\" data-t=\"open\" data-c=\"${ch.id}\">${ic('gem')} ${ch.price}</button>` : ''}\n          ${ch.multi ? `<button class=\"${D.gems >= price10 ? '' : 'off'}\" data-t=\"open10\" data-c=\"${ch.id}\">10× ${ic('gem')} ${price10}</button>` : ''}\n          ${!can1 && ch.keyOnly ? '<span class=\"lockt\">Kein Schlüssel</span>' : ''}\n        </div></div></div>`;\n  };\n  C.show(`<div class=\"panel\">\n    <div class=\"top\"><button class=\"back\" data-a=\"${C.back()}\">‹</button><h2>Schatzkammer</h2><span class=\"gems\">${ic('gem')} ${D.gems} · ${ic('dia')} ${D.shards}</span></div>\n    <div class=\"pity\"><span>Legendär garantiert in <b>${PITY - D.loot.pity}</b> Öffnungen</span><div class=\"bar\"><i style=\"width:${D.loot.pity / PITY * 100}%\"></i></div></div>\n    <div class=\"chests\">${CHESTS.map(card).join('')}</div>\n    ${msg ? `<p class=\"msg\">${msg}</p>` : ''}\n    <p class=\"note\">Doppelte Gegenstände und volle Relikte werden zu Splittern ${ic('dia')}. Mit Splittern schmiedest du die Stufen 7 bis 12. Fehlende Gegenstände fallen doppelt so oft wie Duplikate. 10 Truhen kosten so viel wie 9.</p>\n    <div class=\"row\"><button data-a=\"collection\">${ic('rune')} Sammlung</button></div>\n  </div>`);\n}\n\n/* ---------- Öffnen ---------- */\nlet busy = false;\nexport function treasuryClick(b) {\n  if (busy) return true;\n  const t = b.dataset.t; if (t !== 'open' && t !== 'open10') return false;\n  const { D } = C, ch = CHESTS.find(c => c.id === b.dataset.c);\n  if (t === 'open') {\n    if (b.dataset.key && D.keys[ch.id] > 0) D.keys[ch.id]--;\n    else if (!ch.keyOnly && D.gems >= ch.price) D.gems -= ch.price;\n    else { C.sfx('nope'); return true; }\n    const r = openChest(D, ch.id); C.save.write(); revealOne(r, ch.id);\n  } else if (t === 'open10') {\n    if (D.gems < ch.price * 9) { C.sfx('nope'); return true; }\n    D.gems -= ch.price * 9;\n    const rs = Array.from({ length: 10 }, () => openChest(D, ch.id)); C.save.write(); revealMany(rs, ch.id);\n  }\n  return true;\n}\n\nfunction statusLine(r) {\n  const it = itemById(r.item);\n  if (r.isNew) return `<span class=\"new\">NEU</span>`;\n  if (r.levelUp) return `<span class=\"lvl\">Stufe ${r.levelUp}</span> · ${C.esc(it.desc(r.levelUp))}`;\n  return `Doppelt · <span class=\"shd\">+${r.shards} Splitter</span>`;\n}\nfunction itemDesc(it, r) {\n  if (it.kind === 'relikt') return C.esc(it.desc(C.D.relics[it.id] || 1));\n  return { spur: 'Spur hinter dem Helden', farbe: 'Färbung des Helden', aura: 'Leuchtende Aura' }[it.kind];\n}\n\n// Einzelöffnung mit voller Inszenierung\nfunction revealOne(r, fromId) {\n  busy = true;\n  const { sfx, haptic } = C, rar = RAR[r.rar], it = itemById(r.item);\n  let ch = CHESTS.find(c => c.id === fromId);\n  const el = document.createElement('div'); el.className = 'reveal loot';\n  el.innerHTML = `<canvas width=\"120\" height=\"96\"></canvas><div class=\"rcard lootcard\" hidden></div><div class=\"skip\">Tippen zum Überspringen</div>`;\n  document.body.appendChild(el);\n  const cv = el.querySelector('canvas'), x = cv.getContext('2d'), card = el.querySelector('.lootcard');\n  const fit = () => { const s = Math.max(2, Math.floor(Math.min(innerWidth * 0.95 / 120, innerHeight * 0.5 / 96))); cv.style.width = 120 * s + 'px'; cv.style.height = 96 * s + 'px'; };\n  fit();\n  // Ablauf (Frames): Fall 0–24 · Aufwertung 40–80 · Klopfer · Aufbruch · Gegenstand\n  const knocks = r.rar === 3 ? 4 : 3, up = r.upgraded ? 50 : 0, kStart = 40 + up, kGap = 30;\n  const burstAt = kStart + knocks * kGap + (r.rar === 3 ? 34 : 10);\n  let f = 0, parts = [], shown = false, done = false, step = 0;\n  const lightAt = k => RAR[Math.min(k, r.rar)].col;\n  const finish = () => {\n    if (shown) return; shown = true; f = Math.max(f, burstAt + 1);\n    card.hidden = false;\n    card.style.setProperty('--rc', rar.col); card.style.setProperty('--rg', rar.glow);\n    card.innerHTML = `<p class=\"rar\">${r.pity ? 'Garantie eingelöst · ' : ''}${rar.name}${it.kind === 'relikt' ? 'es Relikt' : ''}</p>\n      <div class=\"lic\">${canvasImg(itemIcon(it.id, 4))}</div>\n      ${C.serifImg(it.name, it.name.length > 14 ? 12 : 14, ['pale', 'pale', 'pale', 'gold'][r.rar], 2, 'rname')}\n      <p class=\"ldesc\">${itemDesc(it, r)}</p><p class=\"lstat\">${statusLine(r)}</p>\n      <div class=\"row\"><button class=\"big\" data-l=\"again\">Noch eine</button><button data-l=\"close\">Zur Schatzkammer</button></div>`;\n    el.querySelector('.skip').hidden = true;\n  };\n  const loop = () => {\n    if (!el.isConnected) return;\n    f++;\n    x.imageSmoothingEnabled = false; x.clearRect(0, 0, 120, 96);\n    // Lichtkegel von oben\n    const lg = x.createRadialGradient(60, 0, 4, 60, 30, 90); lg.addColorStop(0, 'rgba(212,180,106,0.25)'); lg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = lg; x.fillRect(0, 0, 120, 96);\n    let cy = 86, sx = 0, crack = 0, lidOpen = 0;\n    if (f < 24) { const t = f / 24; cy = -20 + (86 + 20) * t * t; }\n    else if (f < 32) cy = 86 - Math.sin((f - 24) / 8 * Math.PI) * 4;\n    if (f === 24) { sfx('thud'); haptic('thud'); }\n    // Aufwertung\n    if (r.upgraded) {\n      if (f > 40 && f < 40 + up) { sx = Math.sin(f * 1.3) * 2; crack = (f - 40) / up; }\n      if (f === 40 + up - 4) { ch = CHESTS[CHESTS.findIndex(c => c.id === fromId) + 1]; sfx('upgrade'); haptic('unlock'); for (let i = 0; i < 40; i++) parts.push(spark(60, 76, '#ffffff', 3)); }\n    }\n    // Klopfer mit Farbsteigerung\n    for (let k = 0; k < knocks; k++) {\n      const t0 = kStart + k * kGap + (k === knocks - 1 && r.rar === 3 ? 24 : 0);\n      if (f === t0) { step = k; sfx('knock', k); haptic('hit'); if (k > 0 && k <= r.rar) sfx('rarStep', Math.min(k, r.rar)); for (let i = 0; i < 6 + k * 4; i++) parts.push(spark(60 + (Math.random() - 0.5) * 24, 76, lightAt(k), 1.4)); }\n      if (f >= t0 && f < t0 + 10) sx = Math.sin((f - t0) * 2.2) * (2 + k) * (1 - (f - t0) / 10);\n    }\n    if (f >= kStart) crack = Math.max(crack, Math.min(1, (step + 1) / knocks + (f - kStart) / 400));\n    // Legendär: Spannungspause, alles wird dunkel und golden\n    if (r.rar === 3 && f > kStart + (knocks - 1) * kGap && f < burstAt) { x.fillStyle = `rgba(255,200,80,${0.08 + Math.sin(f / 3) * 0.04})`; x.fillRect(0, 0, 120, 96); sx = Math.sin(f * 2.7) * 1.2; }\n    if (f === burstAt) { sfx('burst', r.rar); sfx(r.rar >= 2 ? 'legend' : 'chestRare', 1); haptic(r.rar === 3 ? 'bossDie' : r.rar === 2 ? 'unlock' : 'chest'); for (let i = 0; i < 40 + r.rar * 40; i++) parts.push(spark(60, 70, Math.random() < 0.7 ? rar.col : '#fff2cf', 2 + r.rar)); }\n    if (f >= burstAt) lidOpen = Math.min(1, (f - burstAt) / 8);\n    // Strahlen nach dem Aufbruch\n    if (f >= burstAt) {\n      x.save(); x.translate(60, 68); const n = 8 + r.rar * 2;\n      for (let i = 0; i < n; i++) { x.rotate(Math.PI * 2 / n); x.fillStyle = rar.col; x.globalAlpha = 0.12 + 0.06 * Math.sin(f / 9 + i); x.beginPath(); x.moveTo(0, 0); x.lineTo(80, -7); x.lineTo(80, 7); x.fill(); }\n      x.restore(); x.globalAlpha = 1;\n    }\n    drawChest(x, 60 + sx, cy, ch, lidOpen, lightAt(step), crack);\n    // Gegenstand steigt auf\n    if (f >= burstAt) { const ic = itemIcon(it.id, 1), t = Math.min(1, (f - burstAt) / 30), y = 62 - t * 38 + Math.sin(f / 14) * 1.5; x.save(); x.shadowColor = rar.col; x.shadowBlur = 8; x.drawImage(ic, 50, Math.round(y) - 10); x.restore(); }\n    for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vy += 0.06; q.life--; x.globalAlpha = Math.max(0, q.life / q.max); x.fillStyle = q.c; x.fillRect(Math.round(q.x), Math.round(q.y), q.s, q.s); }\n    x.globalAlpha = 1; parts = parts.filter(q => q.life > 0);\n    if (f === burstAt + 34) finish();\n    if (!done) requestAnimationFrame(loop);\n  };\n  requestAnimationFrame(loop);\n  el.addEventListener('click', e => {\n    const a = e.target.closest('[data-l]');\n    if (!shown) { finish(); return; }\n    if (!a) return;\n    done = true; el.remove(); busy = false;\n    if (a.dataset.l === 'again') {\n      const D = C.D, src = CHESTS.find(c => c.id === fromId);\n      if (D.keys[src.id] > 0) { D.keys[src.id]--; } else if (!src.keyOnly && D.gems >= src.price) D.gems -= src.price;\n      else { C.sfx('nope'); return treasury('Nicht genug Edelsteine für eine weitere Truhe.'); }\n      const nr = openChest(D, src.id); C.save.write(); treasury(); return revealOne(nr, src.id);\n    }\n    C.checkAch(); treasury();\n  });\n  treasury();\n}\nfunction spark(x, y, c, spd) { const a = Math.random() * Math.PI * 2, v = Math.random() * spd; const life = 30 + Math.random() * 30; return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.6, c, life, max: life, s: Math.random() < 0.3 ? 2 : 1 }; }\n\n// Zehnerpack: Karten decken sich nacheinander auf, die beste kommt zuletzt\nfunction revealMany(rs, fromId) {\n  busy = true;\n  const order = rs.map((r, i) => ({ r, i })).sort((a, b) => a.r.rar - b.r.rar).map(o => o.r);\n  const el = document.createElement('div'); el.className = 'reveal loot many';\n  const ch = CHESTS.find(c => c.id === fromId), chImg = canvasImg(chestCanvas(ch, 2));\n  el.innerHTML = `<div class=\"manyin\"><p class=\"rar\">10 × ${C.esc(ch.name)}</p><div class=\"lgrid\">${order.map((r, k) => `<div class=\"lc\" data-k=\"${k}\" style=\"--rc:${RAR[r.rar].col};--rg:${RAR[r.rar].glow}\"><div class=\"back\">${chImg}</div></div>`).join('')}</div>\n    <div class=\"rcard lsum\" hidden></div><div class=\"skip\">Tippen zum Überspringen</div></div>`;\n  document.body.appendChild(el);\n  const cards = [...el.querySelectorAll('.lc')];\n  let k = 0, timer = 0, finished = false;\n  const flip = () => {\n    if (k >= order.length) return end();\n    const r = order[k], it = itemById(r.item), c = cards[k];\n    c.classList.add('open', 'r' + r.rar);\n    c.innerHTML = `${canvasImg(itemIcon(it.id, 2))}<b>${C.esc(it.name)}</b><small>${r.isNew ? '<span class=\"new\">NEU</span>' : r.levelUp ? `Stufe ${r.levelUp}` : `+${r.shards} ${C.ic('dia')}`}</small>`;\n    C.sfx(r.rar >= 2 ? 'burst' : 'rarStep', r.rar); if (r.rar >= 2) C.haptic(r.rar === 3 ? 'bossDie' : 'unlock'); else C.haptic('hit');\n    if (r.upgraded) c.classList.add('upg');\n    k++;\n    const next = order[k];\n    timer = setTimeout(flip, next ? (next.rar === 3 ? 1300 : next.rar === 2 ? 800 : 320) : 500);\n  };\n  const end = () => {\n    if (finished) return; finished = true; clearTimeout(timer);\n    while (k < order.length) { const r = order[k], it = itemById(r.item); cards[k].classList.add('open', 'r' + r.rar); cards[k].innerHTML = `${canvasImg(itemIcon(it.id, 2))}<b>${C.esc(it.name)}</b><small>${r.isNew ? '<span class=\"new\">NEU</span>' : r.levelUp ? `Stufe ${r.levelUp}` : `+${r.shards} ${C.ic('dia')}`}</small>`; k++; }\n    const nNew = rs.filter(r => r.isNew).length, sh = rs.reduce((a, r) => a + (r.shards || 0), 0), best = Math.max(...rs.map(r => r.rar));\n    const s = el.querySelector('.lsum'); s.hidden = false;\n    s.innerHTML = `<p>${nNew} neu · ${rs.filter(r => r.levelUp).length} aufgestuft · +${sh} Splitter · beste: <b style=\"color:${RAR[best].col}\">${RAR[best].name}</b></p><div class=\"row\"><button class=\"big\" data-l=\"close\">Weiter</button></div>`;\n    el.querySelector('.skip').hidden = true;\n  };\n  C.sfx('thud'); timer = setTimeout(flip, 600);\n  el.addEventListener('click', e => {\n    if (!finished) { end(); return; }\n    if (e.target.closest('[data-l]')) { el.remove(); busy = false; C.checkAch(); treasury(); }\n  });\n  treasury();\n}\n\n/* ---------- Sammlung ---------- */\nexport function collection(msg = '') {\n  const { D, ic, esc } = C;\n  const slots = D.relicSlots.map((id, i) => id\n    ? `<button class=\"slot on\" data-t=\"unslot\" data-i=\"${i}\">${canvasImg(itemIcon(id, 3))}<small>${esc(itemById(id).name)}</small><em>Stufe ${D.relics[id]}</em></button>`\n    : `<div class=\"slot\"><small>leerer Platz</small></div>`).join('');\n  const relic = r => {\n    const l = D.relics[r.id] || 0, on = D.relicSlots.includes(r.id);\n    return l ? `<button class=\"icard r${r.rar} ${on ? 'on' : ''}\" data-t=\"slot\" data-id=\"${r.id}\">${canvasImg(itemIcon(r.id, 2))}<div><b>${esc(r.name)}</b><small>${esc(r.desc(l))}</small><span class=\"pips\">${[1, 2, 3].map(k => `<i class=\"${k <= l ? 'on' : ''}\"></i>`).join('')}</span></div></button>`\n      : `<div class=\"icard r${r.rar} unk\">${canvasImg(itemIcon(r.id, 2, true))}<div><b>???</b><small style=\"color:${RAR[r.rar].col}\">${RAR[r.rar].name}</small></div></div>`;\n  };\n  const cos = kind => COSMETICS.filter(c => c.kind === kind).map(c => D.cosmetics[c.id]\n    ? `<button class=\"icard r${c.rar} ${D.look[kind] === c.id ? 'on' : ''}\" data-t=\"look\" data-k=\"${kind}\" data-id=\"${c.id}\">${canvasImg(itemIcon(c.id, 2))}<div><b>${esc(c.name)}</b><small style=\"color:${RAR[c.rar].col}\">${RAR[c.rar].name}</small></div></button>`\n    : `<div class=\"icard r${c.rar} unk\">${canvasImg(itemIcon(c.id, 2, true))}<div><b>???</b><small style=\"color:${RAR[c.rar].col}\">${RAR[c.rar].name}</small></div></div>`).join('');\n  const have = ITEMS.filter(i => i.kind === 'relikt' ? D.relics[i.id] : D.cosmetics[i.id]).length;\n  C.show(`<div class=\"panel\">\n    <div class=\"top\"><button class=\"back\" data-a=\"treasury\">‹</button><h2>Sammlung</h2><span class=\"gems\">${have} / ${ITEMS.length} · ${ic('dia')} ${D.shards}</span></div>\n    <h3 class=\"sub\">Relikt-Plätze</h3><div class=\"slots\">${slots}</div>\n    <p class=\"note\">Tippe ein Relikt an, um es anzulegen. Drei passen gleichzeitig. Doppelte Funde heben es bis Stufe 3.</p>\n    <div class=\"igrid\">${RELICS.map(relic).join('')}</div>\n    <h3 class=\"sub\">Spur</h3><div class=\"igrid\">${cos('spur')}</div>\n    <h3 class=\"sub\">Färbung</h3><div class=\"igrid\">${cos('farbe')}</div>\n    <h3 class=\"sub\">Aura</h3><div class=\"igrid\">${cos('aura')}</div>\n    ${msg ? `<p class=\"msg\">${msg}</p>` : ''}\n  </div>`);\n}\nexport function collectionClick(b) {\n  const t = b.dataset.t, { D } = C; if (!t) return false;\n  if (t === 'unslot') { D.relicSlots[+b.dataset.i] = null; }\n  else if (t === 'slot') {\n    const id = b.dataset.id, at = D.relicSlots.indexOf(id);\n    if (at >= 0) D.relicSlots[at] = null;\n    else { const free = D.relicSlots.indexOf(null); if (free < 0) { C.sfx('nope'); collection('Alle drei Plätze sind belegt. Lege zuerst ein Relikt ab.'); return true; } D.relicSlots[free] = id; }\n  } else if (t === 'look') { const k = b.dataset.k; D.look[k] = D.look[k] === b.dataset.id ? null : b.dataset.id; }\n  C.save.write(); C.sfx('click'); collection(); return true;\n}\n","ui-skin.js":"// Dunkle Pixel-Oberfläche: feine Goldlinien, Filigran-Ecken, Pixel-Serifenschrift.\n// Alles wird beim Start als echte Pixel-Grafik gezeichnet und als CSS-Variable bereitgestellt.\nconst K = '#0b0907';\nconst mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };\nconst url = c => `url(${c.toDataURL()})`;\nfunction rnd(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }\n\nconst G = { hi: '#fff1c8', lt: '#f0dca0', md: '#d4b46a', dk: '#9a7a3c', dd: '#5a4626', bg: '#14110c' };\n\n/* ---------- Texturen ---------- */\nfunction texNoise(base, spread, seed) {\n  const c = mk(48, 48), x = c.getContext('2d'), r = rnd(seed);\n  x.fillStyle = base; x.fillRect(0, 0, 48, 48);\n  for (let k = 0; k < 260; k++) { x.fillStyle = r() < 0.5 ? spread[0] : spread[1]; x.fillRect(Math.floor(r() * 48), Math.floor(r() * 48), 1, 1); }\n  return c;\n}\n\n/* ---------- Rahmen ---------- */\n// Filigran-Rahmen: Quelle 26×26, Slice 10. Feine Doppellinie, Raute mit Ranken in jeder Ecke.\nfunction frameFiligree(col = G, S = 26) {\n  const c = mk(S, S), x = c.getContext('2d');\n  const px = (cl, a, b, w = 1, h = 1) => { x.fillStyle = cl; x.fillRect(a, b, w, h); };\n  // äussere Linie\n  px(col.dk, 3, 1, S - 6, 1); px(col.dk, 3, S - 2, S - 6, 1); px(col.dk, 1, 3, 1, S - 6); px(col.dk, S - 2, 3, 1, S - 6);\n  // innere feine Linie\n  px(col.dd, 9, 4, S - 18, 1); px(col.dd, 9, S - 5, S - 18, 1); px(col.dd, 4, 9, 1, S - 18); px(col.dd, S - 5, 9, 1, S - 18);\n  for (const [fx, fy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {\n    const ox = fx ? S - 1 : 0, oy = fy ? S - 1 : 0, sx = fx ? -1 : 1, sy = fy ? -1 : 1;\n    const P = (a, b, cl) => px(cl, ox + sx * a, oy + sy * b);\n    // Raute\n    for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) if (Math.abs(a) + Math.abs(b) <= 2) P(3 + a, 3 + b, Math.abs(a) + Math.abs(b) === 2 ? col.dk : col.md);\n    P(3, 3, col.hi); P(2, 3, col.lt); P(3, 2, col.lt);\n    // Ranken entlang der Kanten\n    P(6, 2, col.md); P(7, 3, col.dk); P(8, 3, col.dk); P(9, 2, col.md); P(10, 1, col.dk);\n    P(2, 6, col.md); P(3, 7, col.dk); P(3, 8, col.dk); P(2, 9, col.md); P(1, 10, col.dk);\n    P(5, 5, col.dk); P(6, 6, col.dd);\n  }\n  return c;\n}\n// Schlichter Linienrahmen mit kleinen Eckpunkten: Quelle 12×12, Slice 4\nfunction frameLine(col = G) {\n  const S = 12, c = mk(S, S), x = c.getContext('2d');\n  const px = (cl, a, b, w = 1, h = 1) => { x.fillStyle = cl; x.fillRect(a, b, w, h); };\n  px(col.dk, 2, 0, S - 4, 1); px(col.dk, 2, S - 1, S - 4, 1); px(col.dk, 0, 2, 1, S - 4); px(col.dk, S - 1, 2, 1, S - 4);\n  for (const [a, b] of [[1, 1], [S - 2, 1], [1, S - 2], [S - 2, S - 2]]) px(col.lt, a, b);\n  return c;\n}\n\n/* ---------- Pixel-Serifenschrift ---------- */\nconst PALS = {\n  gold: ['#fff4d0', '#f3e3b3', '#e6cf90', '#d4b46a', '#b8944e', '#8a6a30'],\n  pale: ['#ffffff', '#efe6d0', '#e0d4b8', '#cbbd9c', '#ada080', '#8a7e64'],\n  red: ['#ffc0b0', '#ff7a64', '#e0402c', '#b82418', '#8a1410', '#5a0a08'],\n  jade: ['#e8fff6', '#b8ffe6', '#7dffcf', '#3fc896', '#1f9a70', '#0e6a4a'],\n  dim: ['#a89a80', '#988a70', '#8a7c62', '#7a6c54', '#6a5c46', '#5a4c38'],\n};\nconst serifCache = new Map();\nexport function serif(text, px = 13, pal = 'gold', spacing = 1) {\n  const key = `${text}|${px}|${pal}|${spacing}`;\n  if (serifCache.has(key)) return serifCache.get(key);\n  const t = mk(Math.max(64, text.length * px * 1.2 + 20), Math.ceil(px * 1.8)), x = t.getContext('2d');\n  x.font = `700 ${px}px Georgia,\"Times New Roman\",\"Noto Serif\",\"DejaVu Serif\",serif`; x.textBaseline = 'top';\n  let cx = 2;\n  for (const ch of text) { x.fillStyle = '#fff'; x.fillText(ch, cx, 2); cx += x.measureText(ch).width + spacing; }\n  const w = Math.ceil(cx) + 2, h = Math.ceil(px * 1.75);\n  const d = x.getImageData(0, 0, w, h).data;\n  const on = (a, b) => a >= 0 && b >= 0 && a < w && b < h && d[(b * w + a) * 4 + 3] > 118;\n  let top = h, bot = 0;\n  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) if (on(i, y)) { top = Math.min(top, y); bot = Math.max(bot, y); }\n  const c = mk(w + 4, bot - top + 6), o = c.getContext('2d'), grad = PALS[pal];\n  for (let y = top; y <= bot; y++) for (let i = 0; i < w; i++) {\n    if (on(i, y)) continue;\n    let e = false; for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (on(i + a, y + b)) e = true;\n    if (e) { o.fillStyle = K; o.fillRect(i + 2, y - top + 2, 1, 1); }\n  }\n  for (let y = top; y <= bot; y++) for (let i = 0; i < w; i++) {\n    if (!on(i, y)) continue;\n    o.fillStyle = grad[Math.min(grad.length - 1, Math.floor((y - top) / (bot - top + 1) * grad.length))];\n    o.fillRect(i + 2, y - top + 2, 1, 1);\n  }\n  // Schatten nach unten\n  o.globalCompositeOperation = 'destination-over'; o.globalAlpha = 0.6; o.drawImage(c, 0, 1); o.globalAlpha = 1;\n  const r = { u: c.toDataURL(), w: c.width, h: c.height };\n  serifCache.set(key, r);\n  return r;\n}\nexport function serifImg(text, px = 13, pal = 'gold', scale = 2, cls = '') {\n  const s = serif(text, px, pal);\n  return `<img class=\"serif ${cls}\" src=\"${s.u}\" width=\"${s.w * scale}\" height=\"${s.h * scale}\" alt=\"${text.replace(/\"/g, '&quot;')}\">`;\n}\n\n/* ---------- Pixel-Symbole (gedämpftes Gold) ---------- */\nconst ICONS = {\n  gem: ['..kkk..', '.kLWDk.', 'kLLDDDk', 'kDDDDDk', '.kDDDk.', '..kDk..', '...k...'],\n  star: ['...k...', '..kYk..', 'kkkYkkk', 'kYYHYYk', '.kYYYk.', 'kYk.kYk', 'kk...kk'],\n  starOff: ['...k...', '..kGk..', 'kkkGkkk', 'kGGGGGk', '.kGGGk.', 'kGk.kGk', 'kk...kk'],\n  coin: ['..kkk..', '.kYYYk.', 'kYHYYOk', 'kYYkYOk', 'kYYYYOk', '.kOOOk.', '..kkk..'],\n  lock: ['..kkk..', '.kGkGk.', '.kGkGk.', 'kkkkkkk', 'kYYYYYk', 'kYYkYYk', 'kYYYYYk', 'kkkkkkk'],\n  check: ['......k', '.....kY', 'k...kYk', 'Yk.kYk.', '.kYYk..', '..kk...'],\n  trophy: ['kkkkkkk', 'YkYYYkY', 'YkYHYkY', '.kYYYk.', '..kYk..', '..kYk..', '.kkkkk.'],\n  scroll: ['.kkkkk.', 'kPPPPPk', '.kPkkPk', '.kPPPPk', '.kPkkPk', 'kPPPPPk', '.kkkkk.'],\n  gear: ['..k.k..', '.kGkGk.', 'kGGkGGk', '.kkYkk.', 'kGGkGGk', '.kGkGk.', '..k.k..'],\n  anvil: ['kkkkkkk.', 'kGGGGGkk', '.kGGGGGk', '..kGGk..', '..kGGk..', '.kkkkkk.'],\n  sword: ['.....kk', '....kWk', '...kWk.', 'k.kWk..', 'kkWk...', '.kYk...', 'kYkk...'],\n  dia: ['..k..', '.kYk.', 'kYHYk', '.kYk.', '..k..'],\n  flame: ['...k...', '..kYk..', '..kYk.k', '.kYHYkY', 'kYHHHYk', 'kYHWHYk', '.kYYYk.'],\n  rune: ['kkkkk', 'kY.Yk', 'k.Y.k', 'kY.Yk', 'kkkkk'],\n};\nconst ICPAL = { k: K, L: '#a8d4ff', W: '#ffffff', D: '#3a6ad0', Y: '#d4b46a', H: '#fff1c8', O: '#8a6a30', G: '#6a6050', P: '#cbbd9c' };\nfunction icon(rows) {\n  const w = Math.max(...rows.map(r => r.length)), h = rows.length, c = mk(w, h), x = c.getContext('2d');\n  rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) { const col = ICPAL[r[i]]; if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); } } });\n  return c;\n}\nexport const IC = {};\nexport function ic(name, cls = '') { return `<i class=\"px ${cls}\" style=\"--w:${IC[name]?.w || 7};--h:${IC[name]?.h || 7};background-image:${IC[name]?.u || 'none'}\"></i>`; }\n\nexport function initSkin() {\n  const root = document.documentElement.style;\n  root.setProperty('--tex-dark', url(texNoise('#0f0c09', ['#17130e', '#0a0806'], 3)));\n  root.setProperty('--tex-inset', url(texNoise('#16120d', ['#1e1912', '#100d09'], 5)));\n  root.setProperty('--fr-fili', url(frameFiligree()));\n  root.setProperty('--fr-fili-red', url(frameFiligree({ hi: '#ffd0c0', lt: '#ff9a80', md: '#c84030', dk: '#8a2418', dd: '#4a140c' })));\n  root.setProperty('--fr-fili-jade', url(frameFiligree({ hi: '#e8fff6', lt: '#a8ffe0', md: '#3fc896', dk: '#1f7a5a', dd: '#0e3a2c' })));\n  root.setProperty('--fr-line', url(frameLine()));\n  root.setProperty('--fr-line-hi', url(frameLine({ dk: '#d4b46a', lt: '#fff1c8' })));\n  root.setProperty('--fr-line-dim', url(frameLine({ dk: '#3a3020', lt: '#5a4c38' })));\n  for (const [k, rows] of Object.entries(ICONS)) { const c = icon(rows); IC[k] = { u: url(c), w: c.width, h: c.height }; }\n  root.setProperty('--dia', IC.dia.u); root.setProperty('--lock', IC.lock.u); root.setProperty('--coin', IC.coin.u);\n}\nexport function logoImg() {\n  const s = serif('SCHAUFELHELD', 24, 'gold', 3);\n  return `<img class=\"logo\" src=\"${s.u}\" width=\"${s.w}\" height=\"${s.h}\" alt=\"Schaufelheld\">`;\n}\n// Serifenschrift kann von Systemschriften abhängen; nach dem Laden einmal neu zeichnen\nexport function refreshLogo(cb) { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { serifCache.clear(); cb && cb(); }); }\n","weapons.js":"// Legendäre und mythische Waffen. Sie ersetzen die Schaufel-Optik und legen einen Effekt\n// auf die Werte der aktuellen Schaufel-Stufe (Schaden, Reichweite, Stein bleiben erhalten).\n// Freigeschaltet werden sie nur über Bedingungen, nie über Edelsteine.\n\nexport const RARITY = {\n  legendaer: { name: 'Legendär', col: '#ffd84a', glow: '#ffb020' },\n  mythisch: { name: 'Mythisch', col: '#ff7ae0', glow: '#9a4cff' },\n};\n\nexport const WEAPONS = [\n  { id: 'federklinge', name: 'Federklinge', rar: 'legendaer', dark: '#3a8fd0', light: '#e8f8ff', handle: '#d8d8e8',\n    perk: 'Schneller laufen, höher springen, längere Klinge.',\n    hint: 'Wer im Moosweg keinem Wesen ein Leid tut, dem wächst eine Feder.',\n    cond: '1-1 schaffen, ohne einen einzigen Gegner zu besiegen.' },\n  { id: 'blitzspaten', name: 'Blitzspaten', rar: 'legendaer', dark: '#c09000', light: '#fff36a', handle: '#3a2a60',\n    perk: 'Rasend schnelle Hiebe und schnellerer Lauf.',\n    hint: 'Durchquere den Moosweg, bevor das Moos es merkt.',\n    cond: '1-1 in unter 25 Sekunden schaffen.' },\n  { id: 'erdfresser', name: 'Erdfresser', rar: 'legendaer', dark: '#6a3a1a', light: '#e0a050', handle: '#3a2010',\n    perk: 'Gräbt Erde im Umkreis von 3×3, doppelte Beute aus Erde.',\n    hint: 'Die Wurzelhöhlen wollen restlos umgegraben werden.',\n    cond: 'In 1-2 jeden einzelnen Erdblock ausgraben und das Ziel erreichen.' },\n  { id: 'goldschaufel', name: 'Goldschaufel des Königs', rar: 'legendaer', dark: '#b07a10', light: '#fff0a0', handle: '#7a1830',\n    perk: 'Jeder Edelstein zählt doppelt.',\n    hint: 'Drei Truhen schlafen hinter Stein. Weck sie alle.',\n    cond: 'Die drei verborgenen Truhen in Welt 1 öffnen.' },\n  { id: 'geisterklinge', name: 'Geisterklinge', rar: 'legendaer', dark: '#3a9ab0', light: '#c8ffff', handle: '#2a3a5a', ghost: true,\n    perk: 'In der Luft nochmals A: Geister-Sprint, dabei unverwundbar.',\n    hint: 'Schlage einen fremden Geist um mehr als zwei Atemzüge.',\n    cond: 'Den Geist eines anderen Spielers um mindestens 2 Sekunden schlagen.' },\n  { id: 'sternenspaten', name: 'Sternenspaten', rar: 'mythisch', dark: '#3a2a9a', light: '#d8c8ff', handle: '#1a1040',\n    perk: 'Jeder Schaufel-Abpraller schleudert zwei Sterne.',\n    hint: 'Zwölfmal vom Himmel fallen, ohne die Erde zu berühren.',\n    cond: 'Eine Kette von 12 Schaufel-Abprallern ohne Bodenkontakt.' },\n  { id: 'maulwurfkralle', name: 'Maulwurfkralle', rar: 'mythisch', dark: '#7a3010', light: '#ff9a50', handle: '#2a1408',\n    perk: 'Hiebe am Boden senden eine Erdwelle.',\n    hint: 'Der Rostmaulwurf fällt, ohne dich je berührt zu haben.',\n    cond: 'Den Rostmaulwurf besiegen, ohne Schaden zu nehmen.' },\n  { id: 'seelenschaufel', name: 'Seelenschaufel', rar: 'mythisch', dark: '#3a1060', light: '#b07aff', handle: '#120820',\n    perk: 'Einmal pro Level: Auferstehen statt Sterben, ohne Verlust.',\n    hint: 'Zwanzigmal gefallen. Die Seele merkt sich jeden Sturz.',\n    cond: '20 Tode insgesamt.' },\n  { id: 'pendelhammer', name: 'Pendelhammer', rar: 'mythisch', dark: '#6a4a10', light: '#ffe08a', handle: '#2a1e10',\n    perk: 'Schaufel-Sprünge lösen eine Druckwelle aus, die alles daneben trifft.',\n    hint: 'Das Pendelwerk fällt nur durch Sprünge. Keine Klinge, die es seitlich berührt.',\n    cond: 'Das Pendelwerk ausschliesslich mit Schaufel-Sprüngen besiegen.' },\n  { id: 'spuerschaufel', name: 'Spürschaufel', rar: 'legendaer', dark: '#2a6a5a', light: '#9affd8', handle: '#3a2a1a',\n    perk: 'Zeigt falsche Wände und unsichtbare Blöcke. Schaufelmünzen pulsieren durch Wände.',\n    hint: 'Ganz unten, wo die alten Schaufler ruhen, liegt ein Werkzeug, das Geheimnisse riecht.',\n    cond: 'Das Ende der Schaufelgruft erreichen.', secret: true },\n  { id: 'urfunke', name: 'Urfunke', rar: 'mythisch', dark: '#c02a00', light: '#ffe070', handle: '#400a00', secret: true,\n    perk: 'Doppelter Schaden, jeder Hieb brennt.',\n    hint: 'Über dem Dornenkamm, wo kein gewöhnlicher Sprung hinreicht, glimmt etwas.',\n    cond: 'Den Altar hoch über dem Dornenkamm finden.' },\n];\n\nexport const weaponById = id => WEAPONS.find(w => w.id === id) || null;\n\n// Wirkung im Spiel\nexport function weaponMods(id) {\n  const m = { run: 2.0, jump: 5.6, reach: 0, atkLen: 16, dmgMul: 1, gemMul: 1, area: false, dirtMul: 1, stars: false, wave: false, soul: false, dash: false, fire: false, quake: false, seer: false };\n  switch (id) {\n    case 'federklinge': m.run = 2.35; m.jump = 6.05; m.reach = 4; break;\n    case 'blitzspaten': m.run = 2.3; m.atkLen = 9; break;\n    case 'erdfresser': m.area = true; m.dirtMul = 2; break;\n    case 'goldschaufel': m.gemMul = 2; break;\n    case 'geisterklinge': m.dash = true; break;\n    case 'sternenspaten': m.stars = true; break;\n    case 'maulwurfkralle': m.wave = true; break;\n    case 'seelenschaufel': m.soul = true; break;\n    case 'pendelhammer': m.quake = true; break;\n    case 'spuerschaufel': m.seer = true; break;\n    case 'urfunke': m.dmgMul = 2; m.fire = true; break;\n  }\n  return m;\n}\n"};
