<title>Schaufelheld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a1e;--panel:#241540;--panel2:#331f57;--ink:#fff3e6;--mute:#c4abd8;--gold:#ffd84a;--pink:#ff4f7a;--mint:#7dffa0;--k:#140c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:16px/1.35 "Pixelify Sans",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#screen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}

/* Touch-Steuerung */
#touch{position:fixed;inset:0;pointer-events:auto;z-index:5}
#touch[hidden]{display:none}
#touch button{position:absolute;width:64px;height:64px;border-radius:18px;border:3px solid #ffffff30;background:#14081f70;font-size:24px;font-weight:700;color:#ffffffc0;pointer-events:none;backdrop-filter:blur(2px)}
#touch button.on{background:#ffffff40;border-color:#ffffffa0;transform:scale(.94)}
.pad button[data-k=left]{left:calc(env(safe-area-inset-left) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px)}
.pad button[data-k=right]{left:calc(env(safe-area-inset-left) + 150px);bottom:calc(env(safe-area-inset-bottom) + 22px)}
.pad button[data-k=down]{left:calc(env(safe-area-inset-left) + 84px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:60px;height:54px}
.acts .a{right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 50px);border-radius:50%!important;width:72px!important;height:72px!important;background:#ff4f7a55!important}
.acts .b{right:calc(env(safe-area-inset-right) + 104px);bottom:calc(env(safe-area-inset-bottom) + 18px);border-radius:50%!important;width:68px!important;height:68px!important;background:#ffd84a40!important}
#pauseBtn{position:fixed;z-index:6;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 10px);width:44px;height:44px;border-radius:12px;border:2px solid #ffffff40;background:#14081f80;font-weight:700;letter-spacing:-2px}
#pauseBtn[hidden]{display:none}

/* Menüs */
#ui{position:fixed;inset:0;z-index:8;display:flex;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto;touch-action:pan-y}
#ui[hidden]{display:none}
#ui>*{margin:auto}
.forge button.big{font-size:17px!important;padding:6px 18px!important}
.title{text-align:center;text-shadow:0 3px 0 var(--k)}
.title h1{font-size:clamp(44px,9vw,76px);line-height:1;margin:0 0 6px;color:var(--gold);font-weight:700;-webkit-text-stroke:2px var(--k);paint-order:stroke}
.title h1 span{color:var(--ink)}
.title p{margin:0 0 18px;color:var(--mute)}
.title .gems{margin-top:14px;color:var(--gold)}
.panel{width:min(760px,100%);background:#1a0f2ef2;border:3px solid var(--k);box-shadow:0 0 0 3px #4a2c74,0 12px 0 #0008;border-radius:14px;padding:14px 16px}
.panel.small{width:min(440px,100%)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top h2{flex:1;margin:0;font-size:22px}
h2{margin:0 0 10px;font-size:24px}
h3{margin:0;font-size:20px}
.gems{color:var(--gold);font-weight:600;white-space:nowrap}
button.back{width:44px;height:44px;border-radius:10px;border:2px solid #ffffff30;background:var(--panel2);font-size:24px;line-height:1}
.panel button:not(.card):not(.back):not(.chip),.title button{min-height:44px;padding:8px 16px;border-radius:12px;border:3px solid var(--k);background:var(--panel2);box-shadow:0 4px 0 var(--k);font-weight:600;margin:4px}
.panel button:active,.title button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--k)}
button.big{background:var(--pink)!important;color:#fff;font-size:20px!important;padding:10px 28px!important}
.title button.big{font-size:24px!important;padding:12px 44px!important}
button.off{opacity:.55}
button.danger{background:#5a1830!important;margin-top:10px!important}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:8px}
.toggles button.on{background:#2f6a4a!important}
.note{color:var(--mute);font-size:14px;margin:6px 0}
.msg{background:#2f6a4a;border-radius:10px;padding:8px 12px;margin:10px 0 0}
.soon{text-align:center;opacity:.8}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{position:relative;text-align:left;min-height:96px;padding:10px;border-radius:12px;border:3px solid var(--k);box-shadow:0 4px 0 var(--k);display:flex;flex-direction:column;gap:2px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.card .no{font-size:13px;opacity:.8}.card b{font-size:17px;line-height:1.1}.card small{margin-top:auto;font-size:14px}
.card i{position:absolute;top:6px;right:8px;font-style:normal;color:var(--mint);font-weight:700}
.card.sel{outline:3px solid var(--gold);outline-offset:2px}
.card.locked{filter:grayscale(1) brightness(.55)}
.th-wald{--c1:#3a7a4a;--c2:#2a1a42}.th-hoehle{--c1:#4a3488;--c2:#150b25}.th-dornen{--c1:#a83a50;--c2:#200c22}.th-bau{--c1:#b04a1a;--c2:#1f0a07}
.detail{display:grid;grid-template-columns:1fr 1.4fr auto;gap:12px;align-items:center;margin-top:12px;padding:12px;background:var(--panel);border-radius:12px}
.ghosts small{color:var(--mute)}
.ghosts label{display:flex;gap:8px;align-items:center;min-height:32px}
.ghosts input{width:20px;height:20px;accent-color:#8fe8ff}
.forge{display:flex;gap:14px;align-items:flex-start}
#preview{width:216px;height:120px;image-rendering:pixelated;background:radial-gradient(#4a2c74,#1a0f2e 70%);border-radius:12px;display:block}
.pv{flex:none;text-align:center}.pv small{color:var(--mute);font-size:12px}.pv small span{color:var(--gold)}
.chips canvas.gi{image-rendering:pixelated;height:30px;width:auto;border-radius:6px;background:#1a0f2e;padding:2px;opacity:.55}
.chips canvas.gi.own{opacity:1}.chips canvas.gi.cur{outline:2px solid var(--gold);background:#3a2a10}
.chips canvas.gi.lock{filter:brightness(0) drop-shadow(0 0 1px #ffffff60);opacity:.8}
.reveal.gear .rays{background:repeating-conic-gradient(#ffffff14 0 8deg,transparent 8deg 20deg)}
.reveal.gear .rcard canvas{filter:drop-shadow(0 0 16px var(--c))}
.rows{flex:1;display:grid;gap:10px;min-width:0}
.gear{background:var(--panel);border-radius:12px;padding:10px 12px}
.gh{display:flex;flex-direction:column}.gh small{color:var(--mute)}
.chips{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
.chips{align-items:flex-end}
.chip.cur{outline:2px solid var(--gold);outline-offset:1px}
.chip.lock{opacity:.35}
.next{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.lockt{color:var(--mute);font-size:14px}
.result{text-align:center}
.result .lvl{color:var(--mute);margin:-6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border-radius:10px;padding:8px}
.stats small{display:block;color:var(--mute);font-size:13px}.stats b{font-size:22px}.stats em{display:block;font-style:normal;font-size:12px;color:var(--gold)}
.vs{margin:8px 0 0;font-weight:600}.vs.win{color:var(--mint)}.vs.lose{color:#ff8a9a}
.ghostbtn{background:#1f4a5a!important;margin-top:10px!important}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0;color:var(--mute);font-size:14px}
.field input,.field textarea,.codebox{font:16px "Pixelify Sans",monospace;padding:10px;border-radius:10px;border:2px solid var(--k);background:#0e0718;color:var(--ink);user-select:text;-webkit-user-select:text;width:100%}
.codebox{margin-top:10px;font-size:12px}

#rotate{display:none}
@media (orientation:portrait) and (pointer:coarse){
  #rotate{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-content:center;text-align:center;gap:16px}
  #rotate .ph{width:46px;height:80px;margin:0 auto;border:4px solid var(--ink);border-radius:10px;animation:rot 1.6s ease-in-out infinite}
  @keyframes rot{50%{transform:rotate(-90deg)}}
}
@media (max-height:420px){
  .panel{padding:10px 12px}.top{margin-bottom:6px}.card{min-height:78px}
  .detail{margin-top:8px;padding:8px}
  .title h1{font-size:52px}
}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.forge{flex-direction:column;align-items:center}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none}}

/* Sterne */
.starrow{display:flex;justify-content:center;gap:14px;margin:0 0 10px}
.star{display:flex;flex-direction:column;align-items:center;opacity:.35}
.star span{font-size:34px;line-height:1;color:#5a4a70;text-shadow:0 3px 0 var(--k)}
.star small{font-size:12px;color:var(--mute)}
.star.on{opacity:1}.star.on span{color:var(--gold)}
.star.new span{animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both;animation-delay:var(--d)}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
.cstars{display:flex;gap:2px;font-size:15px}.cstars em{font-style:normal;color:#ffffff30}.cstars em.on{color:var(--gold)}

/* Waffenkammer */
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.wcard{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:12px;padding:10px;border:2px solid transparent}
.wcard.on{border-color:var(--c);box-shadow:0 0 18px -4px var(--c)}
.wcard .wi{flex:none;width:44px;display:grid;place-items:center;padding-top:4px}
.wcard canvas{image-rendering:pixelated}
.wcard canvas.sil{filter:brightness(0) drop-shadow(0 0 1px #ffffff40)}
.wcard b{display:block;font-size:16px;line-height:1.15}
.wcard small{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.wcard p{margin:3px 0 4px;font-size:13px;color:var(--mute)}
.wcard.locked p{font-style:italic}
.wcard button{min-height:36px!important;padding:4px 12px!important;margin:2px 0!important;font-size:14px}
.wcard.mythisch:not(.locked){background:linear-gradient(160deg,#3a1a5a,var(--panel) 60%)}
.wcard.legendaer:not(.locked){background:linear-gradient(160deg,#4a3a10,var(--panel) 60%)}
@media (max-width:760px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Enthüllung */
.reveal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0a0512e8;overflow:hidden;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:50%;margin:-100vmax 0 0 -100vmax;
  background:repeating-conic-gradient(from 0deg,#ffffff10 0 8deg,transparent 8deg 20deg);animation:spin 18s linear infinite}
.reveal.legendaer .rays{background:repeating-conic-gradient(#ffd84a22 0 8deg,transparent 8deg 20deg)}
.reveal.mythisch .rays{background:repeating-conic-gradient(#ff7ae026 0 6deg,transparent 6deg 14deg,#9a4cff22 14deg 20deg,transparent 20deg 28deg)}
@keyframes spin{to{transform:rotate(1turn)}}
.rcard{position:relative;text-align:center;padding:16px 24px;max-width:min(460px,92vw);animation:rise .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{transform:translateY(40px) scale(.7);opacity:0}}
.rcard .rar{margin:0;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c);text-shadow:0 0 12px var(--g)}
.reveal.mythisch .rar{background:linear-gradient(90deg,#ff7ae0,#fff,#9a4cff,#ff7ae0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2s linear infinite}
@keyframes shim{to{background-position:300% 0}}
.rcard canvas{display:block;margin:8px auto;image-rendering:pixelated;max-height:34vh;width:auto;filter:drop-shadow(0 0 14px var(--g));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.rcard h2{font-size:clamp(26px,5vw,36px);margin:4px 0;color:#fff}
.rcard .perk{margin:0 0 4px;font-size:17px}
.rcard .cond{margin:0 0 8px;color:var(--mute);font-size:14px}
.rcard button{min-height:44px;padding:8px 18px;border-radius:12px;border:3px solid var(--k);background:var(--panel2);box-shadow:0 4px 0 var(--k);font-weight:600;margin:4px;color:#fff;font-family:inherit}
@media (prefers-reduced-motion:reduce){.rays,.rcard canvas,.reveal.mythisch .rar{animation:none}}

.wtabs{display:flex;gap:6px;margin:-2px 0 10px}
.wtab{min-height:36px!important;padding:4px 14px!important;margin:0!important;font-size:15px}
.wtab.on{background:var(--gold)!important;color:#2a1a00}
.wtab.locked{opacity:.5}
.th-uhrturm{--c1:#2a6a74;--c2:#10222a}.th-glocke{--c1:#7a5aa0;--c2:#18122a}.th-pendel{--c1:#b07a30;--c2:#200e08}

</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="touch" hidden>
  <div class="pad">
    <button data-k="left" aria-label="Links">◀</button>
    <button data-k="down" aria-label="Schaufel nach unten">▼</button>
    <button data-k="right" aria-label="Rechts">▶</button>
  </div>
  <div class="acts">
    <button data-k="attack" class="b" aria-label="Schaufel">B</button>
    <button data-k="jump" class="a" aria-label="Springen">A</button>
  </div>
</div>
<button id="pauseBtn" hidden aria-label="Pause">II</button>
<div id="ui" hidden></div>
<div id="rotate"><div class="ph"></div><p>Bitte Handy quer halten</p></div>
<script>
(() => {
  const SRC = {"audio.js":"// Chiptune-Soundeffekte und Musik, komplett synthetisiert (WebAudio, keine Dateien).\nlet ac = null, master = null, musicGain = null, sfxGain = null;\nconst st = { sfx: true, music: true };\n\nexport function unlockAudio() {\n  if (!ac) {\n    try {\n      ac = new (window.AudioContext || window.webkitAudioContext)();\n      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);\n      musicGain = ac.createGain(); musicGain.gain.value = st.music ? 0.32 : 0; musicGain.connect(master);\n      sfxGain = ac.createGain(); sfxGain.gain.value = st.sfx ? 0.8 : 0; sfxGain.connect(master);\n    } catch { ac = null; }\n  }\n  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});\n}\nexport function setAudio(sfx, music) {\n  st.sfx = sfx; st.music = music;\n  if (sfxGain) sfxGain.gain.value = sfx ? 0.8 : 0;\n  if (musicGain) musicGain.gain.value = music ? 0.32 : 0;\n}\n\nfunction osc(type, f0, f1, dur, vol, when = 0, out = sfxGain) {\n  if (!ac) return;\n  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();\n  o.type = type; o.frequency.setValueAtTime(f0, t);\n  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);\n  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);\n  o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);\n}\nlet noiseBuf = null;\nfunction noise(dur, vol, freq = 1200, when = 0) {\n  if (!ac) return;\n  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }\n  const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();\n  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;\n  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);\n  s.connect(f).connect(g).connect(sfxGain); s.start(t); s.stop(t + dur + 0.02);\n}\n\nconst SFX = {\n  jump: () => osc('square', 300, 620, 0.12, 0.12),\n  swing: () => noise(0.08, 0.15, 3000),\n  dig: () => { noise(0.14, 0.35, 700); osc('triangle', 180, 90, 0.12, 0.2); },\n  crack: () => { noise(0.2, 0.4, 1600); osc('square', 220, 70, 0.15, 0.12); },\n  clink: () => { osc('square', 1600, 1400, 0.06, 0.08); osc('triangle', 2400, 2200, 0.1, 0.06, 0.02); },\n  // Edelstein-Serie: jeder weitere Stein in kurzer Folge einen Halbton höher (bis eine Oktave)\n  gem: (n = 1) => { const k = 2 ** (Math.min(12, n - 1) / 12); osc('square', 988 * k, 988 * k, 0.06, 0.08); osc('square', 1319 * k, 1319 * k, 0.12, 0.08, 0.05); },\n  hit: () => { osc('square', 440, 110, 0.1, 0.15); noise(0.06, 0.2, 2000); },\n  // Pogo-Kette: steigende Tonleiter\n  bounce: (n = 1) => { const k = 2 ** ([0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19][Math.min(11, n - 1)] / 12); osc('square', 200 * k, 800 * k, 0.1, 0.12); if (n >= 3) osc('triangle', 523 * k, 523 * k, 0.12, 0.08, 0.03); },\n  chainEnd: (n = 3) => [0, 4, 7, 12].slice(0, Math.min(4, n - 1)).forEach((s, i) => osc('square', 523 * 2 ** (s / 12), 523 * 2 ** (s / 12), 0.1, 0.07, i * 0.05)),\n  dash: () => { noise(0.18, 0.25, 4000); osc('sine', 900, 300, 0.2, 0.12); },\n  wave: () => { noise(0.25, 0.3, 500); osc('triangle', 140, 60, 0.2, 0.2); },\n  revive: () => [262, 330, 392, 523, 659, 784].forEach((n, i) => osc('triangle', n, n, 0.3, 0.12, i * 0.08)),\n  legend: () => {\n    [392, 523, 659, 784, 1047].forEach((n, i) => osc('square', n, n, 0.18, 0.09, i * 0.09));\n    [1047, 1319, 1568].forEach(n => osc('square', n, n, 0.9, 0.06, 0.5)); osc('triangle', 131, 131, 1.2, 0.25, 0.5); noise(0.8, 0.15, 6000, 0.5);\n  },\n  star: () => { osc('square', 1568, 1568, 0.08, 0.08); osc('square', 2093, 2093, 0.25, 0.08, 0.08); },\n  tick: () => osc('square', 1760, 1760, 0.02, 0.04),\n  boing: () => { osc('triangle', 150, 900, 0.25, 0.25); osc('square', 300, 1200, 0.2, 0.05); },\n  hurt: () => { osc('sawtooth', 400, 80, 0.3, 0.18); noise(0.15, 0.2, 900); },\n  die: () => { [0, 0.12, 0.24, 0.36].forEach((w, i) => osc('square', 440 / (i + 1), 200 / (i + 1), 0.14, 0.14, w)); },\n  poof: () => { noise(0.2, 0.3, 1200); osc('square', 600, 120, 0.15, 0.08); },\n  heal: () => [523, 659, 784].forEach((n, i) => osc('triangle', n, n, 0.12, 0.15, i * 0.06)),\n  check: () => [392, 523, 659, 784].forEach((n, i) => osc('square', n, n, 0.12, 0.08, i * 0.07)),\n  chest: () => [523, 659, 784, 1047, 1319].forEach((n, i) => osc('square', n, n, 0.14, 0.09, i * 0.06)),\n  win: () => [523, 523, 523, 659, 784, 1047].forEach((n, i) => osc('square', n, n, 0.2, 0.1, [0, .12, .24, .36, .5, .7][i])),\n  win2: () => SFX.win(),\n  blob: () => osc('sine', 200, 420, 0.12, 0.12),\n  screech: () => osc('sawtooth', 1800, 1200, 0.12, 0.04),\n  bossStart: () => { noise(0.6, 0.4, 400); osc('sawtooth', 80, 40, 0.6, 0.2); },\n  charge: () => osc('sawtooth', 120, 260, 0.3, 0.12),\n  thud: () => { noise(0.4, 0.5, 300); osc('triangle', 90, 40, 0.3, 0.35); },\n  rumble: () => noise(0.5, 0.3, 200),\n  pop: () => { noise(0.25, 0.4, 600); osc('square', 100, 300, 0.15, 0.12); },\n  boom: () => { noise(0.3, 0.4, 500); osc('triangle', 120, 40, 0.25, 0.25); },\n  bossDie: () => { noise(1, 0.4, 600); [330, 262, 196, 131].forEach((n, i) => osc('square', n, n / 2, 0.3, 0.12, i * 0.2)); },\n  buy: () => [659, 880, 1175].forEach((n, i) => osc('square', n, n, 0.12, 0.1, i * 0.07)),\n  nope: () => osc('square', 160, 120, 0.15, 0.1),\n  click: () => osc('square', 880, 880, 0.04, 0.06),\n};\nexport function sfx(name, v) { if (ac && SFX[name]) SFX[name](v); }\n\n/* ---------- Musik ---------- */\nconst NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };\nconst freq = n => { const m = n.match(/^([A-G]#?)(\\d)$/); if (!m) return 0; return 440 * 2 ** ((NOTE[m[1]] + (+m[2] + 1) * 12 - 69) / 12); };\nconst parse = s => s.trim().split(/\\s+/);\nlet song = null, timer = null, step = 0, nextT = 0;\n\nexport function playMusic(m) {\n  if (song === m) return;\n  stopMusic(); song = m; if (!m || !ac) return;\n  const lead = parse(m.lead), bass = parse(m.bass), dt = 60 / m.bpm / 2;\n  step = 0; nextT = ac.currentTime + 0.1;\n  const len = (arr, i) => { let n = 1; while (arr[(i + n) % arr.length] === '-' && n < 8) n++; return n; };\n  timer = setInterval(() => {\n    if (!ac) return;\n    while (nextT < ac.currentTime + 0.25) {\n      const i = step % lead.length, j = step % bass.length;\n      const l = lead[i], b = bass[j];\n      if (l !== '.' && l !== '-') { const d = dt * len(lead, i); osc('square', freq(l), freq(l), d * 0.9, 0.09, nextT - ac.currentTime, musicGain); osc('square', freq(l) * 1.005, freq(l) * 1.005, d * 0.6, 0.03, nextT - ac.currentTime + 0.01, musicGain); }\n      if (b !== '.' && b !== '-') { const d = dt * len(bass, j); osc('triangle', freq(b), freq(b), d * 0.95, 0.22, nextT - ac.currentTime, musicGain); }\n      if (step % 4 === 0) noiseHat(nextT - ac.currentTime, step % 8 === 0 ? 0.06 : 0.03);\n      nextT += dt; step++;\n    }\n  }, 60);\n}\nfunction noiseHat(when, vol) {\n  if (!ac || !noiseBuf) { noise(0.001, 0.0001); return; }\n  const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();\n  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 6000;\n  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);\n  s.connect(f).connect(g).connect(musicGain); s.start(t); s.stop(t + 0.06);\n}\nexport function stopMusic() { if (timer) clearInterval(timer); timer = null; song = null; }\n","config.js":"// Für Online-Geister hier die Supabase-Projekt-URL und den öffentlichen \"anon\"-Schlüssel eintragen.\n// Der anon-Schlüssel ist dafür gedacht, im Browser zu stehen; die Rechte regeln die Policies (README).\nexport const CONFIG = {\n  version: '0.4.0',\n  supabaseUrl: '',\n  supabaseKey: '',\n};\n","game.js":"// Spiellogik ohne DOM: läuft im Browser und in Node-Tests gleich.\n// Fester Zeitschritt: ein step() = 1/60 Sekunde.\nimport { SHOVEL, ARMOR } from './gear.js';\nimport { weaponMods } from './weapons.js';\n\nexport const T = 16;\nconst SOLID = new Set(['#', 'D', 'S', 'B', '^', 'X', 'V', 'R']);\nconst GRAV = 0.36, MAXFALL = 6.5, BOUNCE = 5.5;\n\nconst overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;\nconst cx = e => e.x + e.w / 2;\nconst sign = v => (v < 0 ? -1 : 1);\n\n// kleiner deterministischer Zufall, damit Geister-Läufe reproduzierbar aussehen\nfunction rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }\n\nexport class Game {\n  constructor(level, gear, opt = {}) {\n    this.level = level;\n    this.sh = SHOVEL[gear.shovel];\n    this.ar = ARMOR[gear.armor];\n    this.gear = gear;\n    this.mod = weaponMods(gear.weapon);\n    this.dmg = Math.round(this.sh.dmg * this.mod.dmgMul);\n    this.reach = this.sh.reach + this.mod.reach;\n    // Statistiken für Sterne und Waffen-Bedingungen\n    this.kills = 0; this.hurtCount = 0; this.bossHurt = 0; this.bossClean = false;\n    this.chain = 0; this.maxChain = 0; this.soulUsed = false; this.streak = 0; this.streakT = 0;\n    this.freeze = 0; this.nums = []; this.banner = null;\n    this.tiles = level.map.map(r => r.split(''));\n    this.h = this.tiles.length;\n    this.w = this.tiles[0].length;\n    this.rand = rng(opt.seed || 7);\n    this.ents = []; this.parts = []; this.events = []; this.vents = []; this.plats = [];\n    this.frame = 0; this.gems = 0; this.deaths = 0; this.dirtTotal = 0;\n    this.done = false; this.shake = 0; this.sign = null; this.boss = null;\n    this.rec = [];\n    const signs = [];\n    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {\n      const c = this.tiles[y][x];\n      if (c === 'D') this.dirtTotal++;\n      if (c === 'V') this.vents.push({ tx: x, ty: y });\n      if ('.#=DSB^XVR'.includes(c)) continue;\n      this.tiles[y][x] = '.';\n      const px = x * T, py = y * T;\n      switch (c) {\n        case 'P': this.spawn = { x: px + 3, y: py + 2 }; break;\n        case 'b': this.add(beetle(px + 1, py + 7)); break;\n        case 'o': this.add(blorb(px + 2, py + 6)); break;\n        case 'v': this.add(bat(px + 2, py + 2)); break;\n        case 'G': this.add(gem(px + 4, py + 4, 5, true)); break;\n        case 'h': this.add({ type: 'apple', x: px + 4, y: py + 8, w: 8, h: 8 }); break;\n        case 'T': this.add({ type: 'chest', x: px + 1, y: py + 4, w: 14, h: 12, open: false, key: `${level.id}:${x}:${y}` }); break;\n        case 'Q': this.add({ type: 'altar', x: px - 4, y: py - 8, w: 24, h: 24, taken: false }); break;\n        case 'C': this.add({ type: 'lantern', x: px + 4, y: py + 2, w: 8, h: 14, lit: false }); break;\n        case 'E': this.add({ type: 'goal', x: px + 2, y: py - 32, w: 12, h: 48 }); break;\n        case 'i': { const s = { type: 'sign', x: px + 1, y: py + 2, w: 14, h: 14, text: '' }; signs.push(s); this.add(s); break; }\n        case 'M': this.boss = this.add(mole(px - 8, py - 10)); break;\n        case 'W': this.boss = this.add(golem(px - 6, py - 14)); break;\n        case 'm': this.plats.push(plat(px, py, 'x')); break;\n        case 'n': this.plats.push(plat(px, py, 'y')); break;\n        case 'z': this.add({ type: 'cog', x: px - 2, y: py - 2, w: 20, h: 20 }); break;\n        case 'k': this.add(knight(px + 2, py + 2)); break;\n        case 'u': this.add(kuckuck(px + 1, py + 3)); break;\n      }\n    }\n    signs.sort((a, b) => a.x - b.x).forEach((s, i) => { s.text = level.signs[i] || ''; });\n    if (!this.spawn) this.spawn = { x: 24, y: 100 };\n    this.check = { ...this.spawn };\n    const p = this.p = {\n      type: 'player', x: this.spawn.x, y: this.spawn.y, w: 10, h: 14, vx: 0, vy: 0,\n      face: 1, hp: this.ar.hp, maxhp: this.ar.hp, atk: 0, atkCd: 0, pogo: false,\n      inv: 0, hurt: 0, safe: 0, coyote: 0, jbuf: 0, jumping: false, dead: 0, drop: 0, anim: 0,\n      land: 0, dash: 0, dashUsed: false,\n    };\n    p.onGround = false;\n  }\n\n  add(e) { this.ents.push(e); return e; }\n  ev(name, x, y, v) { this.events.push({ name, x, y, v }); }\n  num(x, y, txt, col = '#fff') { this.nums.push({ x, y, txt: String(txt), col, life: 40 }); }\n  // Dampfstoss: 70 von 120 Frames aktiv, Säule 6 Kacheln über dem Rohr\n  ventOn(v) { return (this.frame + v.tx * 23) % 120 < 70; }\n  dirtLeft() { let n = 0; for (const r of this.tiles) for (const c of r) if (c === 'D') n++; return n; }\n\n  tile(tx, ty) {\n    if (tx < 0 || tx >= this.w) return '#';\n    if (ty < 0 || ty >= this.h) return '.';\n    return this.tiles[ty][tx];\n  }\n  solid(tx, ty) { return SOLID.has(this.tile(tx, ty)); }\n\n  moveX(b) {\n    b.x += b.vx; b.hitWall = false;\n    const top = Math.floor(b.y / T), bot = Math.floor((b.y + b.h - 0.01) / T);\n    if (b.vx > 0) {\n      const tx = Math.floor((b.x + b.w - 0.01) / T);\n      for (let ty = top; ty <= bot; ty++) if (this.solid(tx, ty)) { b.x = tx * T - b.w; b.vx = 0; b.hitWall = true; break; }\n    } else if (b.vx < 0) {\n      const tx = Math.floor(b.x / T);\n      for (let ty = top; ty <= bot; ty++) if (this.solid(tx, ty)) { b.x = (tx + 1) * T; b.vx = 0; b.hitWall = true; break; }\n    }\n  }\n  moveY(b) {\n    const prevBot = b.y + b.h;\n    b.y += b.vy; b.onGround = false; b.spike = false; b.ground = null;\n    const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - 0.01) / T);\n    if (b.vy > 0) {\n      const ty = Math.floor((b.y + b.h) / T);\n      for (let tx = l; tx <= r; tx++) {\n        const c = this.tile(tx, ty);\n        if (SOLID.has(c) || (c === '=' && prevBot <= ty * T + 0.5 && !b.drop)) {\n          b.y = ty * T - b.h; b.vy = 0; b.onGround = true;\n          if (c === '^') b.spike = true;\n          if (!b.ground || c === 'B') b.ground = { c, tx, ty };\n        }\n      }\n    } else if (b.vy < 0) {\n      const ty = Math.floor(b.y / T);\n      for (let tx = l; tx <= r; tx++) if (this.solid(tx, ty)) { b.y = (ty + 1) * T; b.vy = 0; b.hitCeil = true; break; }\n    }\n  }\n\n  burst(x, y, n, col, spd = 2, grav = 0.15, life = 30) {\n    for (let i = 0; i < n; i++) {\n      const a = this.rand() * Math.PI * 2, v = spd * (0.3 + this.rand());\n      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: life * (0.6 + this.rand() * 0.6), col, grav });\n    }\n  }\n  dropGems(x, y, total) {\n    while (total > 0) {\n      const v = total >= 20 && this.rand() < 0.4 ? 20 : total >= 5 && this.rand() < 0.6 ? 5 : 1;\n      total -= v;\n      const g = this.add(gem(x - 3, y - 3, v, false));\n      g.vx = (this.rand() - 0.5) * 3; g.vy = -2 - this.rand() * 2.5;\n    }\n  }\n  dig(tx, ty) {\n    // Erdfresser: 3×3 Erde auf einmal\n    this.breakTile(tx, ty);\n    if (!this.mod.area) return;\n    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (this.tile(tx + dx, ty + dy) === 'D') this.breakTile(tx + dx, ty + dy);\n  }\n  breakTile(tx, ty) {\n    const c = this.tile(tx, ty);\n    if (c !== 'D' && c !== 'S' && c !== 'R') return;\n    this.tiles[ty][tx] = '.';\n    this.burst(tx * T + 8, ty * T + 8, 12, c === 'S' ? 'stone' : c === 'R' ? 'ore' : 'dirt', 2.2);\n    this.shake = Math.max(this.shake, 3);\n    this.ev(c === 'S' ? 'crack' : 'dig', tx * T, ty * T);\n    this.dropGems(tx * T + 8, ty * T + 8, c === 'R' ? 45 : c === 'S' ? 12 : (2 + Math.floor(this.rand() * 5)) * this.mod.dirtMul);\n  }\n\n  step(inp) {\n    this.events.length = 0;\n    for (const n of this.nums) { n.y -= 0.5; n.life--; }\n    this.nums = this.nums.filter(n => n.life > 0);\n    if (this.banner && --this.banner.t <= 0) this.banner = null;\n    // Hit-Stop: kurze Standbilder machen Treffer spürbar\n    if (this.freeze > 0) { this.freeze--; if (inp.jumpP) this.p.jbuf = 7; if (inp.attackP) this.pendAtk = true; return; }\n    if (this.streakT > 0 && --this.streakT === 0) this.streak = 0;\n    if (!this.done) this.frame++;\n    for (const pl of this.plats dx = cx(g.p) - cx(e);\n        if (--e.t <= 0 && Math.abs(dx) < 150) { e.vy = -4.2; e.vx = sign(dx) * 1.3; e.t = 70; g.ev('blob', e.x, e.y); }\n      }\n      g.moveX(e); g.moveY(e);\n      if (e.y > g.h * T + 20) e.dead = true;\n    } });\n}\nfunction bat(x, y) {\n  return foeBase({ type: 'bat', x, y, w: 12, h: 8, hp: 1, dmg: 1, state: 'hang', t: 0, loot: 6,\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      const dx = cx(g.p) - cx(e), dy = g.p.y - e.y;\n      if (e.state === 'hang') { if (Math.abs(dx) < 96 && Math.abs(dy) < 110) { e.state = 'fly'; g.ev('screech', e.x, e.y); } return; }\n      e.t++;\n      e.vx = Math.max(-1.25, Math.min(1.25, e.vx + sign(dx) * 0.05));\n      e.vy = Math.max(-0.9, Math.min(0.9, dy * 0.02)) + Math.sin(e.t / 9) * 0.9;\n      e.x += e.vx; e.y += e.vy;\n    } });\n}\n\nfunction mole(x, y) {\n  const m = foeBase({ type: 'mole', x, y, w: 30, h: 26, hp: 24, maxhp: 24, dmg: 2, state: 'idle', t: 0, face: -1, next: 'charge',\n    home: { x, y },\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      const p = g.p, dx = cx(p) - cx(e), fast = e.hp <= e.maxhp / 2 ? 1.35 : 1;\n      const grav = () => { e.vy = Math.min(MAXFALL, e.vy + GRAV); g.moveX(e); g.moveY(e); };\n      switch (e.state) {\n        case 'idle': grav(); return;\n        case 'roar': e.vx = 0; grav(); if (--e.t <= 0) { e.state = 'walk'; e.t = 80; } if (e.t % 10 === 0) g.shake = 3; return;\n        case 'walk':\n          e.face = sign(dx); e.vx = e.face * 0.7 * fast; grav();\n          if (--e.t <= 0) { e.state = e.next === 'charge' ? 'wind' : 'sink'; e.next = e.next === 'charge' ? 'dig' : 'charge'; e.t = 34; }\n          return;\n        case 'wind': e.vx = 0; e.face = sign(dx); grav(); if (--e.t <= 0) { e.state = 'charge'; g.ev('charge'); } return;\n        case 'charge':\n          e.vx = e.face * 3.3 * fast; grav();\n          if (e.hitWall) {\n            e.state = 'stun'; e.t = 70; g.shake = 9; g.ev('thud');\n            for (let k = 0; k < (fast > 1 ? 5 : 3); k++) {\n              const rx = (g.level.gate + 2 + Math.floor(g.rand() * 22)) * T;\n              g.add(rock(rx, 2 * T + 2, 16 + k * 14));\n            }\n          }\n          return;\n        case 'stun': e.vx = 0; grav(); if (--e.t <= 0) { e.state = 'walk'; e.t = 60; } return;\n        case 'sink':\n          e.vx = 0; if (e.t % 4 === 0) g.burst(cx(e), e.y + e.h, 3, 'dirt', 1.5);\n          if (--e.t <= 0) { e.state = 'under'; e.hidden = true; e.t = 70; }\n          return;\n        case 'under':\n          e.tx = cx(p);\n          if (e.t < 36 && e.t % 3 === 0) g.burst(e.tx, 11 * T, 2, 'dirt', 1.4);\n          if (e.t === 36) g.ev('rumble');\n          if (--e.t <= 0) {\n            e.hidden = false; e.x = Math.max((g.level.gate + 1) * T, Math.min((g.w - 1) * T - e.w, e.tx - e.w / 2));\n            e.y = 11 * T - e.h; e.vy = -6.5; e.state = 'pop'; g.shake = 7; g.ev('pop');\n            g.burst(cx(e), 11 * T, 20, 'dirt', 3);\n          }\n          return;\n        case 'pop': grav(); if (e.onGround) { e.state = 'walk'; e.t = 70; } return;\n        case 'dying':\n          e.vx = 0; grav();\n          if (e.t % 8 === 0) { g.burst(e.x + g.rand() * e.w, e.y + g.rand() * e.h, 10, 'poof', 2.5, 0, 24); g.ev('boom'); g.shake = 6; }\n          if (--e.t <= 0) {\n            e.dead = true; g.dropGems(cx(e), e.y, 300);\n            g.add({ type: 'goal', x: Math.round(cx(e) / T) * T + 2, y: 11 * T - 48, w: 12, h: 48 });\n            g.setGate('.'); g.ev('win2');\n          }\n          return;\n      }\n    } });\n  return m;\n}\nfunction rock(x, y, delay) {\n  return { type: 'rock', x, y, w: 10, h: 10, vy: 0, vx: 0, delay,\n    update(g, e) {\n      if (e.delay > 0) { e.delay--; return; }\n      e.vy = Math.min(7, e.vy + 0.25); e.y += e.vy;\n      if (g.solid(Math.floor((e.x + 5) / T), Math.floor((e.y + e.h) / T))) {\n        e.dead = true; g.burst(e.x + 5, e.y + 8, 10, 'stone', 2); g.ev('crack');\n      }\n    } };\n}\n\n// Projektile der Waffen (Sterne, Erdwelle)\nfunction proj(x, y, vx, vy, dmg, kind) {\n  return { type: 'proj', kind, x, y, w: kind === 'wave' ? 10 : 6, h: kind === 'wave' ? 10 : 6, vx, vy, dmg, life: kind === 'wave' ? 40 : 50, hit: new Set(),\n    update(g, e) {\n      e.x += e.vx; e.y += e.vy; e.vy += kind === 'star' ? 0.08 : 0;\n      if (--e.life <= 0 || g.solid(Math.floor((e.x + e.w / 2) / T), Math.floor((e.y + e.h / 2) / T))) {\n        e.dead = true; g.burst(e.x + 3, e.y + 3, 6, kind === 'wave' ? 'dirt' : 'spark', 1.5); return;\n      }\n      if (kind === 'wave' && !g.solid(Math.floor((e.x + e.w / 2) / T), Math.floor((e.y + e.h + 2) / T))) { e.dead = true; return; }\n      if (g.frame % 3 === 0) g.parts.push({ x: e.x + 3, y: e.y + 3, vx: 0, vy: kind === 'wave' ? -1 : 0, life: 12, col: kind === 'wave' ? 'dirt' : 'star', grav: 0.05 });\n      for (const f of g.ents) if (f.foe && !f.hidden && !f.dead && !e.hit.has(f) && overlap(e, f)) { e.hit.add(f); f.hurtBy(g, f, e.dmg, sign(e.vx)); if (kind === 'star') e.dead = true; }\n      for (const f of g.ents) if (f.type === 'chest' && !f.open && overlap(e, f)) g.openChest(f);\n    } };\n}\n\n/* ---------- Welt 2: Uhrturm ---------- */\nfunction plat(x, y, axis) {\n  // 3 Kacheln breit, schwingt 3 Kacheln (waagrecht) bzw. 3 Kacheln (senkrecht) um den Ursprung\n  const ph = (x / T) * 0.45 + (y / T) * 0.4; // benachbarte Plattformen schwingen gegenläufig\n  return { type: 'plat', axis, ox: x, oy: y, x, y, w: 48, h: 8, dx: 0, dy: 0,\n    update(g, e) {\n      const t = g.frame * 0.022 + ph, nx = axis === 'x' ? e.ox + Math.sin(t) * 48 : e.ox, ny = axis === 'y' ? e.oy + Math.sin(t) * 48 : e.oy;\n      e.dx = nx - e.x; e.dy = ny - e.y; e.x = nx; e.y = ny;\n    } };\n}\nfunction knight(x, y) {\n  return foeBase({ type: 'knight', x, y, w: 12, h: 14, hp: 3, dmg: 1, dir: -1, t: 0, loot: 14,\n    hurtBy(g, e, dmg, dir, src) {\n      const front = sign(cx(g.p) - cx(e)) === e.dir;\n      if (src !== 'pogo' && dir && front) {\n        g.ev('clink'); g.burst(e.dir > 0 ? e.x + e.w : e.x, e.y + 7, 8, 'spark', 2, 0.05, 12);\n        if (!g.p.dead) { g.p.vx = e.dir * 2.4; g.p.hurt = Math.max(g.p.hurt, 6); }\n        g.num(cx(e), e.y - 4, 'BLOCK', '#a9b5c2'); e.vx = -e.dir * 0.8;\n        return;\n      }\n      hurtFoe(g, e, dmg, dir, src);\n    },\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      const dx = cx(g.p) - cx(e);\n      if (++e.t % 80 === 0 && Math.abs(dx) < 130) e.dir = sign(dx);\n      if (Math.abs(e.vx) > 0.5) e.vx *= 0.85; else e.vx = 0.35 * e.dir;\n      e.vy = Math.min(MAXFALL, e.vy + GRAV);\n      g.moveX(e); if (e.hitWall) e.dir *= -1;\n      g.moveY(e);\n      if (e.onGround) { const ahead = Math.floor((e.dir > 0 ? e.x + e.w + 1 : e.x - 1) / T); if (!g.solid(ahead, Math.floor((e.y + e.h + 2) / T))) e.dir *= -1; }\n      if (e.y > g.h * T + 20) e.dead = true;\n    } });\n}\nfunction kuckuck(x, y) {\n  return foeBase({ type: 'kuckuck', x, y, w: 14, h: 10, hp: 1, dmg: 1, ox: x, oy: y, dir: 1, t: 0, loot: 10,\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      e.t++; e.x += e.dir * 0.8;\n      if (e.x > e.ox + 56) e.dir = -1; if (e.x < e.ox - 56) e.dir = 1;\n      e.y = e.oy + Math.sin(e.t / 20) * 3;\n      if (e.t % 110 === 0 && Math.abs(cx(g.p) - cx(e)) < 120 && g.p.y > e.y) { g.add(eproj(cx(e) - 2, e.y + e.h, 0, 2.4, 'bolt')); g.ev('screech'); }\n    } });\n}\nfunction eproj(x, y, vx, vy, kind) {\n  const sz = { shock: [12, 10], gear: [12, 12], bolt: [4, 8] }[kind];\n  return { type: 'eproj', kind, x, y, w: sz[0], h: sz[1], vx, vy, dmg: 1, life: kind === 'gear' ? 300 : 160, bounces: 0,\n    update(g, e) {\n      if (--e.life <= 0) { e.dead = true; return; }\n      if (kind === 'bolt') { e.y += e.vy; if (g.solid(Math.floor((e.x + 2) / T), Math.floor((e.y + e.h) / T))) { e.dead = true; g.burst(e.x + 2, e.y + 6, 5, 'spark', 1.2); } return; }\n      if (kind === 'shock') { g.moveX(e); if (e.hitWall) { e.dead = true; g.burst(e.x + 6, e.y + 6, 8, 'dust', 1.5); } if (g.frame % 2) g.parts.push({ x: e.x + 2 + g.rand() * 8, y: e.y + 8, vx: 0, vy: -1.2, life: 12, col: 'spark', grav: 0.05 }); return; }\n      e.vy = Math.min(MAXFALL, e.vy + GRAV * 0.8); const vy = e.vy;\n      g.moveX(e); if (e.hitWall) { e.dead = true; g.burst(e.x + 6, e.y + 6, 8, 'spark', 1.5); return; }\n      g.moveY(e); if (e.onGround && vy > 1 && e.bounces < 2) { e.vy = -vy * 0.55; e.bounces++; }\n    } };\n}\nfunction golem(x, y) {\n  return foeBase({ type: 'golem', title: 'PENDELWERK', x, y, w: 28, h: 30, hp: 32, maxhp: 32, dmg: 2, state: 'idle', t: 0, face: -1, cyc: 0, home: { x, y },\n    update(g, e) {\n      if (e.iframe) e.iframe--; if (e.flash) e.flash--;\n      const p = g.p, dx = cx(p) - cx(e), fast = e.hp <= e.maxhp / 2 ? 1.3 : 1;\n      const grav = () => { e.vy = Math.min(MAXFALL, e.vy + GRAV); g.moveX(e); g.moveY(e); };\n      switch (e.state) {\n        case 'idle': grav(); return;\n        case 'roar': e.vx = 0; grav(); if (e.t % 10 === 0) g.shake = 3; if (--e.t <= 0) { e.state = 'walk'; e.t = 70; } return;\n        case 'walk':\n          e.face = sign(dx); e.vx = e.face * 0.6 * fast; grav();\n          if (--e.t <= 0) { e.state = e.cyc++ % 2 ? 'throw' : 'crouch'; e.t = e.state === 'crouch' ? 26 : 36; }\n          return;\n        case 'crouch': e.vx = 0; grav(); if (--e.t <= 0) { e.state = 'leap'; e.vy = -7.2; e.vx = Math.max(-2.4, Math.min(2.4, dx / 36)); g.ev('charge'); } return;\n        case 'leap':\n          grav(); if (e.hitWall) e.vx = 0;\n          if (e.onGround) {\n            e.state = 'tired'; e.t = 80; g.shake = 9; g.ev('thud'); g.freeze = Math.max(g.freeze, 4);\n            for (const d of [-1, 1]) g.add(eproj(cx(e) - 6 + d * 12, e.y + e.h - 10, d * 3 * fast, 0, 'shock'));\n          }\n          return;\n        case 'throw':\n          e.vx = 0; e.face = sign(dx); grav();\n          if (e.t % 10 === 0 && e.t > 0 && (e.t <= 30 || fast > 1)) { g.add(eproj(cx(e) - 6, e.y + 2, e.face * (1.2 + g.rand() * 1.3) * fast, -3.8, 'gear')); g.ev('swing'); }\n          if (--e.t <= 0) { e.state = 'walk'; e.t = 80; }\n          return;\n        case 'tired': e.vx = 0; grav(); if (--e.t <= 0) { e.state = 'walk'; e.t = 50; } return;\n        case 'dying':\n          e.vx = 0; grav();\n          if (e.t % 8 === 0) { g.burst(e.x + g.rand() * e.w, e.y + g.rand() * e.h, 10, 'spark', 2.5, 0, 24); g.ev('boom'); g.shake = 6; }\n          if (--e.t <= 0) {\n            e.dead = true; g.dropGems(cx(e), e.y, 400);\n            g.add({ type: 'goal', x: Math.round(cx(e) / T) * T + 2, y: e.y + e.h - 48, w: 12, h: 48 });\n            g.setGate('.'); g.ev('win2');\n          }\n          return;\n      }\n    } });\n}\n","gear.js":"// Ausrüstung: 12 Materialstufen. AVAILABLE bestimmt, wie viele aktuell kaufbar sind.\n// Neue Welten schalten weitere Stufen frei (AVAILABLE erhöhen + Perks implementieren).\n\nexport const TIERS = [\n  { id: 'holz',           name: 'Holz',           dark: '#6b4426', light: '#b98a52' },\n  { id: 'bronze',         name: 'Bronze',         dark: '#8a4f1f', light: '#e9a25a' },\n  { id: 'eisen',          name: 'Eisen',          dark: '#4e5866', light: '#a9b5c2' },\n  { id: 'stahl',          name: 'Stahl',          dark: '#5f7894', light: '#eef5fc' },\n  { id: 'titan',          name: 'Titan',          dark: '#454f75', light: '#bcc8f2' },\n  { id: 'adamantium',     name: 'Adamantium',     dark: '#17735a', light: '#7dffcf' },\n  { id: 'mithril',        name: 'Mithril',        dark: '#7f8cb3', light: '#ffffff' },\n  { id: 'sternenmetall',  name: 'Sternenmetall',  dark: '#33247a', light: '#c9a8ff' },\n  { id: 'drachenknochen', name: 'Drachenknochen', dark: '#a07e52', light: '#fff2cf' },\n  { id: 'leerekristall',  name: 'Leere-Kristall', dark: '#1e0e38', light: '#ff4fd8' },\n  { id: 'chronostahl',    name: 'Chronostahl',    dark: '#75560c', light: '#ffd84a' },\n  { id: 'urlicht',        name: 'Urlicht',        dark: '#ff9f3a', light: '#ffffff' },\n];\n\nexport const AVAILABLE = 6;           // Welt 1: bis Stahl · Welt 2: Titan, Adamantium\nexport const PRICE = [0, 150, 450, 1100, 2400, 4200, 7000, 11000, 16000, 23000, 32000, 45000];\n\n// dmg: Schaden · reach: Reichweite in px · stone: zerschlägt Stein · pogo: Abprall-Faktor\nexport const SHOVEL = [\n  { dmg: 1, reach: 14, pogo: 1.00, perk: 'Gräbt Erde' },\n  { dmg: 2, reach: 15, pogo: 1.00, perk: 'Doppelter Schaden' },\n  { dmg: 2, reach: 16, pogo: 1.04, stone: true, perk: 'Zerschlägt Stein' },\n  { dmg: 3, reach: 19, pogo: 1.12, stone: true, perk: 'Mehr Reichweite, höherer Abpraller' },\n  { dmg: 4, reach: 19, pogo: 1.12, stone: true, pogoDmg: 2, perk: 'Schaufel-Sprung trifft doppelt' },\n  { dmg: 5, reach: 20, pogo: 1.15, stone: true, pogoDmg: 2, ore: true, perk: 'Gräbt violettes Erz' },\n  { dmg: 5, reach: 22, pogo: 1.18, stone: true, perk: 'Federleicht: schnellere Hiebe' },\n  { dmg: 6, reach: 22, pogo: 1.18, stone: true, perk: 'Sternenhieb (Projektil)' },\n  { dmg: 7, reach: 24, pogo: 1.20, stone: true, perk: 'Feuerspur beim Abpraller' },\n  { dmg: 8, reach: 24, pogo: 1.22, stone: true, perk: 'Gleitet kurz durch Wände' },\n  { dmg: 9, reach: 26, pogo: 1.24, stone: true, perk: 'Zeitlupe beim Abpraller' },\n  { dmg: 12, reach: 28, pogo: 1.28, stone: true, perk: 'Alles leuchtet' },\n];\n\n// hp: Herzen · kb: Rückstoss-Faktor · spike: Schaden durch Stacheln\nexport const ARMOR = [\n  { hp: 4,  kb: 1.0, spike: 2, perk: 'Basisschutz' },\n  { hp: 6,  kb: 1.0, spike: 2, perk: '+2 Herzen' },\n  { hp: 8,  kb: 0.6, spike: 2, perk: '+2 Herzen, weniger Rückstoss' },\n  { hp: 10, kb: 0.5, spike: 1, perk: '+2 Herzen, Stacheln halb so schlimm' },\n  { hp: 11, kb: 0.5, spike: 1, inv: 110, perk: 'Längerer Schutz nach Treffer' },\n  { hp: 12, kb: 0.0, spike: 1, inv: 110, perk: 'Kein Rückstoss mehr' },\n  { hp: 12, kb: 0.0, spike: 1, inv: 110, perk: 'Lava-fest' },\n  { hp: 13, kb: 0.0, spike: 1, inv: 110, perk: 'Doppelsprung' },\n  { hp: 14, kb: 0.0, spike: 0, inv: 110, perk: 'Stacheln egal' },\n  { hp: 15, kb: 0.0, spike: 0, inv: 110, perk: 'Unsichtbar für Fledermäuse' },\n  { hp: 16, kb: 0.0, spike: 0, inv: 110, perk: 'Rückspulen bei Absturz' },\n  { hp: 20, kb: 0.0, spike: 0, inv: 130, perk: 'Ewiger Glanz' },\n];\n","ghost.js":"// Geister: Aufzeichnung eines Laufs (x, y, Pose alle 2 Frames) als teilbarer Code.\n// Format: \"SH1.\" + base64url(JSON-Kopf) + \".\" + base64url(Bytes) — Bytes optional deflate-komprimiert.\n// Bytes pro Sample: dx, dy (Int8) und Flags. Grosse Sprünge (Respawn) via Escape 127 + 2×Int16.\n\nconst b64 = {\n  enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, ''); },\n  dec(str) { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },\n};\nconst txt = { enc: s => new TextEncoder().encode(s), dec: b => new TextDecoder().decode(b) };\n\nasync function pipe(bytes, Stream, fmt) {\n  const out = new Response(new Blob([bytes]).stream().pipeThrough(new Stream(fmt)));\n  return new Uint8Array(await out.arrayBuffer());\n}\nconst canZip = () => typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';\n\nexport async function encodeGhost({ level, name, frames, gear, rec }) {\n  const out = [];\n  let px = 0, py = 0;\n  for (const [x, y, f] of rec) {\n    const dx = x - px, dy = y - py;\n    if (dx > -127 && dx < 127 && dy > -127 && dy < 127) out.push(dx & 255, dy & 255, f & 255);\n    else out.push(127, x & 255, (x >> 8) & 255, y & 255, (y >> 8) & 255, f & 255);\n    px = x; py = y;\n  }\n  let bytes = new Uint8Array(out), z = 0;\n  if (canZip()) { try { bytes = await pipe(bytes, CompressionStream, 'deflate-raw'); z = 1; } catch { z = 0; bytes = new Uint8Array(out); } }\n  const head = { v: 1, l: level, n: String(name || 'Anonym').slice(0, 16), t: frames, s: gear.shovel, a: gear.armor, z, c: rec.length };\n  return 'SH1.' + b64.enc(txt.enc(JSON.stringify(head))) + '.' + b64.enc(bytes);\n}\n\nexport async function decodeGhost(code) {\n  try {\n    const [tag, h, d] = String(code).trim().split('.');\n    if (tag !== 'SH1') return null;\n    const head = JSON.parse(txt.dec(b64.dec(h)));\n    let bytes = b64.dec(d);\n    if (head.z) bytes = await pipe(bytes, DecompressionStream, 'deflate-raw');\n    const rec = [];\n    let x = 0, y = 0, i = 0;\n    const s8 = v => (v > 127 ? v - 256 : v);\n    while (i < bytes.length && rec.length < head.c) {\n      if (bytes[i] === 127) {\n        x = s16(bytes[i + 1] | bytes[i + 2] << 8); y = s16(bytes[i + 3] | bytes[i + 4] << 8);\n        rec.push([x, y, bytes[i + 5]]); i += 6;\n      } else { x += s8(bytes[i]); y += s8(bytes[i + 1]); rec.push([x, y, bytes[i + 2]]); i += 3; }\n    }\n    return { level: head.l, name: head.n, frames: head.t, gear: { shovel: head.s, armor: head.a }, rec };\n  } catch { return null; }\n}\nconst s16 = v => (v > 32767 ? v - 65536 : v);\n\n// Position des Geists zu einem Frame (mit Interpolation)\nexport function ghostAt(g, frame) {\n  const r = g.rec; if (!r.length) return null;\n  const k = frame / 2 - 1, i = Math.floor(k);\n  if (i >= r.length - 1) return { x: r[r.length - 1][0], y: r[r.length - 1][1], f: r[r.length - 1][2], finished: true };\n  if (i < 0) return { x: r[0][0], y: r[0][1], f: r[0][2] };\n  const a = r[i], b = r[i + 1], t = k - i;\n  if (Math.abs(b[0] - a[0]) > 40 || Math.abs(b[1] - a[1]) > 40) return { x: a[0], y: a[1], f: a[2] };\n  return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, f: t < 0.5 ? a[2] : b[2] };\n}\n\nexport const fmtTime = frames => {\n  const s = frames / 60, m = Math.floor(s / 60);\n  return `${m}:${(s - m * 60).toFixed(2).padStart(5, '0')}`;\n};\n","heroart.js":"// Pixel-Art für Held, Rüstungen, Schaufeln und Spezialwaffen.\n// Held: 20×24-Rahmen, Körper beginnt bei x=4, y= t.dataset.k] = true; touch[best.dataset.k] = true; }\n    }\n    for (const b of btns) b.classList.toggle('on', !!touch[b.dataset.k]);\n    onAny && onAny(e);\n  };\n  for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) touchEl.addEventListener(ev, update, { passive: false });\n}\n\nexport function pollInput() {\n  const pad = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;\n  const gp = {};\n  if (pad) {\n    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0, b = i => pad.buttons[i] && pad.buttons[i].pressed;\n    gp.left = ax < -0.4 || b(14); gp.right = ax > 0.4 || b(15); gp.down = ay > 0.5 || b(13);\n    gp.jump = b(0); gp.attack = b(2) || b(1);\n  }\n  for (const n of NAMES) {\n    const v = !!(kb[n] || touch[n] || gp[n]);\n    input[n] = v;\n    if (n === 'jump') input.jumpP = (v && !prev.jump) || !!latch.jump;\n    if (n === 'attack') input.attackP = (v && !prev.attack) || !!latch.attack;\n    latch[n] = false;\n    prev[n] = v;\n  }\n  return input;\n}\nexport function clearInput() { for (const n of NAMES) { kb[n] = false; touch[n] = false; prev[n] = true; latch[n] = false; } }\n","levels.js":"// Levels werden aus 20 Kacheln breiten Segmenten zusammengesetzt (14 Reihen hoch).\n// Kürzere Segmente werden oben mit Luft aufgefüllt.\n//\n// Kacheln:  # Boden   = Plattform (von unten durchspringbar)   D Erde (grabbar)\n//           S Stein (ab Eisen-Schaufel)   ^ Stacheln   B Sprungpilz\n// Objekte:  P Start   C Laterne/Checkpoint   E Ziel   G Edelstein   h Apfel\n//           T Truhe   i Schild   b Käfer   o Blorb   v Fledermaus   M Boss   Q Altar\n\nexport const ROWS = 14; // Standardhöhe; Levels dürfen höher sein (siehe 1-3)\n\nfunction seg(...rows) {\n  while (rows.length < ROWS) rows.unshift('');\n  return rows;\n}\nfunction build(segs) {\n  const out = Array.from({ length: ROWS }, () => '');\n  for (const s of segs) {\n    const w = Math.max(...s.map(r => r.length));\n    s.forEach((r, i) => { out[i] += r.padEnd(w, '.'); });\n  }\n  return out;\n}\nconst G3 = '####################';\nconst CEIL = [G3, G3];\n\n/* ---------- 1-1 Moosweg ---------- */\nconst L1 = build([\n  seg('..............G.G...',\n      '....................',\n      '.............===....',\n      '.P.i...i.D..........', G3, G3, G3),\n  seg('..........GGG.......',\n      '....................',\n      '...............##...',\n      '...i..b.....DD.##...', G3, G3, G3),\n  seg('......GG............',\n      '....................',\n      '....................',\n      '..........b.........',\n      '####...####^^^######',\n      '####...#############',\n      '####...#############'),\n  seg('..............G.....',\n      '.............===....',\n      '....................',\n      '.........===........',\n      '................DDD.',\n      '.....===........DDD.',\n      '..C....h........DDD.', G3, G3, G3),\n  seg('.....v..............',\n      '....................',\n      '....................',\n      '......===..===......',\n      '....................',\n      '####............####',\n      '####............####',\n      '####............####'),\n  seg('..............SSS...',\n      '....b....i....STS...', G3, G3, G3),\n  seg('...GGG..............',\n      '....................',\n      '....................',\n      '...........o....E...', G3, G3, G3),\n]);\n\n/* ---------- 1-2 Wurzelhöhlen ---------- */\nconst L2 = build([\n  seg(...CEIL, '', '', '', '', '',\n      '...........G.G.G....',\n      '....................',\n      '..........=======...',\n      '.P.i...D......o.....', G3, G3, G3),\n  seg(...CEIL, '', '', '', '', '', '', '', '',\n      '......D...D...D.....',\n      '####..............##',\n      '####..............##',\n      '####^^^^^^^^^^^^^^##'),\n  seg(...CEIL,\n      '...........G........',\n      '..........===.......',\n      '....................',\n      '......===......v....',\n      '....................',\n      '..........===.......',\n      '....................',\n      '......===...........',\n      '..C.................', G3, G3, G3),\n  seg(G3, G3, G3, G3, G3, G3, G3, G3,\n      '......DD.......D....',\n      '......DD....o..D....',\n      '......DD.......D....', G3, G3, G3),\n  seg(...CEIL, '', '', '', '', '', '', '',\n      '........===.........',\n      '..o..............o..',\n      '######.......#######',\n      '######.......#######',\n      '######.......#######'),\n  seg(...CEIL, '', '', '', '', '',\n      '....GGG.............',\n      '....................',\n      '...===.......SSS....',\n      '.........o...STS..E.', G3, G3, G3),\n]);\n\n/* ---------- 1-3 Dornenkamm ---------- */\nconst WALL = '..........##########';\nconst L3 = build([\n  seg('...........GGG......',\n      '....................',\n      '....................',\n      '....................',\n      '.P.i....B...........',\n      '##########...#######',\n      '##########...#######',\n      '##########^^^#######'),\n  seg('....v.....v....v....',\n      '....................',\n      '....................',\n      '......=...=...=.....',\n      '....................',\n      '###^^^^^^^^^^^^^^###', G3, G3),\n  seg('...........GGG......',\n      '....................',\n      WALL, WALL, WALL, WALL, WALL,\n      '...i...B..##########', G3, G3, G3),\n  seg('......b.............',\n      '##########...#######', '##########...#######', '##########...#######',\n      '##########...#######', '##########...#######', '##########...#######',\n      '##########...#######', '##########...#######', '##########...#######'),\n  seg('..C.................',\n      '######..............',\n      '######..............',\n      '######...o..........',\n      '######..####........',\n      '######..####...v....',\n      '######..####........', G3, G3, G3),\n  seg('....GGG.............',\n      '....................',\n      'SSS===..............',\n      'STS...b....B....E...', G3, G3, G3),\n]);\n\n// Geheimer Himmelspfad über dem Dornenkamm: 6 zusätzliche Reihen oben
