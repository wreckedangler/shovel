<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101d21"><title>Die versunkene Sternwarte · Schaufelheld</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark;background:#0d181d;color:#f4e3c1;font:15px/1.35 system-ui,sans-serif}body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#283d41,#0b151a 72%)}main{width:min(1120px,100%);padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left))}header,footer,nav,.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header,footer,nav{justify-content:space-between}h1{font:clamp(20px,3vw,34px)/1.15 Georgia,serif;margin:0;color:#fff1cf}header{margin-bottom:10px}button,select{border:1px solid #617377;background:#182a30;color:#fff2d4;font:inherit;border-radius:5px;min-height:36px;padding:5px 10px;cursor:pointer}button:active,button.held{background:#796039}select{max-width:65vw}article{height:clamp(265px,64svh,580px);position:relative;border:1px solid #747468;border-radius:6px;overflow:hidden;background:#112731}canvas{width:100%;height:100%;display:block}output{font-size:13px;color:#d7e6df}nav,footer{margin-top:8px}#status{color:#efcb86;font-weight:650}#message{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:7px 12px;background:#142328;color:#ffe6ac;border-radius:4px;text-align:center}#message:empty{display:none}.pad{display:flex;gap:5px}.pad button{min-width:46px;min-height:46px;touch-action:none;user-select:none;-webkit-user-select:none}footer{color:#b8c9c6;font-size:13px}#progress{font-variant-numeric:tabular-nums} @media(max-height:500px){main{padding:3px 8px}article{height:calc(100svh - 122px);min-height:135px}header,nav{margin:3px 0}footer{margin:0;font-size:11px}h1{font-size:19px}.pad button{min-height:35px}button,select{min-height:30px}}@media(max-width:520px){main{padding:8px}header{gap:6px}h1{font-size:21px}article{height:53svh}footer{align-items:start}.right{gap:5px}.pad button{min-width:42px}#keys{display:none}}
</style></head><body><main><header><h1>Die versunkene Sternwarte</h1><div class="right"><select id="suit" aria-label="Ausrüstung"></select><button id="zoom" aria-pressed="false">Nahansicht</button><button id="reset" title="Parcours von vorne beginnen">Neustart</button></div></header>
